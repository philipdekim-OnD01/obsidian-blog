<script id="deck-data" type="application/json">{"id":"EX_06","slug":"Softmax_Classification","name":"Softmax 3개 클래스 분류","sourceFile":"EX_06_Blood_Pressure_Softmax_Classification.20260504.ipynb","slides":[{"title":"혈압 상태를 세 등급으로 구분한다","lead":"EX 06 | 0/1이 아닌 정상·주의·경고 중 하나를 선택한다.","code":"입력 2개    →    정답 3개    →    Softmax\n범주형 손실    →    argmax","sideTitle":"이 예제에서 배우는 것","explain":"입력은 [나이, BMI], 출력은 세 개의 클래스 점수이다.\n정답은 원-핫(one-hot) 배열로 저장하고 softmax로 가장 큰 클래스를 선택한다.","insight":"핵심: 코드의 실행 순서를 따라가며 입력과 출력의 관계를 설명할 수 있으면 성공이다.","cell":"","kind":"cover","label":"학습 흐름"},{"title":"입력은 AGE와 BMI 두 개","lead":"EX 04, 05와 같은 18개 조합을 사용한다.","code":"x_input = tf.constant([\n    [25, 22], [25, 26], [25, 30],\n    [35, 22], [35, 26], [35, 30],\n    [45, 22], [45, 26], [45, 30],\n    [55, 22], [55, 26], [55, 30],\n    [65, 22], [65, 26], [65, 30],\n    [73, 22], [73, 26], [73, 30]\n], dtype=tf.float32)","sideTitle":"입력과 출력의 차이","explain":"x_input shape = (18, 2).\n\n각 행은 사람 한 명의 나이와 BMI를 뜻한다.\n\n이전 예제와 다른 것은 정답(labels)의 형태다.","insight":"같은 입력 데이터도 문제 정의에 따라 회귀 또는 분류에 쓸 수 있다.","cell":"4","kind":"code","label":"핵심 코드"},{"title":"정답은 one-hot으로 표현한다","lead":"정상 [1,0,0], 주의 [0,1,0], 경고 [0,0,1].","code":"labels = tf.constant([\n    [1, 0, 0],  # 정상\n    [0, 1, 0],  # 주의\n    [0, 0, 1],  # 경고\n    # ... 총 18개 정답\n], dtype=tf.float32)","sideTitle":"원-핫을 읽는 법","explain":"1이 들어 있는 자리의 번호가 정답 클래스다.\n\n[0,1,0]은 1번(주의)이고 [0,0,1]은 2번(경고)이다.\n\n위 코드는 원본 레이블의 형태만 발췌한 예시다. 전체 18개는 원본 코드 보기에서 확인한다.","insight":"범주형 정답을 기계가 처리할 수 있는 숫자 배열로 바꾼 것이다.","cell":"4","kind":"code","label":"원본 형식 발췌"},{"title":"0~1 정규화","lead":"나이 25~73, BMI 22~30을 같은 범위로 맞춘다.","code":"x_input_org = x_input\nx_min = np.min(x_input, axis=0)\nx_max = np.max(x_input, axis=0)\nx_input = (x_input - x_min) / (x_max - x_min)\nx_input","sideTitle":"기억할 것","explain":"x_min, x_max는 열마다 다르다.\n\n각 행 [나이, BMI]가 [0~1, 0~1] 범위로 바뀐다.\n\n원본 입력은 출력 비교용으로 따로 둔다.","insight":"학습 때 정한 정규화 기준을 예측 때도 그대로 적용한다.","cell":"6","kind":"code","label":"핵심 코드"},{"title":"Dense(3) + softmax","lead":"클래스별 점수를 세 개의 비율로 변환한다.","code":"model = tf.keras.models.Sequential([\n    tf.keras.Input(shape=(2,)),\n    tf.keras.layers.Dense(3, activation='softmax')\n])\nmodel.summary()","sideTitle":"모델의 구조","explain":"Input(shape=(2,)) : 나이와 BMI 2개.\n\nDense(3) : 정상, 주의, 경고 3개 출력.\n\nsoftmax : 세 결과가 0~1이고 합이 1이 되도록 변환한다.\n\n학습 파라미터는 2×3+3=9개다.","insight":"다중 클래스 중 하나만 선택하는 구조다.","cell":"8","kind":"code","label":"핵심 코드"},{"title":"정답이 원-핫이면 어떤 손실을 쓸까?","lead":"categorical_crossentropy가 적합하다.","code":"model.compile(\n    optimizer=tf.keras.optimizers.SGD(learning_rate=0.1),\n    loss='categorical_crossentropy',\n    metrics=['accuracy']\n)","sideTitle":"compile 이해","explain":"SGD(learning_rate=0.1) : 갱신 규칙.\n\ncategorical_crossentropy : 원-핫 다중 분류 정답과의 차이.\n\naccuracy : 가장 높은 클래스와 정답이 같은지 비교.","insight":"정수가 레이블이면 sparse_categorical_crossentropy도 선택할 수 있다.","cell":"10","kind":"code","label":"핵심 코드"},{"title":"1,000번 반복 학습","lead":"학습 과정에서 정확도와 손실을 함께 추적한다.","code":"history = model.fit(x_input, labels, epochs=1000)","sideTitle":"모델 fit의 의미","explain":"18개 데이터를 1,000회 반복한다.\n\n각 회차의 loss, accuracy는 history에 남는다.\n\n모델이 세 클래스를 구분할 수 있도록 9개 값을 수정한다.","insight":"반복 횟수가 늘어도 모델 구조가 데이터를 구별할 수 있어야 한다.","cell":"12","kind":"code","label":"핵심 코드"},{"title":"그래프가 드러내는 두 가지","lead":"손실이 줄어드는지, 정확도가 오르는지 각각 본다.","code":"loss = history.history['loss']\nepochs = range(1, len(loss) + 1)\nplt.figure(figsize=(6, 10))\nplt.subplot(2, 1, 1)\nplt.title('Accuracy')\nplt.plot(epochs, history.history['accuracy'], 'b', label='train_accuracy')\nplt.grid(True)\nplt.ylabel('Accuracy')\nplt.legend(loc='best')\nplt.subplot(2, 1, 2)\nplt.title('Loss')\nplt.plot(epochs, history.history['loss'], 'b', label='train_loss')\nplt.grid(True)\nplt.xlabel('Epoch')\nplt.ylabel('Loss')\nplt.legend(loc='best')\nplt.show()","sideTitle":"차이를 구별한다","explain":"loss : 예측 분포와 정답의 차이 크기.\n\naccuracy : 가장 높은 점수의 클래스가 맞은 비율.\n\n손실은 내려가는데 정확도는 멈출 수도 있다.","insight":"loss와 accuracy를 함께 읽어야 학습 상태를 오해하지 않는다.","cell":"14","kind":"code","label":"핵심 코드"},{"title":"훈련 정확도는 약 66.7%","lead":"노트북에 저장된 1,000번째 epoch 기준이다.","code":"accuracy ≈ 0.6667\nloss ≈ 0.7269\n18개 중 약 12개 정답\n오답도 여럿 존재","sideTitle":"결과를 읽는 방법","explain":"첫 예: 25세·BMI22의 정답 0, 예측 0.\n\n25세·BMI26의 정답 1이지만 예측 0.\n\n따라서 분류 모델이 완벽하게 성공했다고 말할 수 없다.","insight":"교수자가 학생과 함께 “왜 오답이 생기는가?”를 토론하기 좋은 예제다.","cell":"12, 16","kind":"result","label":"실행 결과"},{"title":"argmax가 최종 클래스를 정한다","lead":"출력 점수 3개 중 가장 큰 값의 위치를 찾는다.","code":"H_x = model.predict(x_input)\nfor x, h, l in zip(x_input_org, H_x, labels):\n    true_class = np.argmax(l)\n    pred_class = np.argmax(h)\n    print(\"Age:{}, BMI:{} [정답:{}] => 예측 class:{} / 확률값:{}\"\n          .format(x[0], x[1], true_class, pred_class, h))","sideTitle":"두 번 argmax","explain":"np.argmax(l) : 정답 클래스 번호.\n\nnp.argmax(h) : 모델이 선택한 클래스 번호.\n\n둘이 일치하면 맞힌 것이고 다르면 오답이다.","insight":"확률이 가장 큰 클래스를 선택하지만 확신이 높은지는 별도로 확인해야 한다.","cell":"16","kind":"code","label":"핵심 코드"},{"title":"새 데이터 50세·BMI25의 결과","lead":"확률 세 개 중 가장 큰 것은 주의 클래스다.","code":"def predict(x):\n    x_scaled = (x - x_min) / (x_max - x_min)\n    return model.predict(x_scaled)\n\nx_test = tf.constant([[50.0, 25.0]], dtype=tf.float32)\nH_x = predict(x_test)\npred_class = np.argmax(H_x[0])\nprint(\"Age : {}, BMI : {} => 예측 Class: {} / 확률값: {}\"\n      .format(x_test[0, 0], x_test[0, 1], pred_class, H_x[0]))","sideTitle":"노트북 저장 결과","explain":"정상: 약 0.3588.\n\n주의: 약 0.4447.\n\n경고: 약 0.1965.\n\n가장 큰 값의 위치가 1이므로 “주의”로 분류한다.","insight":"0.4447은 가장 큰 값이지만 높은 확신의 정답을 보장하지 않는다.","cell":"18, 19","kind":"code","label":"핵심 코드"},{"title":"데이터의 정답 자체가 일관적일까?","lead":"일부 레이블은 직관적 증가 추세와 반대이므로 오해를 부를 수 있다.","code":"25세·BMI30 → 경고(2)\n35세·BMI30 → 정상(0)\n45세·BMI30 → 주의(1)","sideTitle":"오해하지 말아야 할 점","explain":"같은 BMI에서 나이가 늘어도 등급이 비단조적으로 바뀌는 예시가 있다.\n\n모델은 선형 결정경계를 사용하므로 모든 관계를 표현할 수 없다.\n\n이를 “모델이 나쁘다”고만 하기보다 데이터와 가설을 함께 검토한다.","insight":"모델 개선보다 먼저 정답 라벨 생성 규칙을 명확히 해야 한다.","cell":"4, 16","kind":"warning","label":"교수자 체크"},{"title":"다음 실습: 바꿀 것은 무엇인가?","lead":"층을 늘리기 전에 데이터의 일관성을 확인한다.","code":"실험 A: 레이블 오류/기준 확인\n실험 B: 데이터 추가\n실험 C: 비선형 은닉층 추가\n실험 D: 독립 테스트셋 도입","sideTitle":"학생에게 물어볼 질문","explain":"성능 저하가 라벨 모순 때문인가?\n\n또는 선형 모델의 표현력 부족 때문인가?\n\n어떤 실험이 둘을 구별해 주는가?","insight":"모델만 복잡하게 하기 전에 문제 정의와 데이터부터 검증한다.","cell":"","kind":"exercise","label":"생각해 볼 실습"}],"sources":[{"cell":2,"code":"# ============================================\n# 1. 필요한 라이브러리 불러오기\n# ============================================\n\nimport numpy as np\nimport tensorflow as tf\nimport matplotlib.pyplot as plt\n\n# numpy는 숫자 계산을 쉽게 하기 위해 사용합니다.\n# tensorflow는 인공지능 모델을 만들고 학습시키기 위해 사용합니다.\n# matplotlib은 학습 결과를 그래프로 보기 위해 사용합니다.\n\nprint(\"NumPy Version :{}\".format(np.__version__))\nprint(\"TensorFlow Version :{}\".format(tf.__version__))\nprint(\"Matplotlib Version :{}\".format(plt.matplotlib.__version__))"},{"cell":4,"code":"# ============================================\n# 2. 입력 데이터와 정답 데이터 만들기\n# ============================================\n\n# x_input은 모델에게 넣어줄 입력값입니다.\n# 여기서는 사람의 Age와 BMI를 입력값으로 사용합니다.\n# 즉, 모델은 나이와 BMI를 보고 혈압 상태를 예측합니다.\n\n# 첫 번째 값은 Age, 두 번째 값은 BMI입니다.\n# 예: [25, 22]는 나이 25세, BMI 22라는 뜻입니다.\n\nx_input = tf.constant([\n    [25, 22], [25, 26], [25, 30],\n    [35, 22], [35, 26], [35, 30],\n    [45, 22], [45, 26], [45, 30],\n    [55, 22], [55, 26], [55, 30],\n    [65, 22], [65, 26], [65, 30],\n    [73, 22], [73, 26], [73, 30]\n], dtype=tf.float32)\n\n\n# labels는 정답 데이터입니다.\n# 여기서는 혈압 상태를 3가지 등급으로 나누었습니다.\n#\n# 0번 클래스: 정상\n# 1번 클래스: 주의\n# 2번 클래스: 경고\n#\n# 왜 혈압을 3개로 분류했을까?\n# 혈압은 실제로 하나의 숫자로만 판단하기보다,\n# 정상인지, 조금 위험한 상태인지, 위험한 상태인지처럼\n# 단계별로 해석하는 경우가 많습니다.\n#\n# 예를 들어 병원에서도 혈압을 볼 때\n# “정상입니다”\n# “조금 조심해야 합니다”\n# “위험하니 관리가 필요합니다”\n# 처럼 등급으로 설명하는 경우가 많습니다.\n#\n# 그래서 이 예제에서는 혈압을 숫자로 예측하는 회귀 문제가 아니라,\n# 정상, 주의, 경고 중 하나를 고르는 분류 문제로 만든 것입니다.\n\n\n# labels는 one-hot encoding 방식으로 작성되어 있습니다.\n#\n# [1, 0, 0] → 정상\n# [0, 1, 0] → 주의\n# [0, 0, 1] → 경고\n#\n# 왜 이렇게 쓰는가?\n# 컴퓨터는 “정상”, “주의”, “경고” 같은 글자를 바로 이해하지 못합니다.\n# 그래서 각 상태를 숫자 배열로 바꾸어 표현합니다.\n\nlabels = tf.constant([\n    [1, 0, 0],  # 25세, BMI 22 → 정상\n    [0, 1, 0],  # 25세, BMI 26 → 주의\n    [0, 0, 1],  # 25세, BMI 30 → 경고\n\n    [1, 0, 0],  # 35세, BMI 22 → 정상\n    [0, 1, 0],  # 35세, BMI 26 → 주의\n    [1, 0, 0],  # 35세, BMI 30 → 정상\n\n    [1, 0, 0],  # 45세, BMI 22 → 정상\n    [1, 0, 0],  # 45세, BMI 26 → 정상\n    [0, 1, 0],  # 45세, BMI 30 → 주의\n\n    [1, 0, 0],  # 55세, BMI 22 → 정상\n    [0, 1, 0],  # 55세, BMI 26 → 주의\n    [0, 0, 1],  # 55세, BMI 30 → 경고\n\n    [0, 1, 0],  # 65세, BMI 22 → 주의\n    [0, 0, 1],  # 65세, BMI 26 → 경고\n    [0, 0, 1],  # 65세, BMI 30 → 경고\n\n    [0, 1, 0],  # 73세, BMI 22 → 주의\n    [0, 0, 1],  # 73세, BMI 26 → 경고\n    [0, 0, 1]   # 73세, BMI 30 → 경고\n], dtype=tf.float32)\n"},{"cell":6,"code":"# ============================================\n# 3. 원본 입력 데이터 보관\n# ============================================\n\n# 나중에 결과를 출력할 때,\n# 정규화된 값이 아니라 원래 Age, BMI 값을 보여주기 위해\n# 원본 데이터를 따로 저장해 둡니다.\n\nx_input_org = x_input\n\n\n# ============================================\n# 4. 입력 데이터 정규화\n# ============================================\n\n# Age와 BMI는 숫자 크기가 다릅니다.\n# 예를 들어 Age는 25~73 정도이고,\n# BMI는 22~30 정도입니다.\n#\n# 숫자 범위가 서로 다르면 모델이 학습할 때\n# 특정 값에 더 크게 영향을 받을 수 있습니다.\n#\n# 그래서 모든 입력값을 0~1 사이로 바꿔줍니다.\n# 이것을 정규화라고 합니다.\n\nx_min = np.min(x_input, axis=0)\nx_max = np.max(x_input, axis=0)\n\n# 정규화 공식:\n# 현재값에서 최솟값을 빼고,\n# 최댓값과 최솟값의 차이로 나눕니다.\n#\n# 이렇게 하면 가장 작은 값은 0,\n# 가장 큰 값은 1에 가까운 값이 됩니다.\n\nx_input = (x_input - x_min) / (x_max - x_min)\nx_input"},{"cell":8,"code":"# ============================================\n# 5. 모델 만들기\n# ============================================\n\nmodel = tf.keras.models.Sequential([\n\n    # 입력 데이터는 Age, BMI 두 개입니다.\n    # 그래서 input shape은 2입니다.\n    tf.keras.Input(shape=(2,)),\n\n    # Dense는 입력값을 이용해서 결과를 계산하는 층입니다.\n    #\n    # Dense(3)의 의미:\n    # 출력 결과를 3개 만들겠다는 뜻입니다.\n    #\n    # 왜 3개인가?\n    # 혈압 상태를 정상, 주의, 경고 3가지로 분류하기 때문입니다.\n    #\n    # 출력 1: 정상일 가능성\n    # 출력 2: 주의일 가능성\n    # 출력 3: 경고일 가능성\n    #\n    # activation='softmax'의 의미:\n    # 모델이 출력한 3개의 숫자를 확률처럼 바꿔줍니다.\n    #\n    # 예를 들어 모델이 내부적으로 [2.1, 0.5, -1.0] 같은 값을 만들면,\n    # 이 숫자는 그대로는 확률이 아닙니다.\n    #\n    # Softmax를 적용하면 다음처럼 바뀝니다.\n    # [0.78, 0.17, 0.05]\n    #\n    # 이 뜻은 다음과 같습니다.\n    # 정상일 확률 78%\n    # 주의일 확률 17%\n    # 경고일 확률 5%\n    #\n    # 따라서 3개 이상의 클래스 중 하나를 고르는 문제에서는\n    # Softmax를 사용하는 것이 적절합니다.\n\n    tf.keras.layers.Dense(3, activation='softmax')\n])\n\nmodel.summary()"},{"cell":10,"code":"# ============================================\n# 6. 모델 학습 방법 설정\n# ============================================\n\nmodel.compile(\n\n    # optimizer는 모델이 틀린 정도를 줄이기 위해\n    # 가중치를 어떻게 수정할지 정하는 방법입니다.\n    #\n    # SGD는 가장 기본적인 경사하강법 방식입니다.\n    # learning_rate=0.1은 한 번에 얼마나 크게 수정할지 정하는 값입니다.\n\n    optimizer=tf.keras.optimizers.SGD(learning_rate=0.1),\n\n    # loss는 모델이 얼마나 틀렸는지 계산하는 기준입니다.\n    #\n    # categorical_crossentropy는\n    # 정답이 one-hot encoding이고,\n    # 클래스가 여러 개인 분류 문제에서 사용합니다.\n    #\n    # 이 예제는 정상, 주의, 경고 3개 중 하나를 맞히는 문제이므로\n    # categorical_crossentropy를 사용합니다.\n\n    loss='categorical_crossentropy',\n\n    # accuracy는 모델이 정답을 얼마나 잘 맞혔는지 보는 지표입니다.\n    # 예를 들어 accuracy가 0.9이면 90% 정도 맞혔다는 뜻입니다.\n\n    metrics=['accuracy']\n)\n"},{"cell":12,"code":"# ============================================\n# 7. 모델 학습\n# ============================================\n\n# fit은 모델을 실제로 학습시키는 명령입니다.\n#\n# x_input: 입력 데이터\n# labels: 정답 데이터\n# epochs=1000: 전체 데이터를 1000번 반복해서 학습\n#\n# 반복 횟수가 너무 적으면 학습이 부족할 수 있고,\n# 너무 많으면 외운 것처럼 될 수도 있습니다.\n# 지금은 실습용 작은 데이터라 1000번 반복합니다.\n\nhistory = model.fit(x_input, labels, epochs=1000)\n"},{"cell":14,"code":"# ============================================\n# 8. 학습 결과 그래프 출력\n# ============================================\n\n# loss는 모델이 틀린 정도입니다.\n# loss는 작아질수록 좋습니다.\n#\n# accuracy는 모델이 맞힌 비율입니다.\n# accuracy는 높아질수록 좋습니다.\n\nloss = history.history['loss']\nepochs = range(1, len(loss) + 1)\n\nplt.figure(figsize=(6, 10))\n\n# 정확도 그래프\nplt.subplot(2, 1, 1)\nplt.title('Accuracy')\nplt.plot(epochs, history.history['accuracy'], 'b', label='train_accuracy')\nplt.grid(True)\nplt.ylabel('Accuracy')\nplt.legend(loc='best')\n\n# 손실 그래프\nplt.subplot(2, 1, 2)\nplt.title('Loss')\nplt.plot(epochs, history.history['loss'], 'b', label='train_loss')\nplt.grid(True)\nplt.xlabel('Epoch')\nplt.ylabel('Loss')\nplt.legend(loc='best')\n\nplt.show()"},{"cell":16,"code":"# ============================================\n# 9. 학습 데이터로 예측 결과 확인\n# ============================================\n\n# model.predict는 입력값을 넣었을 때\n# 모델이 예측한 결과를 출력합니다.\n#\n# 이 모델의 마지막 층에 softmax가 있으므로,\n# H_x에는 3개 클래스에 대한 확률이 들어 있습니다.\n\nH_x = model.predict(x_input)\n\nfor x, h, l in zip(x_input_org, H_x, labels):\n\n    # np.argmax(l)\n    # 정답 label에서 가장 큰 값의 위치를 찾습니다.\n    #\n    # 예:\n    # [1, 0, 0] → 0번 클래스\n    # [0, 1, 0] → 1번 클래스\n    # [0, 0, 1] → 2번 클래스\n\n    true_class = np.argmax(l)\n\n    # np.argmax(h)\n    # 모델이 예측한 확률 중 가장 큰 값의 위치를 찾습니다.\n    #\n    # 예:\n    # [0.80, 0.15, 0.05] → 0번 클래스\n    # [0.10, 0.75, 0.15] → 1번 클래스\n    # [0.05, 0.20, 0.75] → 2번 클래스\n\n    pred_class = np.argmax(h)\n\n    print(\"Age:{}, BMI:{} [정답:{}] => 예측 class:{} / 확률값:{}\"\n          .format(x[0], x[1], true_class, pred_class, h))\n"},{"cell":18,"code":"# ============================================\n# 10. 새로운 데이터 예측 함수\n# ============================================\n\ndef predict(x):\n\n    # 새로운 데이터도 반드시 학습 데이터와 같은 방식으로 정규화해야 합니다.\n    #\n    # 모델은 이미 정규화된 데이터를 기준으로 학습했습니다.\n    # 따라서 새로운 데이터를 원본 그대로 넣으면\n    # 모델이 이상하게 예측할 수 있습니다.\n\n    x_scaled = (x - x_min) / (x_max - x_min)\n\n    # 정규화된 데이터를 모델에 넣고 예측합니다.\n    # 출력값은 softmax를 거친 확률값입니다.\n\n    return model.predict(x_scaled)\n"},{"cell":19,"code":"# ============================================\n# 11. 테스트 데이터 예측\n# ============================================\n\n# 새로운 사람의 데이터입니다.\n# 나이 50세, BMI 25인 사람의 혈압 상태를 예측합니다.\n\nx_test = tf.constant([[50.0, 25.0]], dtype=tf.float32)\n\n# 예측 실행\nH_x = predict(x_test)\n\n# H_x[0]에는 3개 클래스의 확률이 들어 있습니다.\n#\n# 예:\n# [0.30, 0.55, 0.15]\n#\n# 정상 확률 30%\n# 주의 확률 55%\n# 경고 확률 15%\n#\n# 이 경우 가장 큰 값은 1번 클래스이므로\n# 최종 예측은 “주의”가 됩니다.\n\npred_class = np.argmax(H_x[0])\n\nprint(\"Age : {}, BMI : {} => 예측 Class: {} / 확률값: {}\"\n      .format(x_test[0, 0], x_test[0, 1], pred_class, H_x[0]))"}]}</script><script>"use strict";
const initial=JSON.parse(document.getElementById('deck-data').textContent);
let deck=initial, at=0, editing=false, history=[], selectedSource=0;
const el=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function remember(){history.push(JSON.stringify(deck.slides));if(history.length>40)history.shift();}
function changeState(){try{localStorage.setItem('slide_edit_'+deck.id,JSON.stringify(deck.slides))}catch(err){}}
function field(name,tag='div',cls=''){const v=deck.slides[at][name]||'';return `<${tag} class="${cls}" data-field="${name}" ${editing?'contenteditable="true" spellcheck="false"':''}>${esc(v)}</${tag}>`;}
function slideHTML(s,idx,allowEdit){const ed=allowEdit?'contenteditable="true" spellcheck="false"':'';
const fld=(name,tag,cls)=>`<${tag} class="${cls}" data-field="${name}" ${ed}>${esc(s[name]||'')}</${tag}>`;
return `<article class="slide${(s.code||'').split('\n').length>13?' compact':''}" data-kind="${esc(s.kind||'code')}"><div class="topline"></div><div class="frame"><header class="head"><div class="eyebrow">${esc(deck.id.toUpperCase())} &nbsp;|&nbsp; ${esc(deck.name)} &nbsp;|&nbsp; ${String(idx+1).padStart(2,'0')} / ${String(deck.slides.length).padStart(2,'0')}</div>${fld('title','h1','title')}${fld('lead','p','lead')}</header><div class="main"><div class="codepanel"><div class="panelbar"><span>${esc(s.label||'PYTHON 핵심 코드')}</span><span class="source">${s.cell?'노트북 셀 '+esc(s.cell):'핵심 개념'}</span></div><div class="codebody">${fld('code','pre','snippet')}</div></div><div class="explainpanel">${fld('sideTitle','h2','sidetitle')}${fld('explain','div','explanation')}</div></div><div class="takeaway"><span class="caption">핵심 결론</span>${fld('insight','div','insight')}</div></div></article>`}
function render(){at=Math.max(0,Math.min(at,deck.slides.length-1));el('stage').innerHTML=slideHTML(deck.slides[at],at,editing);el('indicator').textContent=(at+1)+' / '+deck.slides.length;el('prev').disabled=at===0;el('next').disabled=at===deck.slides.length-1;el('editToggle').textContent=editing?'직접 수정 끄기':'직접 수정 켜기';el('stage').querySelectorAll('[data-field]').forEach(node=>{node.addEventListener('focusin',()=>{if(editing)remember()},{once:true});node.addEventListener('input',()=>{const key=node.getAttribute('data-field');deck.slides[at][key]=node.innerText.replace(/\r/g,'');changeState()})});}
function move(n){at=Math.max(0,Math.min(deck.slides.length-1,at+n));render()}
function toast(t){el('toast').textContent=t;el('toast').classList.add('visible');setTimeout(()=>el('toast').classList.remove('visible'),1900)}
function modal(id,yes){el(id).classList.toggle('open',yes)}
function editForm(){const s=deck.slides[at];const fields=[['title','슬라이드 제목'],['lead','한 줄 소개'],['code','코드 또는 수식'],['sideTitle','오른쪽 제목'],['explain','쉬운 설명'],['insight','하단 핵심 결론'],['label','코드 상단 표시']];el('formfields').innerHTML=fields.map(([key,name])=>`<div class="field ${key==='explain'||key==='code'?'wide':''}"><label>${name}</label><textarea name="${key}">${esc(s[key]||'')}</textarea></div>`).join('');modal('editorModal',true);}
function applyForm(){remember();let s=deck.slides[at];el('formfields').querySelectorAll('textarea').forEach(e=>s[e.name]=e.value);changeState();modal('editorModal',false);render();toast('수정했습니다. HTML 저장으로 파일에 반영하세요.');}
function blankSlide(){remember();const s={kind:'code',title:'새 슬라이드 제목',lead:'여기에 한 줄 설명을 입력하세요.',code:'# 여기에 예제 코드나 수식을 넣으세요',sideTitle:'쉽게 설명하면',explain:'코드의 의미를 두세 문장으로 설명하세요.',insight:'학생이 기억해야 할 한 문장을 쓰세요.',label:'추가한 슬라이드',cell:''};deck.slides.splice(at+1,0,s);at++;changeState();render();editForm()}
function duplicate(){remember();deck.slides.splice(at+1,0,JSON.parse(JSON.stringify(deck.slides[at])));at++;changeState();render();toast('현재 페이지를 복제했습니다.')}
function removeSlide(){if(deck.slides.length<2){toast('최소 한 장은 남겨야 합니다.');return}if(!confirm('현재 슬라이드를 삭제할까요?'))return;remember();deck.slides.splice(at,1);at=Math.min(at,deck.slides.length-1);changeState();render()}
function swapSlide(dir){const other=at+dir;if(other<0||other>=deck.slides.length)return;remember();[deck.slides[at],deck.slides[other]]=[deck.slides[other],deck.slides[at]];at=other;changeState();render()}
function undo(){if(!history.length){toast('실행 취소 기록이 없습니다.');return}deck.slides=JSON.parse(history.pop());at=Math.min(at,deck.slides.length-1);changeState();render()}
function persistHTML(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#deck-data').textContent=JSON.stringify(deck).replace(/</g,'\\u003c');clone.querySelector('#stage').innerHTML='';clone.querySelector('#printDeck').innerHTML='';const full='<!doctype html>\n'+clone.outerHTML;const blob=new Blob([full],{type:'text/html;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=deck.id+'_'+deck.slug+'_editable.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),7000);toast('편집한 HTML 저장을 요청했습니다.')}
function printAll(){el('printDeck').innerHTML=deck.slides.map((s,i)=>slideHTML(s,i,false)).join('');window.print();}
function sourceModal(){selectedSource=0;paintSource();modal('sourceModal',true)}
function paintSource(){el('sourceCells').innerHTML=deck.sources.map((s,i)=>`<button class="${i===selectedSource?'selected':''}" data-cellidx="${i}">원본 셀 ${s.cell}</button>`).join('');el('sourceCells').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedSource=Number(b.dataset.cellidx);paintSource()});el('sourceCode').textContent=deck.sources[selectedSource]?.code||'';}
function copySource(){const txt=el('sourceCode').textContent;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('복사했습니다.')).catch(()=>fallbackCopy(txt))}else fallbackCopy(txt)}
function fallbackCopy(txt){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('복사했습니다.')}catch(err){toast('드래그하여 복사해 주세요.')}t.remove()}
function listSlides(){const options=deck.slides.map((s,i)=>`${i+1}. ${s.title}`).join('\n');const ans=prompt('이동할 슬라이드 번호를 입력하세요.\n\n'+options,String(at+1));if(ans){let v=parseInt(ans,10);if(Number.isFinite(v)&&v>=1&&v<=deck.slides.length){at=v-1;render()}}}
function resetSaved(){if(confirm('브라우저에 저장한 편집 내용을 버리고 원본으로 돌아갈까요?')){remember();deck.slides=JSON.parse(document.getElementById('deck-data').textContent).slides;changeState();at=0;render()}}
window.addEventListener('keydown',e=>{if(e.target.closest('textarea,input,[contenteditable="true"]')||document.querySelector('.modalwrap.open'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(-1)}if(e.key==='Home'){at=0;render()}if(e.key==='End'){at=deck.slides.length-1;render()}});
let tx=0;el('stage').addEventListener('touchstart',e=>{tx=e.changedTouches[0]?.screenX||0},{passive:true});el('stage').addEventListener('touchend',e=>{if(editing)return;const d=(e.changedTouches[0]?.screenX||0)-tx;if(Math.abs(d)>90)move(d<0?1:-1)},{passive:true});
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('indicator').onclick=listSlides;el('editToggle').onclick=()=>{editing=!editing;render()};el('openEditor').onclick=editForm;el('applyEdit').onclick=applyForm;el('closeEditor').onclick=()=>modal('editorModal',false);el('add').onclick=blankSlide;el('duplicate').onclick=duplicate;el('remove').onclick=removeSlide;el('backward').onclick=()=>swapSlide(-1);el('forward').onclick=()=>swapSlide(1);el('undo').onclick=undo;el('save').onclick=persistHTML;el('pdf').onclick=printAll;el('source').onclick=sourceModal;el('copySource').onclick=copySource;el('closeSource').onclick=()=>modal('sourceModal',false);el('reset').onclick=resetSaved;
document.querySelectorAll('.modalwrap').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)modal(m.id,false)}));
try{const cached=JSON.parse(localStorage.getItem('slide_edit_'+deck.id)||'null');if(Array.isArray(cached)&&cached.length&&cached.every(s=>typeof s.title==='string'))deck.slides=cached}catch(err){}
render();</script></body></html>
