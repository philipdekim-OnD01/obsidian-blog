<script id="deck-data" type="application/json">{"id":"EX_03","slug":"Blood_Pressure_Linear_Regression","name":"나이로 혈압 예측하기","sourceFile":"EX_03_Blood_Pressure_Linear_Regression.20250504.ipynb","slides":[{"title":"나이로 혈압을 예측할 수 있을까?","lead":"EX 03 | 현실 데이터처럼 같은 나이에도 다른 혈압값이 있다.","code":"나이    →    혈압 정답    →    선형식\nMSE 최소화    →    50세 예측","sideTitle":"이 예제에서 배우는 것","explain":"규칙이 딱 맞는 EX 02와 달리, 나이가 같아도 혈압은 다르다.\n따라서 직선을 학습해도 오차는 완전히 0이 되지 않는다.","insight":"핵심: 코드의 실행 순서를 따라가며 입력과 출력의 관계를 설명할 수 있으면 성공이다.","cell":"","kind":"cover","label":"학습 흐름"},{"title":"데이터: 나이 18개와 혈압 18개","lead":"같은 25세라도 혈압은 118, 125, 130처럼 다르다.","code":"x_input = np.array(\n    [25,25,25,35,35,35,45,45,45,55,55,55,65,65,65,73,73,73],\n    dtype=np.float32\n)\nlabels = np.array(\n    [118,125,130,118,126,123,120,124,130,122,125,130,127,130,130,125.5,130,138],\n    dtype=np.float32\n)\nW = np.random.normal()\nB = np.random.normal()","sideTitle":"데이터를 읽는 법","explain":"x_input : 나이 25~73세의 18개 관측값이다.\n\nlabels : 각 나이에 대응하는 혈압 숫자다.\n\nW,B : 무작위 초기화하는 회귀 계수다.","insight":"EX 02와 다른 점은 정답이 완벽한 직선에 놓이지 않는다는 것이다.","cell":"4","kind":"code","label":"핵심 코드"},{"title":"가설: 나이 × 기울기 + 기준값","lead":"모델이 만들어내는 혈압 예측식을 정의한다.","code":"def Hypothesis(x):\n    return W * x + B","sideTitle":"W와 B를 해석","explain":"W : 나이가 1살 늘 때 예측 혈압이 얼마 바뀌는가.\n\nB : 직선의 위치를 맞추는 기준값.\n\n둘을 바꾸며 예측을 정답에 가깝게 만든다.","insight":"예측식은 복잡하지 않지만, 개인의 모든 특성을 담지는 못한다.","cell":"6","kind":"code","label":"핵심 코드"},{"title":"예측 오차: MSE","lead":"같은 나이의 개인별 변동 때문에 손실이 남는다.","code":"def Cost():\n    return np.mean((Hypothesis(x_input) - labels) ** 2)","sideTitle":"Cost 계산","explain":"예측값−정답 = 오차.\n\n제곱하면 양수·음수 오차가 상쇄되지 않는다.\n\nmean으로 18개의 오차 제곱을 평균낸다.","insight":"MSE가 17이라도 실제 오차가 항상 17mmHg라는 뜻은 아니다.","cell":"8","kind":"code","label":"핵심 코드"},{"title":"기울기 계산과 학습 반복","lead":"200,000번 반복하면서 W, B를 수정한다.","code":"def Gradient(x, y):\n    grad_w = np.mean(x * (x * W + (B - y)))\n    grad_b = np.mean(W * x - y + B)\n    return grad_w, grad_b\n\nepochs = 200000\nlearning_rate = 0.0005","sideTitle":"핵심 계산","explain":"Gradient가 W용, B용 수정 방향을 계산한다.\n\nepochs=200000 : 많은 반복.\n\nlearning_rate=0.0005 : 한 번에 매우 작은 수정.","insight":"원본은 1차 회귀에 긴 반복을 사용하여 최적점에 도달하도록 한다.","cell":"10, 12","kind":"code","label":"핵심 코드"},{"title":"두 값을 업데이트하는 실제 코드","lead":"손실의 기울기 반대로 한 걸음씩 이동한다.","code":"for cnt in range(0, epochs + 1):\n    grad_w, grad_b = Gradient(x_input, labels)\n    W -= learning_rate * grad_w\n    B -= learning_rate * grad_b","sideTitle":"무슨 일이 일어날까?","explain":"매 회차 현재의 예측 오차를 보고 W를 조정한다.\n\nB도 별도로 조정하여 직선 높이를 맞춘다.\n\n두 변수를 함께 수정해 전체 데이터에 잘 맞는 직선을 만든다.","insight":"각 점을 똑같이 맞추는 것이 아니라 전체 오차를 작게 만드는 것이다.","cell":"12","kind":"code","label":"핵심 코드"},{"title":"학습 결과: 혈압 ≈ 0.1608×나이 + 118.2","lead":"노트북에 저장된 결과를 학생 눈높이로 읽는다.","code":"W ≈ 0.1608\nB ≈ 118.2\nMSE ≈ 17.07\nRMSE ≈ 4.13 mmHg","sideTitle":"결과를 읽는 방법","explain":"나이 1세 증가 시 모델상 혈압 약 0.16mmHg 증가.\n\n예를 들어 50세는 약 126.2mmHg로 나온다.\n\nRMSE는 MSE의 제곱근이다. 평균 절대오차(MAE)와 같지는 않다.","insight":"나이 하나로 개인 혈압을 진단하기 위한 모델은 아니다.","cell":"12, 15","kind":"result","label":"실행 결과"},{"title":"새 입력 50세를 예측하기","lead":"학습된 식에 새로운 나이만 넣으면 된다.","code":"def Predict(x):\n    return Hypothesis(x)\nage = np.array([50.0])\nprint(\"{} Years : {:>7.4}mmHg\".format(age[0], Predict(age)[0]))","sideTitle":"Predict의 역할","explain":"Predict(age)가 Hypothesis(age)를 호출한다.\n\n나이가 50일 때 0.1608×50 + 118.2로 계산한다.\n\n저장된 결과는 약 126.2mmHg이다.","insight":"학습이 끝난 W, B가 실제 예측에 재사용된다.","cell":"15","kind":"code","label":"핵심 코드"},{"title":"이 예제에서 꼭 짚을 한계","lead":"18개 학습 데이터만으로 일반화 성능을 판단할 수 없다.","code":"학습 데이터: 18개\n입력 변수: 나이 1개\n검증 / 테스트 분리: 없음","sideTitle":"오해하지 말아야 할 점","explain":"같은 나이에도 혈압 차이가 있어 숨은 요인이 존재한다.\n\n학습 오차가 작아도 새 사람에게 잘 맞는다는 보장은 없다.\n\n혈압의 실제 의료 기준을 학습한 모델이 아니라 수업용 데이터다.","insight":"학생에게 “나이만 알고 혈압을 정확히 맞힐 수 있을까?”를 질문한다.","cell":"","kind":"warning","label":"교수자 체크"},{"title":"수식·출력에서 확인할 두 가지","lead":"교재의 개념과 실행 기록을 함께 점검한다.","code":"원본 MSE의 도함수에 계수 2 생략\n0회차부터 최종 W,B와 유사한 저장 로그\nRMSE와 평균 절대오차는 다름","sideTitle":"오해하지 말아야 할 점","explain":"Gradient는 원본 그대로 보여주되 MSE의 실제 미분은 2배임을 설명한다.\n\n랜덤 초기화인데 0회차부터 수렴한 출력은 재실행 순서를 확인한다.\n\nRMSE≈4.13을 “평균 ±4”라고 단정하지 않는다.","insight":"수학적 정확성을 보완하면 좋은 입문 강의가 된다.","cell":"8, 10, 12","kind":"warning","label":"교수자 체크"},{"title":"실습: 입력 변수를 하나 더 늘리면?","lead":"EX 04로 넘어가기 전 확장 질문이다.","code":"현재: 혈압 ≈ W×나이 + B\n다음: 혈압 ≈ W1×나이 + W2×BMI + B","sideTitle":"학생에게 물어볼 질문","explain":"나이가 같은 사람의 혈압 차이를 BMI가 일부 설명할 수 있을까?\n\n입력을 더 늘리면 식은 어떻게 바뀌는가?\n\n데이터도 충분히 늘려야 하는 이유는 무엇인가?","insight":"다음 예제에서는 나이와 BMI를 동시에 입력한다.","cell":"","kind":"exercise","label":"생각해 볼 실습"}],"sources":[{"cell":2,"code":"import numpy as np\n\nprint(\"NumPy Version :{}\".format(np.__version__))"},{"cell":4,"code":"# x_input은 입력 데이터입니다.\n# 여기서는 사람의 나이 AGE를 의미합니다.\n# 예: 25세, 35세, 45세, 55세, 65세, 73세\nx_input = np.array(\n    [25,25,25,35,35,35,45,45,45,55,55,55,65,65,65,73,73,73],\n    dtype=np.float32\n)\n\n# labels는 정답 데이터입니다.\n# 여기서는 각 나이에 해당하는 혈압 BP 값을 의미합니다.\n# 머신러닝에서는 보통 정답값을 label 또는 y라고 부릅니다.\nlabels = np.array(\n    [118,125,130,118,126,123,120,124,130,122,125,130,127,130,130,125.5,130,138],\n    dtype=np.float32\n)\n\n\n# W는 기울기입니다.\n# 선형회귀식 y = Wx + B 에서 W에 해당합니다.\n# 나이가 1 증가할 때 혈압이 얼마나 증가하거나 감소하는지를 나타냅니다.\nW = np.random.normal()\n\n# B는 절편입니다.\n# 선형회귀식 y = Wx + B 에서 B에 해당합니다.\n# x가 0일 때의 기본값이라고 생각하면 됩니다.\nB = np.random.normal()"},{"cell":6,"code":"# Hypothesis는 가설 함수입니다.\n# 쉽게 말하면 현재 W와 B를 이용해서 혈압을 예측하는 함수입니다.\n# 선형회귀에서는 예측식을 보통 y = Wx + B 형태로 만듭니다.\ndef Hypothesis(x):\n    return W * x + B"},{"cell":8,"code":"# Cost는 손실 함수입니다.\n# 예측값과 실제 정답값이 얼마나 차이 나는지 계산합니다.\n# 여기서는 MSE, 즉 평균제곱오차를 사용합니다.\n# 오차를 제곱하는 이유는 음수 오차와 양수 오차가 서로 상쇄되지 않게 하기 위해서입니다.\ndef Cost():\n    return np.mean((Hypothesis(x_input) - labels) ** 2)\n\n"},{"cell":10,"code":"# Gradient는 기울기 값을 계산하는 함수입니다.\n# 여기서 말하는 기울기는 그래프의 기울기가 아니라,\n# W와 B를 어느 방향으로 얼마나 수정해야 손실이 줄어드는지를 알려주는 값입니다.\ndef Gradient(x, y):\n\n    # grad_w는 W를 수정하기 위한 값입니다.\n    # 예측값과 실제값의 차이가 W에 얼마나 영향을 주는지 계산합니다.\n    grad_w = np.mean(x * (x * W + (B - y)))\n\n    # grad_b는 B를 수정하기 위한 값입니다.\n    # 예측값과 실제값의 차이가 B에 얼마나 영향을 주는지 계산합니다.\n    grad_b = np.mean(W * x - y + B)\n\n    # W용 기울기와 B용 기울기를 함께 반환합니다.\n    return grad_w, grad_b\n"},{"cell":12,"code":"# epochs는 전체 데이터를 몇 번 반복해서 학습할지 정하는 값입니다.\n# 값이 클수록 더 많이 학습하지만 시간이 오래 걸립니다.\nepochs = 200000\n\n\n# learning_rate는 학습률입니다.\n# W와 B를 한 번에 얼마나 크게 수정할지 정합니다.\n# 너무 크면 학습이 불안정해지고, 너무 작으면 학습이 느려집니다.\nlearning_rate = 0.0005\n\n\n# 본격적인 학습 과정입니다.\n# cnt는 현재 몇 번째 학습 중인지 나타냅니다.\nfor cnt in range(0, epochs + 1):\n\n    # 전체 학습 과정을 20등분해서 중간 결과를 출력합니다.\n    # cost가 줄어드는지 확인하기 위한 코드입니다.\n    if cnt % (epochs // 20) == 0:\n        print(\n            \"[{:>5}] cost = {:>10.4}, W = {:>7.4}, B = {:>7.4}\".format(\n                cnt, Cost(), W, B\n            )\n        )\n\n    # 현재 W와 B에서의 기울기를 계산합니다.\n    grad_w, grad_b = Gradient(x_input, labels)\n\n    # W를 손실이 줄어드는 방향으로 수정합니다.\n    W -= learning_rate * grad_w\n\n    # B를 손실이 줄어드는 방향으로 수정합니다.\n    B -= learning_rate * grad_b"},{"cell":15,"code":"# Predict 함수는 새로운 나이를 넣었을 때 혈압을 예측하는 함수입니다.\ndef Predict(x):\n    return Hypothesis(x)\n\n\n# 50세의 혈압을 예측하기 위해 age 배열을 만듭니다.\nage = np.array([50.0])\n\n# 50세일 때 예측 혈압을 출력합니다.\nprint(\"{} Years : {:>7.4}mmHg\".format(age[0], Predict(age)[0]))"}]}</script><script>"use strict";
const initial=JSON.parse(document.getElementById('deck-data').textContent);
let deck=initial, at=0, editing=false, history=[], selectedSource=0;
const el=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function remember(){history.push(JSON.stringify(deck.slides));if(history.length>40)history.shift();}
function changeState(){try{localStorage.setItem('slide_edit_'+deck.id,JSON.stringify(deck.slides))}catch(err){}}
function field(name,tag='div',cls=''){const v=deck.slides[at][name]||'';return `<${tag} class="${cls}" data-field="${name}" ${editing?'contenteditable="true" spellcheck="false"':''}>${esc(v)}</${tag}>`;}
function slideHTML(s,idx,allowEdit){const ed=allowEdit?'contenteditable="true" spellcheck="false"':'';
const fld=(name,tag,cls)=>`<${tag} class="${cls}" data-field="${name}" ${ed}>${esc(s[name]||'')}</${tag}>`;
return `<article class="slide${(s.code||'').split('\n').length>13?' compact':''}" data-kind="${esc(s.kind||'code')}"><div class="topline"></div><div class="frame"><header class="head"><div class="eyebrow">${esc(deck.id.toUpperCase())} &nbsp;|&nbsp; ${esc(deck.name)} &nbsp;|&nbsp; ${String(idx+1).padStart(2,'0')} / ${String(deck.slides.length).padStart(2,'0')}</div>${fld('title','h1','title')}${fld('lead','p','lead')}</header><div class="main"><div class="codepanel"><div class="panelbar"><span>${esc(s.label||'PYTHON 핵심 코드')}</span><span class="source">${s.cell?'노트북 셀 '+esc(s.cell):'핵심 개념'}</span></div><div class="codebody">${fld('code','pre','snippet')}</div></div><div class="explainpanel">${fld('sideTitle','h2','sidetitle')}${fld('explain','div','explanation')}</div></div><div class="takeaway"><span class="caption">핵심 결론</span>${fld('insight','div','insight')}</div></div></article>`}
function render(){at=Math.max(0,Math.min(at,deck.slides.length-1));el('stage').innerHTML=slideHTML(deck.slides[at],at,editing);el('indicator').textContent=(at+1)+' / '+deck.slides.length;el('prev').disabled=at===0;el('next').disabled=at===deck.slides.length-1;el('editToggle').textContent=editing?'직접 수정 끄기':'직접 수정 켜기';el('stage').querySelectorAll('[data-field]').forEach(node=>{node.addEventListener('focusin',()=>{if(editing)remember()},{once:true});node.addEventListener('input',()=>{const key=node.getAttribute('data-field');deck.slides[at][key]=node.innerText.replace(/\r/g,'');changeState()})});}
function move(n){at=Math.max(0,Math.min(deck.slides.length-1,at+n));render()}
function toast(t){el('toast').textContent=t;el('toast').classList.add('visible');setTimeout(()=>el('toast').classList.remove('visible'),1900)}
function modal(id,yes){el(id).classList.toggle('open',yes)}
function editForm(){const s=deck.slides[at];const fields=[['title','슬라이드 제목'],['lead','한 줄 소개'],['code','코드 또는 수식'],['sideTitle','오른쪽 제목'],['explain','쉬운 설명'],['insight','하단 핵심 결론'],['label','코드 상단 표시']];el('formfields').innerHTML=fields.map(([key,name])=>`<div class="field ${key==='explain'||key==='code'?'wide':''}"><label>${name}</label><textarea name="${key}">${esc(s[key]||'')}</textarea></div>`).join('');modal('editorModal',true);}
function applyForm(){remember();let s=deck.slides[at];el('formfields').querySelectorAll('textarea').forEach(e=>s[e.name]=e.value);changeState();modal('editorModal',false);render();toast('수정했습니다. HTML 저장으로 파일에 반영하세요.');}
function blankSlide(){remember();const s={kind:'code',title:'새 슬라이드 제목',lead:'여기에 한 줄 설명을 입력하세요.',code:'# 여기에 예제 코드나 수식을 넣으세요',sideTitle:'쉽게 설명하면',explain:'코드의 의미를 두세 문장으로 설명하세요.',insight:'학생이 기억해야 할 한 문장을 쓰세요.',label:'추가한 슬라이드',cell:''};deck.slides.splice(at+1,0,s);at++;changeState();render();editForm()}
function duplicate(){remember();deck.slides.splice(at+1,0,JSON.parse(JSON.stringify(deck.slides[at])));at++;changeState();render();toast('현재 페이지를 복제했습니다.')}
function removeSlide(){if(deck.slides.length<2){toast('최소 한 장은 남겨야 합니다.');return}if(!confirm('현재 슬라이드를 삭제할까요?'))return;remember();deck.slides.splice(at,1);at=Math.min(at,deck.slides.length-1);changeState();render()}
function swapSlide(dir){const other=at+dir;if(other<0||other>=deck.slides.length)return;remember();[deck.slides[at],deck.slides[other]]=[deck.slides[other],deck.slides[at]];at=other;changeState();render()}
function undo(){if(!history.length){toast('실행 취소 기록이 없습니다.');return}deck.slides=JSON.parse(history.pop());at=Math.min(at,deck.slides.length-1);changeState();render()}
function persistHTML(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#deck-data').textContent=JSON.stringify(deck).replace(/</g,'\\u003c');clone.querySelector('#stage').innerHTML='';clone.querySelector('#printDeck').innerHTML='';const full='<!doctype html>\n'+clone.outerHTML;const blob=new Blob([full],{type:'text/html;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=deck.id+'_'+deck.slug+'_editable.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),7000);toast('편집한 HTML 저장을 요청했습니다.')}
function printAll(){el('printDeck').innerHTML=deck.slides.map((s,i)=>slideHTML(s,i,false)).join('');window.print();}
function sourceModal(){selectedSource=0;paintSource();modal('sourceModal',true)}
function paintSource(){el('sourceCells').innerHTML=deck.sources.map((s,i)=>`<button class="${i===selectedSource?'selected':''}" data-cellidx="${i}">원본 셀 ${s.cell}</button>`).join('');el('sourceCells').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedSource=Number(b.dataset.cellidx);paintSource()});el('sourceCode').textContent=deck.sources[selectedSource]?.code||'';}
function copySource(){const txt=el('sourceCode').textContent;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('복사했습니다.')).catch(()=>fallbackCopy(txt))}else fallbackCopy(txt)}
function fallbackCopy(txt){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('복사했습니다.')}catch(err){toast('드래그하여 복사해 주세요.')}t.remove()}
function listSlides(){const options=deck.slides.map((s,i)=>`${i+1}. ${s.title}`).join('\n');const ans=prompt('이동할 슬라이드 번호를 입력하세요.\n\n'+options,String(at+1));if(ans){let v=parseInt(ans,10);if(Number.isFinite(v)&&v>=1&&v<=deck.slides.length){at=v-1;render()}}}
function resetSaved(){if(confirm('브라우저에 저장한 편집 내용을 버리고 원본으로 돌아갈까요?')){remember();deck.slides=JSON.parse(document.getElementById('deck-data').textContent).slides;changeState();at=0;render()}}
window.addEventListener('keydown',e=>{if(e.target.closest('textarea,input,[contenteditable="true"]')||document.querySelector('.modalwrap.open'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(-1)}if(e.key==='Home'){at=0;render()}if(e.key==='End'){at=deck.slides.length-1;render()}});
let tx=0;el('stage').addEventListener('touchstart',e=>{tx=e.changedTouches[0]?.screenX||0},{passive:true});el('stage').addEventListener('touchend',e=>{if(editing)return;const d=(e.changedTouches[0]?.screenX||0)-tx;if(Math.abs(d)>90)move(d<0?1:-1)},{passive:true});
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('indicator').onclick=listSlides;el('editToggle').onclick=()=>{editing=!editing;render()};el('openEditor').onclick=editForm;el('applyEdit').onclick=applyForm;el('closeEditor').onclick=()=>modal('editorModal',false);el('add').onclick=blankSlide;el('duplicate').onclick=duplicate;el('remove').onclick=removeSlide;el('backward').onclick=()=>swapSlide(-1);el('forward').onclick=()=>swapSlide(1);el('undo').onclick=undo;el('save').onclick=persistHTML;el('pdf').onclick=printAll;el('source').onclick=sourceModal;el('copySource').onclick=copySource;el('closeSource').onclick=()=>modal('sourceModal',false);el('reset').onclick=resetSaved;
document.querySelectorAll('.modalwrap').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)modal(m.id,false)}));
try{const cached=JSON.parse(localStorage.getItem('slide_edit_'+deck.id)||'null');if(Array.isArray(cached)&&cached.length&&cached.every(s=>typeof s.title==='string'))deck.slides=cached}catch(err){}
render();</script></body></html>
