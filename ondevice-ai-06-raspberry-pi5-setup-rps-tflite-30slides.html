function push(){history.push(JSON.stringify({slides,idx}));if(history.length>30)history.shift()}
function render(){let s=slides[idx];if(!s)return;const steps=(s.steps||[]).map(p=>`<div class="step"><b data-edit="title">${esc(p[0])}</b><span data-edit="text">${esc(p[1])}</span></div>`).join('');document.getElementById('slide').className='slide'+(direct?' editable':'');document.getElementById('slide').innerHTML=`<div class="top"><div class="kicker" data-edit="ch">${esc(s.ch)}</div><h1 data-edit="title">${esc(s.title)}</h1><p class="lead" data-edit="lead">${esc(s.lead)}</p></div><div class="left">${steps}${s.cmd?`<div class="codebox"><div class="cap">터미널 명령 · 직접 복사 가능</div><pre data-edit="cmd">${esc(s.cmd)}</pre></div>`:''}</div><aside class="aside"><div class="visual">${svgDiagram(s.diagram)}</div>${s.expected?`<div class="callout"><b>정상 결과</b>　<span data-edit="expected">${esc(s.expected)}</span></div>`:''}${s.warning?`<div class="callout warn"><b>주의 / 오류 예방</b>　<span data-edit="warning">${esc(s.warning)}</span></div>`:''}</aside><footer class="foot"><span>연세대학교 · Raspberry Pi 5 온디바이스 AI 실습</span><span>${String(idx+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span></footer>`;document.getElementById('meter').textContent=`${idx+1} / ${slides.length} 페이지`;if(direct)setupDirect()}

function editCurrent(){const s=slides[idx];for(let [id,key] of [['eCh','ch'],['eTitle','title'],['eLead','lead'],['eCmd','cmd'],['eExpected','expected'],['eWarning','warning']])document.getElementById(id).value=s[key]||'';document.getElementById('eSteps').value=(s.steps||[]).map(x=>x.join(' | ')).join('\n');document.getElementById('editor').showModal()}
function commitEdit(){push();const s=slides[idx];for(let [id,key] of [['eCh','ch'],['eTitle','title'],['eLead','lead'],['eCmd','cmd'],['eExpected','expected'],['eWarning','warning']])s[key]=document.getElementById(id).value;s.steps=document.getElementById('eSteps').value.split('\n').filter(Boolean).map(x=>{let i=x.indexOf('|');return i<0?[x.trim(),'']:[x.slice(0,i).trim(),x.slice(i+1).trim()]});document.getElementById('editor').close();render()}
function toggleDirect(){direct=!direct;render()}function setupDirect(){document.querySelectorAll('[data-edit]').forEach(e=>{e.contentEditable='true';e.addEventListener('blur',()=>{const base=slides[idx];let els=[...document.querySelectorAll('.step')];base.ch=document.querySelector('.kicker').innerText;base.title=document.querySelector('h1').innerText;base.lead=document.querySelector('.lead').innerText;base.steps=els.map(d=>[d.querySelector('b').innerText,d.querySelector('span').innerText]);let p=document.querySelector('pre[data-edit="cmd"]');if(p)base.cmd=p.innerText;let a=document.querySelector('[data-edit="expected"]');if(a)base.expected=a.innerText;let b=document.querySelector('[data-edit="warning"]');if(b)base.warning=b.innerText})})}
function cloneSlide(){push();slides.splice(idx+1,0,JSON.parse(JSON.stringify(slides[idx])));idx++;render()}function newSlide(){push();slides.splice(idx+1,0,{ch:'추가 단원',title:'새 페이지',lead:'설명을 입력하세요.',steps:[['항목 1','여기에 내용을 적으세요.']],cmd:'',expected:'',warning:'',diagram:'overview'});idx++;render()}
function deleteSlide(){if(slides.length<2)return alert('마지막 페이지는 삭제할 수 없습니다.');if(!confirm('현재 페이지를 삭제할까요?'))return;push();slides.splice(idx,1);idx=Math.min(idx,slides.length-1);render()}
function undo(){if(!history.length)return alert('되돌릴 작업이 없습니다.');const state=JSON.parse(history.pop());slides=state.slides;idx=state.idx;render()}
function showIndex(){document.getElementById('indexList').innerHTML=slides.map((s,i)=>`<button style="text-align:left" onclick="idx=${i};render();document.getElementById('index').close()">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</button>`).join('');document.getElementById('index').showModal()}
function saveHTML(){let doc='<!doctype html>\n'+document.documentElement.outerHTML;let data=JSON.stringify(slides).replace(/</g,'\\u003c');doc=doc.replace(/<script id="slide-data" type="application\/json">[\s\S]*?<\/script>/,`<script id="slide-data" type="application/json">${data}<\/script>`);let blob=new Blob([doc],{type:'text/html;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='raspberry_pi5_lecture_edited.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function printAll(){let old=idx;document.querySelectorAll('.printClone').forEach(e=>e.remove());slides.forEach((s,i)=>{idx=i;render();const clone=document.getElementById('slide').cloneNode(true);clone.removeAttribute('id');clone.classList.add('printClone');document.querySelector('.wrap').appendChild(clone)});idx=old;render();setTimeout(()=>{window.print();setTimeout(()=>document.querySelectorAll('.printClone').forEach(e=>e.remove()),1500)},150)}
window.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('[contenteditable]')||e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});render();
</script></body></html>
