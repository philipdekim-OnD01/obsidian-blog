><text x=\"987\" y=\"324\">출력<\/text><\/g><\/svg><\/div><div class=\"takeaway blue\"><span class=\"take-label\">핵심 혁신<\/span><span class=\"ed take-text\">이미지를 작은 패치의 시퀀스로 바꾸고, 패치 사이의 관계를 Self-Attention으로 학습합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://research.google/pubs/an-image-is-worth-16x16-words-transformers-for-image-recognition-at-scale/\" target=\"_blank\" rel=\"noreferrer\">Google Research ViT, ICLR 2021<\/a><\/div><div class=\"ed foot-note\">예: 224×224 이미지를 16×16 패치로 나누면 14×14 = 196개 패치 토큰이 생깁니다. 분류 시 [CLS] 토큰을 추가하는 구성도 있습니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"07 · VISION TRANSFORMER"},{"name":"CNN과 ViT: 특징을 찾는 방식이 다르다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">07 · VISION TRANSFORMER<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">CNN과 ViT: 특징을 찾는 방식이 다르다<\/h1><p class=\"ed slide-lead\">CNN은 근처 픽셀 관계를 먼저 보고, ViT는 토큰 간 넓은 관계를 학습합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"two-panels\"><div class=\"panel comparison-box\"><div class=\"comparison-head\">CNN · Local Inductive Bias<\/div><h3 class=\"ed \">작은 필터가 공간적으로 이동<\/h3><p class=\"ed \">국소 패턴·이동 동등성과 같은 구조적 귀납편향이 강합니다.<\/p><div class=\"equation\">3 × 3 Conv<\/div><\/div><div class=\"panel comparison-box\"><div class=\"comparison-head green\">ViT · Global Attention<\/div><h3 class=\"ed \">패치의 토큰끼리 관계 계산<\/h3><p class=\"ed \">큰 사전학습 데이터에서 강력한 시각 표현을 얻을 수 있습니다.<\/p><div class=\"equation\">Attention(Q,K,V)<\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">오해 방지<\/span><span class=\"ed take-text\">ViT가 모든 데이터 규모·전력 조건에서 CNN보다 좋은 것은 아닙니다. 긴 토큰 시퀀스는 메모리·연산 부담을 키울 수 있습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://research.google/pubs/an-image-is-worth-16x16-words-transformers-for-image-recognition-at-scale/\" target=\"_blank\" rel=\"noreferrer\">ViT 원 논문<\/a> · <a href=\"https://arxiv.org/abs/2201.03545\" target=\"_blank\" rel=\"noreferrer\">ConvNeXt<\/a><\/div><div class=\"ed foot-note\">표준 Self-Attention의 토큰 간 상호작용 수는 길이 N에 대해 대략 O(N²)입니다. 실제 연산량은 아키텍처와 최적화에 따라 달라집니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"07 · VISION TRANSFORMER"},{"name":"DINO는 모델 구조인가, 학습 방법인가?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">08 · SELF-SUPERVISION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">DINO는 모델 구조인가, 학습 방법인가?<\/h1><p class=\"ed slide-lead\">DINO = Self-DIstillation with NO labels · 이미지에 정답 라벨이 없어도 특징을 학습<\/p><\/div>\n      <div class=\"main\"><div class=\"two-panels\"><div class=\"panel comparison-box\"><div class=\"comparison-head\">기존 지도학습<\/div><div class=\"flowline\"><div class=\"path-box \">이미지<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">사람이 붙인 라벨<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">오차 계산<\/div><\/div><p class=\"ed \">원하는 분류·탐지 과제마다 충분한 라벨이 중요합니다.<\/p><\/div><div class=\"panel comparison-box\"><div class=\"comparison-head green\">DINO 자기지도학습<\/div><div class=\"flowline\"><div class=\"path-box \">라벨 없는 이미지<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">다양한 이미지 뷰<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">표현 일치 학습<\/div><\/div><p class=\"ed \">이미지 자체에서 학습 신호를 만들어 범용 시각 표현을 획득합니다.<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">구분<\/span><span class=\"ed take-text\">ViT는 신경망 아키텍처, DINO는 주로 자기지도학습 방법 및 이를 이용해 학습한 백본 계열입니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/2104.14294\" target=\"_blank\" rel=\"noreferrer\">Caron et al., DINO 2021<\/a> · <a href=\"https://arxiv.org/abs/2304.07193\" target=\"_blank\" rel=\"noreferrer\">DINOv2<\/a><\/div><div class=\"ed foot-note\">DINO는 객체 탐지 분야의 “DINO: DETR with Improved DeNoising Anchor Boxes”와 다른 연구 계열입니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"08 · SELF-SUPERVISION"},{"name":"DINO의 Teacher–Student 학습을 이해하기","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">08 · SELF-SUPERVISION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">DINO의 Teacher–Student 학습을 이해하기<\/h1><p class=\"ed slide-lead\">한 장의 사진을 다른 방식으로 보여 주어도 중요한 의미는 같도록 학습합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"wide-visual\"><svg class=\"art\" viewBox=\"0 0 1100 350\" role=\"img\" aria-label=\"DINO 자기지도학습 Teacher Student 두 시점 특징 일치 도식\">\n    <defs><marker id=\"darr\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8\" fill=\"#7295b9\"/><\/marker><\/defs>\n    <g font-size=\"22\" font-weight=\"800\" text-anchor=\"middle\"><rect x=\"15\" y=\"106\" width=\"164\" height=\"144\" rx=\"17\" fill=\"#ddebf9\"/><text x=\"97\" y=\"164\" fill=\"#2c5f8f\">라벨 없는<\/text><text x=\"97\" y=\"199\" fill=\"#2c5f8f\">원본 이미지<\/text>\n    <rect x=\"256\" y=\"23\" width=\"242\" height=\"135\" rx=\"17\" fill=\"#dfefe9\"/><text x=\"377\" y=\"74\" fill=\"#3f836c\">Student<\/text><text x=\"377\" y=\"110\" font-size=\"19\" fill=\"#3f836c\">다양한 Crop/증강<\/text>\n    <rect x=\"256\" y=\"198\" width=\"242\" height=\"135\" rx=\"17\" fill=\"#eae3f8\"/><text x=\"377\" y=\"249\" fill=\"#7864a4\">Teacher<\/text><text x=\"377\" y=\"285\" font-size=\"19\" fill=\"#7864a4\">다른 Crop/증강<\/text>\n    <rect x=\"610\" y=\"53\" width=\"233\" height=\"230\" rx=\"17\" fill=\"#eef3fa\" stroke=\"#b5cede\"/><text x=\"726\" y=\"111\" fill=\"#335f84\">예측 분포<\/text><text x=\"726\" y=\"150\" font-size=\"18\" fill=\"#335f84\">서로 가깝도록<\/text><text x=\"726\" y=\"187\" font-size=\"18\" fill=\"#335f84\">학생 모델 학습<\/text><text x=\"726\" y=\"228\" font-size=\"15\" fill=\"#7290a6\">Teacher는 EMA 갱신<\/text>\n    <rect x=\"911\" y=\"93\" width=\"176\" height=\"159\" rx=\"18\" fill=\"#d6f3e7\"/><text x=\"999\" y=\"158\" fill=\"#29795d\">재사용 가능한<\/text><text x=\"999\" y=\"196\" fill=\"#29795d\">특징 표현<\/text><\/g>\n    <g stroke=\"#7295b9\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#darr)\"><path d=\"M181 177H216V91H249\"/><path d=\"M216 177V265H249\"/><path d=\"M502 91H604\"/><path d=\"M502 265H604\"/><path d=\"M847 169H905\"/><\/g><\/svg><\/div><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">AUGMENT<\/div><h3 class=\"ed card-title\">1. 다른 시점 만들기<\/h3><p class=\"ed card-desc\">같은 이미지에 Crop·크기 변환 등을 적용합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">SELF-DISTILL<\/div><h3 class=\"ed card-title\">2. 서로 맞추기<\/h3><p class=\"ed card-desc\">Student가 Teacher의 표현 분포를 따라가게 합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">TRANSFER<\/div><h3 class=\"ed card-title\">3. 특징 재사용<\/h3><p class=\"ed card-desc\">학습된 백본을 다른 이미지 과제에 사용합니다.<\/p><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/2104.14294\" target=\"_blank\" rel=\"noreferrer\">DINO 원 논문<\/a><\/div><div class=\"ed foot-note\">교육용 개념도입니다. 실제 DINO에는 multi-crop, centering, sharpening, momentum teacher(EMA) 등 붕괴 방지 메커니즘이 포함됩니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"08 · SELF-SUPERVISION"},{"name":"DINO 계열의 진화: 2021 → 2023 → 2025","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">08 · SELF-SUPERVISION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">DINO 계열의 진화: 2021 → 2023 → 2025<\/h1><p class=\"ed slide-lead\">세대가 바뀔수록 “좋은 특징을 대규모 라벨 없이 학습하고 재사용한다”는 목표가 확장됐습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"timeline\"><div class=\"era\"><span class=\"yr\">2021<\/span><strong class=\"ed\">DINO<\/strong><em class=\"ed\">Caron 외 / 라벨 없는 Self-Distillation<\/em><\/div><div class=\"era\"><span class=\"yr\">2023<\/span><strong class=\"ed\">DINOv2<\/strong><em class=\"ed\">Oquab 외 / 범용 시각 표현<\/em><\/div><div class=\"era\"><span class=\"yr\">2023<\/span><strong class=\"ed\">Registers<\/strong><em class=\"ed\">Darcet 외 / 표현 품질 개선<\/em><\/div><div class=\"era\"><span class=\"yr\">2025<\/span><strong class=\"ed\">DINOv3<\/strong><em class=\"ed\">Meta FAIR / 고밀도 특징·대규모 확장<\/em><\/div><div class=\"era\"><span class=\"yr\">2026<\/span><strong class=\"ed\">실무 적용<\/strong><em class=\"ed\">불량·세포·위성 등 도메인 평가<\/em><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">주의<\/span><span class=\"ed take-text\">DINO, DINOv2, DINOv3를 서로 같은 평가 데이터 없이 정확도 한 줄로 순위화하지 않습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/2104.14294\" target=\"_blank\" rel=\"noreferrer\">DINO 2021<\/a> · <a href=\"https://arxiv.org/abs/2304.07193\" target=\"_blank\" rel=\"noreferrer\">DINOv2 2023<\/a> · <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3 2025<\/a><\/div><div class=\"ed foot-note\">2026은 강의 관점의 적용 시기이지 새 DINO 공식 모델 출시를 뜻하지 않습니다. v2는 2023년 4월, v3는 2025년 8월 발표되었습니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"08 · SELF-SUPERVISION"},{"name":"DINO (2021): 라벨 없이 의미를 배울 수 있나?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">08 · SELF-SUPERVISION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">DINO (2021): 라벨 없이 의미를 배울 수 있나?<\/h1><p class=\"ed slide-lead\">Mathilde Caron 연구팀 · 학습된 ViT의 특징에서 의미 있는 영역 분리가 나타남<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">2021 · Emerging Properties in SSL ViTs<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">정답 라벨 없이도 ViT 표현에서 유용한 시각 구조가 등장<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">Teacher–Student 학습, 작은 패치, multi-crop 등이 중요한 설계 요소<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">원 논문은 ViT-Base 선형 평가 ImageNet Top-1 80.1%를 보고<\/div><\/div><\/div><div class=\"panel\"><div class=\"metric\"><strong class=\"ed\">80.1%<\/strong><span class=\"ed\">DINO 원 논문 linear evaluation<\/span><small class=\"ed\">ViT-B / ImageNet-1K<\/small><\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">해석<\/span><span class=\"ed take-text\">DINO의 80.1%는 ImageNet을 직접 지도학습한 결과와 학습 설정이 달라 단순 승패를 말할 수 없습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/2104.14294\" target=\"_blank\" rel=\"noreferrer\">Caron et al., 2021<\/a><\/div><div class=\"ed foot-note\">80.1%는 DINO 논문에서 보고한 ViT-Base linear evaluation 결과입니다. 기존 TorchVision Top-1 그래프와 학습 절차가 다릅니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"08 · SELF-SUPERVISION"},{"name":"DINOv2 (2023): 범용 시각 특징의 시대","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">08 · SELF-SUPERVISION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">DINOv2 (2023): 범용 시각 특징의 시대<\/h1><p class=\"ed slide-lead\">Maxime Oquab 연구팀 · 많은 라벨 없는 이미지로 학습한 특징을 다양한 과제에 활용<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">2023 · Learning Robust Visual Features<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">큐레이션한 대규모 이미지 데이터셋을 활용하여 학습 안정성·품질 개선<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">공개 프로젝트는 1억 4,200만 장 수준의 비라벨 이미지 사전학습을 설명<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">가벼운 Linear Head만으로도 여러 다운스트림 과제에 적용 가능한 특징<\/div><\/div><\/div><div class=\"panel\"><div class=\"metric\"><strong class=\"ed\">142M<\/strong><span class=\"ed\">비라벨 사전학습 이미지<\/span><small class=\"ed\">DINOv2 공개 구현 설명<\/small><\/div><div class=\"diagram-caption ed\">Foundation Backbone → 다양한 태스크<\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">강의 연결<\/span><span class=\"ed take-text\">반도체 불량 라벨이 부족할 때도 사전학습 특징을 먼저 추출하고 적은 라벨로 검증하는 전략이 가능합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/2304.07193\" target=\"_blank\" rel=\"noreferrer\">DINOv2 원 논문<\/a> · <a href=\"https://github.com/facebookresearch/dinov2\" target=\"_blank\" rel=\"noreferrer\">Meta DINOv2 구현<\/a><\/div><div class=\"ed foot-note\">142M은 DINOv2 공개 자료의 사전학습 이미지 규모입니다. 반도체 데이터에서 성능을 보장하는 숫자가 아닙니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"08 · SELF-SUPERVISION"},{"name":"DINOv3 (2025): 픽셀 위치까지 풍부한 특징","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">08 · SELF-SUPERVISION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">DINOv3 (2025): 픽셀 위치까지 풍부한 특징<\/h1><p class=\"ed slide-lead\">Meta FAIR 연구팀 · 대규모 자기지도학습에서 고밀도 특징을 안정적으로 보존하는 것이 핵심<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">2025-08-14 · Meta DINOv3<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">강력한 고해상도 Dense Feature를 다양한 시각 과제로 재사용<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">긴 학습 중 공간 특징맵이 열화되는 문제에 Gram Anchoring 제안<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">ViT 기반 모델뿐 아니라 자원 제약을 고려한 ConvNeXt 기반 백본도 제공<\/div><\/div><\/div><div class=\"panel\"><svg class=\"art\" viewBox=\"0 0 1080 345\" role=\"img\" aria-label=\"DINO 특징맵에서 같은 의미의 결함 영역이 유사한 표현을 얻는 개념도\">\n    <g font-family=\"Arial,sans-serif\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"800\" fill=\"#34556d\"><text x=\"150\" y=\"31\">원본 검사 이미지<\/text><text x=\"530\" y=\"31\">DINO 패치 특징<\/text><text x=\"920\" y=\"31\">가벼운 다운스트림 모델<\/text><\/g>\n    <g><rect x=\"22\" y=\"55\" width=\"270\" height=\"225\" rx=\"18\" fill=\"#d5e9f4\"/><rect x=\"56\" y=\"89\" width=\"205\" height=\"164\" rx=\"9\" fill=\"#88a9c0\"/><path d=\"M101 122l98 88\" stroke=\"#fee4b0\" stroke-width=\"16\"/><circle cx=\"207\" cy=\"125\" r=\"14\" fill=\"#e98d71\"/><\/g>\n    <g><rect x=\"405\" y=\"55\" width=\"270\" height=\"225\" rx=\"18\" fill=\"#e5def8\"/><g transform=\"translate(444 86)\"><rect width=\"192\" height=\"165\" fill=\"#ddd2f5\"/><g stroke=\"#fff\" stroke-width=\"3\"><path d=\"M48 0v165M96 0v165M144 0v165M0 41h192M0 82h192M0 123h192\"/><\/g><g fill=\"#8d70c7\"><rect x=\"48\" y=\"41\" width=\"48\" height=\"41\"/><rect x=\"96\" y=\"82\" width=\"48\" height=\"41\"/><rect x=\"144\" y=\"82\" width=\"48\" height=\"41\"/><rect x=\"96\" y=\"41\" width=\"48\" height=\"41\"/><\/g><\/g><\/g>\n    <g><rect x=\"794\" y=\"55\" width=\"270\" height=\"225\" rx=\"18\" fill=\"#e0f4ea\"/><rect x=\"821\" y=\"116\" width=\"215\" height=\"105\" rx=\"12\" fill=\"#c0e8d3\"/><text x=\"928\" y=\"154\" text-anchor=\"middle\" font-size=\"25\" font-weight=\"800\" fill=\"#26775c\">선형 분류기<\/text><text x=\"928\" y=\"192\" text-anchor=\"middle\" font-size=\"20\" fill=\"#26775c\">또는 분할 Head<\/text><\/g>\n    <g stroke=\"#5c92b0\" stroke-width=\"4\"><path d=\"M304 165h90M686 165h96\"/><\/g><g fill=\"#355f7b\" font-size=\"18\" text-anchor=\"middle\"><text x=\"156\" y=\"320\">시료 이미지<\/text><text x=\"540\" y=\"320\">공간 위치가 남는 특징맵<\/text><text x=\"932\" y=\"320\">소량 라벨로 응용 평가<\/text><\/g><\/svg><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">핵심<\/span><span class=\"ed take-text\">DINOv3의 성과는 특정 한 개 클래스의 점수를 높이는 것을 넘어 재사용 가능한 시각 백본을 제공한다는 점입니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">Meta FAIR DINOv3<\/a> · <a href=\"https://github.com/facebookresearch/dinov3\" target=\"_blank\" rel=\"noreferrer\">DINOv3 공개 구현<\/a><\/div><div class=\"ed foot-note\">DINOv3는 학습된 특징을 제공하는 백본입니다. 분류·탐지·분할로 사용하려면 각 과제용 Head와 검증이 필요합니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"08 · SELF-SUPERVISION"},{"name":"Dense Feature는 무엇이 다른가?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">08 · SELF-SUPERVISION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">Dense Feature는 무엇이 다른가?<\/h1><p class=\"ed slide-lead\">이미지 전체를 하나의 숫자 벡터로만 요약하지 않고, 공간 위치별 특징을 유지할 수 있습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"wide-visual\"><svg class=\"art\" viewBox=\"0 0 1080 345\" role=\"img\" aria-label=\"DINO 특징맵에서 같은 의미의 결함 영역이 유사한 표현을 얻는 개념도\">\n    <g font-family=\"Arial,sans-serif\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"800\" fill=\"#34556d\"><text x=\"150\" y=\"31\">원본 검사 이미지<\/text><text x=\"530\" y=\"31\">DINO 패치 특징<\/text><text x=\"920\" y=\"31\">가벼운 다운스트림 모델<\/text><\/g>\n    <g><rect x=\"22\" y=\"55\" width=\"270\" height=\"225\" rx=\"18\" fill=\"#d5e9f4\"/><rect x=\"56\" y=\"89\" width=\"205\" height=\"164\" rx=\"9\" fill=\"#88a9c0\"/><path d=\"M101 122l98 88\" stroke=\"#fee4b0\" stroke-width=\"16\"/><circle cx=\"207\" cy=\"125\" r=\"14\" fill=\"#e98d71\"/><\/g>\n    <g><rect x=\"405\" y=\"55\" width=\"270\" height=\"225\" rx=\"18\" fill=\"#e5def8\"/><g transform=\"translate(444 86)\"><rect width=\"192\" height=\"165\" fill=\"#ddd2f5\"/><g stroke=\"#fff\" stroke-width=\"3\"><path d=\"M48 0v165M96 0v165M144 0v165M0 41h192M0 82h192M0 123h192\"/><\/g><g fill=\"#8d70c7\"><rect x=\"48\" y=\"41\" width=\"48\" height=\"41\"/><rect x=\"96\" y=\"82\" width=\"48\" height=\"41\"/><rect x=\"144\" y=\"82\" width=\"48\" height=\"41\"/><rect x=\"96\" y=\"41\" width=\"48\" height=\"41\"/><\/g><\/g><\/g>\n    <g><rect x=\"794\" y=\"55\" width=\"270\" height=\"225\" rx=\"18\" fill=\"#e0f4ea\"/><rect x=\"821\" y=\"116\" width=\"215\" height=\"105\" rx=\"12\" fill=\"#c0e8d3\"/><text x=\"928\" y=\"154\" text-anchor=\"middle\" font-size=\"25\" font-weight=\"800\" fill=\"#26775c\">선형 분류기<\/text><text x=\"928\" y=\"192\" text-anchor=\"middle\" font-size=\"20\" fill=\"#26775c\">또는 분할 Head<\/text><\/g>\n    <g stroke=\"#5c92b0\" stroke-width=\"4\"><path d=\"M304 165h90M686 165h96\"/><\/g><g fill=\"#355f7b\" font-size=\"18\" text-anchor=\"middle\"><text x=\"156\" y=\"320\">시료 이미지<\/text><text x=\"540\" y=\"320\">공간 위치가 남는 특징맵<\/text><text x=\"932\" y=\"320\">소량 라벨로 응용 평가<\/text><\/g><\/svg><\/div><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">Image-level<\/div><h3 class=\"ed card-title\">Global Feature<\/h3><p class=\"ed card-desc\">한 장의 이미지가 어떤 종류인지 분류하거나 검색<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">Location-level<\/div><h3 class=\"ed card-title\">Patch / Dense Feature<\/h3><p class=\"ed card-desc\">위치별 질감·형태·부분 의미를 보존해 분석<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">Downstream Task<\/div><h3 class=\"ed card-title\">Application Head<\/h3><p class=\"ed card-desc\">특징맵으로부터 탐지·분할·이상점수 등을 학습<\/p><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3 논문<\/a><\/div><div class=\"ed foot-note\">그림은 원 논문의 이미지를 복제한 것이 아닌 교육용 개념도입니다. 실제 DINOv3 feature dimension·해상도는 백본 설정에 따라 다릅니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"08 · SELF-SUPERVISION"},{"name":"YOLO와 DINO: 무엇이 더 좋은 모델인가?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">08 · SELF-SUPERVISION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">YOLO와 DINO: 무엇이 더 좋은 모델인가?<\/h1><p class=\"ed slide-lead\">서로 다른 문제를 해결하기 때문에 하나가 다른 하나를 전면 대체하는 관계는 아닙니다.<\/p><\/div>\n      <div class=\"main\"><table class=\"content-table\"><thead><tr><th>판단 기준<\/th><th>YOLO 계열<\/th><th>DINO 계열<\/th><\/tr><\/thead><tbody><tr><td class=\"ed\">주요 목표<\/td><td class=\"ed\">검출 대상의 위치·분류<\/td><td class=\"ed\">범용 특징의 사전학습·재사용<\/td><\/tr><tr><td class=\"ed\">사전학습<\/td><td class=\"ed\">탐지 데이터셋(대개 박스 라벨)<\/td><td class=\"ed\">정답 라벨 없는 대규모 이미지<\/td><\/tr><tr><td class=\"ed\">최종 출력<\/td><td class=\"ed\">Bounding box·class (+ 기타 Head)<\/td><td class=\"ed\">Feature map·embedding (+ 별도 Head)<\/td><\/tr><tr><td class=\"ed\">실시간 배포<\/td><td class=\"ed\">Nano 등 작은 모델 선택 가능<\/td><td class=\"ed\">백본 크기·Head·연산 최적화 필요<\/td><\/tr><tr><td class=\"ed\">반도체 결함<\/td><td class=\"ed\">결함 위치·건수 파악<\/td><td class=\"ed\">라벨 부족·도메인 적응·특징 기반 분석<\/td><\/tr><\/tbody><\/table><div class=\"takeaway blue\"><span class=\"take-label\">선택 원칙<\/span><span class=\"ed take-text\">“결함 위치를 즉시 표시”해야 하면 YOLO를 먼저 검토하고, 라벨이 희소해 여러 과제를 재사용해야 하면 DINO 기반 접근을 검토합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">YOLO26<\/a> · <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3<\/a><\/div><div class=\"ed foot-note\">YOLO도 범용 백본을 사용할 수 있고, DINO 특징 위에 탐지 Head를 붙일 수 있으므로 서로 완전히 배타적인 기술은 아닙니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"08 · SELF-SUPERVISION"},{"name":"ViT·DINO의 위험: 학습이 쉬워져도 배포가 쉬운 것은 아니다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">08 · SELF-SUPERVISION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">ViT·DINO의 위험: 학습이 쉬워져도 배포가 쉬운 것은 아니다<\/h1><p class=\"ed slide-lead\">라벨 비용을 줄이는 것과 Raspberry Pi 5에서 저지연으로 실행하는 것은 별도의 문제입니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"four-grid\"><div class=\"info-card \"><div class=\"card-top\">MEMORY<\/div><h3 class=\"ed card-title\">모델 크기<\/h3><p class=\"ed card-desc\">ViT-L/B 기반 DINO는 RPi 메모리와 CPU 추론이 부담될 수 있습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">TOKENS<\/div><h3 class=\"ed card-title\">패치 해상도<\/h3><p class=\"ed card-desc\">토큰 수 증가 시 Attention 계산량과 중간 활성화가 크게 증가할 수 있습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">DOMAIN SHIFT<\/div><h3 class=\"ed card-title\">학습 데이터 간 차이<\/h3><p class=\"ed card-desc\">일반 이미지에서 학습한 특징이 반도체 미세 결함에 최적화됐다는 보장이 없습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">EVALUATION<\/div><h3 class=\"ed card-title\">계측·검증<\/h3><p class=\"ed card-desc\">Defect Recall·IoU·Latency·RAM·Power를 동일 조건으로 재야 합니다.<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">실행<\/span><span class=\"ed take-text\">DINO는 T4에서 특징을 추출해 Linear Probe부터 시작하고, RPi 배포는 작은 CNN/YOLO와 분리해 검토합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://research.google/pubs/an-image-is-worth-16x16-words-transformers-for-image-recognition-at-scale/\" target=\"_blank\" rel=\"noreferrer\">ViT<\/a> · <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3<\/a><\/div><div class=\"ed foot-note\">RPi에서의 실제 성능은 별도 측정이 필요합니다. DINO 백본의 라이선스와 배포 정책도 채택 전에 확인하세요.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"08 · SELF-SUPERVISION"},{"name":"AI 반도체 관점: 백본과 실행 하드웨어","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">07 · BEYOND CNN<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">AI 반도체 관점: 백본과 실행 하드웨어<\/h1><p class=\"ed slide-lead\">CPU·GPU·NPU가 지원하는 연산을 모델 설계에 반영하는 시대입니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"four-grid\"><div class=\"info-card \"><div class=\"card-top\">ALGORITHM<\/div><h3 class=\"ed card-title\">정확도<\/h3><p class=\"ed card-desc\">분류 정확도, F1, Recall, 클래스별 오류를 확인합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">SYSTEM<\/div><h3 class=\"ed card-title\">지연시간<\/h3><p class=\"ed card-desc\">실제 장치에서 1장 처리시간과 FPS를 측정합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">MEMORY<\/div><h3 class=\"ed card-title\">메모리<\/h3><p class=\"ed card-desc\">가중치뿐 아니라 중간 특징맵과 피크 RAM을 확인합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">HARDWARE<\/div><h3 class=\"ed card-title\">지원 연산<\/h3><p class=\"ed card-desc\">양자화 가능한 연산자와 가속기 delegate를 검토합니다.<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">핵심<\/span><span class=\"ed take-text\">“좋은 AI 모델”의 정의는 연구실 정확도에서 시스템 전체 효율로 확장되었습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/2404.10518\" target=\"_blank\" rel=\"noreferrer\">MobileNetV4<\/a> · <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision<\/a><\/div><div class=\"ed foot-note\">상용 NPU의 속도·효율은 칩별 커널 구현과 SW 스택에 따라 크게 달라질 수 있습니다.<\/div><\/div><div class=\"foot-number\">21 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"07 · BEYOND CNN"},{"name":"2026년 비전 AI 기술 지형: 세 축을 함께 설계","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">09 · SYSTEM DESIGN<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">2026년 비전 AI 기술 지형: 세 축을 함께 설계<\/h1><p class=\"ed slide-lead\">CNN·YOLO·DINO는 경쟁 구도로만 보지 말고 기능을 조합하는 관점이 중요합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"wide-visual\"><svg class=\"art\" viewBox=\"0 0 1160 318\" role=\"img\" aria-label=\"분류와 객체 탐지, 자기지도 비전 표현 세 경로를 비교하는 도식\">\n    <defs><marker id=\"triArrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8\" fill=\"#6895b6\"/><\/marker><\/defs>\n    <g font-size=\"23\" font-weight=\"800\" text-anchor=\"middle\"><rect x=\"12\" y=\"32\" width=\"220\" height=\"250\" rx=\"20\" fill=\"#e0edf9\"/><text x=\"122\" y=\"65\" fill=\"#215a88\">입력 이미지<\/text>\n    <rect x=\"43\" y=\"93\" width=\"160\" height=\"154\" rx=\"10\" fill=\"#acd1eb\"/><rect x=\"75\" y=\"125\" width=\"77\" height=\"82\" rx=\"8\" fill=\"#6198bb\"/><path d=\"M99 130l38 57\" stroke=\"#fff1d8\" stroke-width=\"12\"/><circle cx=\"152\" cy=\"125\" r=\"13\" fill=\"#f9b88a\"/><\/g>\n    <g stroke=\"#6497be\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#triArrow)\"><path d=\"M240 154H290\"/><path d=\"M240 154H290\"/><\/g>\n    <g font-size=\"21\" font-weight=\"800\" text-anchor=\"middle\"><rect x=\"290\" y=\"20\" width=\"260\" height=\"268\" rx=\"20\" fill=\"#eff7fc\" stroke=\"#bbd8e8\"/><text x=\"420\" y=\"57\" fill=\"#2b628a\">분류 · DenseNet<\/text><rect x=\"342\" y=\"105\" width=\"154\" height=\"90\" rx=\"13\" fill=\"#c3e0f4\"/><text x=\"420\" y=\"151\" fill=\"#1c5a87\">Defect<\/text><text x=\"420\" y=\"180\" font-size=\"16\" fill=\"#5b88aa\">확률 0.93<\/text><text x=\"420\" y=\"249\" font-size=\"17\" fill=\"#47738c\">무엇인가?<\/text>\n    <rect x=\"570\" y=\"20\" width=\"260\" height=\"268\" rx=\"20\" fill=\"#e9f7f3\" stroke=\"#a7dfcf\"/><text x=\"700\" y=\"57\" fill=\"#267e6b\">탐지 · YOLO<\/text><rect x=\"623\" y=\"98\" width=\"154\" height=\"112\" rx=\"9\" fill=\"#b2ddd5\"/><rect x=\"657\" y=\"120\" width=\"70\" height=\"60\" rx=\"4\" fill=\"none\" stroke=\"#ed754f\" stroke-width=\"5\"/><text x=\"700\" y=\"249\" font-size=\"17\" fill=\"#47756d\">무엇이 어디에?<\/text>\n    <rect x=\"850\" y=\"20\" width=\"295\" height=\"268\" rx=\"20\" fill=\"#f1edf9\" stroke=\"#d2c7e7\"/><text x=\"997\" y=\"57\" fill=\"#755c9f\">표현 학습 · DINO<\/text><\/g>\n    <g transform=\"translate(916 92)\"><rect width=\"164\" height=\"120\" rx=\"10\" fill=\"#dfd5f4\"/><g stroke=\"#fff\" stroke-width=\"2\"><path d=\"M41 0v120M82 0v120M123 0v120M0 30h164M0 60h164M0 90h164\"/><\/g><g fill=\"#9f80ce\"><rect x=\"42\" y=\"31\" width=\"40\" height=\"29\"/><rect x=\"83\" y=\"61\" width=\"40\" height=\"29\"/><rect x=\"124\" y=\"31\" width=\"39\" height=\"29\"/><\/g><\/g>\n    <text x=\"997\" y=\"249\" font-size=\"17\" text-anchor=\"middle\" fill=\"#736594\">범용 특징을 배우는가?<\/text><\/svg><\/div><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">WHAT<\/div><h3 class=\"ed card-title\">정확한 분류<\/h3><p class=\"ed card-desc\">CNN / ViT 백본에서 이미지 클래스를 분류<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">WHERE<\/div><h3 class=\"ed card-title\">위치 기반 행동<\/h3><p class=\"ed card-desc\">YOLO에서 위치와 객체를 찾아 경고·추적<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">LEARN<\/div><h3 class=\"ed card-title\">도메인 데이터 활용<\/h3><p class=\"ed card-desc\">DINO 특징으로 적은 라벨의 학습·검색·이상탐지 실험<\/p><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">YOLO26<\/a> · <a href=\"https://research.google/pubs/an-image-is-worth-16x16-words-transformers-for-image-recognition-at-scale/\" target=\"_blank\" rel=\"noreferrer\">ViT<\/a> · <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3<\/a><\/div><div class=\"ed foot-note\">2026년 현재 공식 모델 발표 기준으로 작성했습니다. 기술 사용 전 장치 연산자·배포 형식·소프트웨어 라이선스 검토가 필요합니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"09 · SYSTEM DESIGN"},{"name":"블로그 실습: DenseNet → TFLite → Raspberry Pi 5","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">09 · BLOG CASE<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">블로그 실습: DenseNet → TFLite → Raspberry Pi 5<\/h1><p class=\"ed slide-lead\">실제 수업 사례: 가위·바위·보 이미지 2,717장을 활용한 온디바이스 분류<\/p><\/div>\n      <div class=\"main\"><div class=\"rps-pipeline\"><div class=\"flowline\"><div class=\"path-box \">카메라 촬영<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">64 × 64 전처리<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">TFLite 추론<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">가위·바위·보<\/div><\/div><\/div><div class=\"two-panels\"><div class=\"panel\"><div class=\"metric\"><strong class=\"ed\">2,717장<\/strong><span class=\"ed\">데이터셋 전체<\/span><small class=\"ed\">가위 903 · 바위 907 · 보 907<\/small><\/div><\/div><div class=\"panel\"><div class=\"metric\"><strong class=\"ed\">3개<\/strong><span class=\"ed\">출력 클래스<\/span><small class=\"ed\">scissors · rock · paper<\/small><\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">블로그의 교육적 가치<\/span><span class=\"ed take-text\">학생이 전이학습 결과를 카메라가 있는 작은 컴퓨터에서 실제 서비스로 연결해 봅니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">RPS TFLite 강의 블로그<\/a><\/div><div class=\"ed foot-note\">블로그 파일명은 RPS_PreTrained_DenseNet.tflite입니다. 파일명만으로 DenseNet-121 변형인지 확정할 수 없습니다.<\/div><\/div><div class=\"foot-number\">22 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"09 · BLOG CASE"},{"name":"RPS 실습에서 실수하기 쉬운 부분","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">09 · BLOG CASE<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">RPS 실습에서 실수하기 쉬운 부분<\/h1><p class=\"ed slide-lead\">모델 자체보다 “학습 전처리와 추론 전처리의 일치”가 먼저입니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">COLOR ORDER<\/div><h3 class=\"ed card-title\">RGB / BGR<\/h3><p class=\"ed card-desc\">OpenCV의 BGR 프레임을 학습에 사용한 RGB 순서와 일치시켜야 합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">QUANTIZATION<\/div><h3 class=\"ed card-title\">Float / INT8<\/h3><p class=\"ed card-desc\">모델 입력 dtype, scale, zero-point와 실습 코드의 데이터 처리 방식이 맞아야 합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">LABELS<\/div><h3 class=\"ed card-title\">클래스 순서<\/h3><p class=\"ed card-desc\">가위=0, 바위=1, 보=2라는 라벨 매핑을 학습·추론에서 같게 유지합니다.<\/p><\/div><\/div><div class=\"simple-code\"><span>cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)<\/span><span>input_details[0][\"dtype\"]<\/span><span>input_details[0][\"quantization\"]<\/span><\/div><div class=\"takeaway blue\"><span class=\"take-label\">실습 우선순위<\/span><span class=\"ed take-text\">정확도가 낮으면 모델을 바꾸기 전에 색상 순서·정규화·양자화·라벨부터 확인하세요.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">RPS 강의 블로그<\/a> · <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision 전처리 가이드<\/a><\/div><div class=\"ed foot-note\">블로그 학습 예시는 RGB 변환을 사용하지만 기본 카메라 predict 예시는 BGR 프레임을 그대로 resize하는 코드가 있어 검증이 필요합니다.<\/div><\/div><div class=\"foot-number\">23 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"09 · BLOG CASE"},{"name":"FP32 → PTQ INT8 → QAT INT8","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">09 · BLOG CASE<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">FP32 → PTQ INT8 → QAT INT8<\/h1><p class=\"ed slide-lead\">“같은 모델”도 양자화 방법에 따라 정확도와 지연시간이 달라질 수 있습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">BASELINE<\/div><h3 class=\"ed card-title\">FP32<\/h3><p class=\"ed card-desc\">실수형 기준 모델. 비교의 출발점으로 사용합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">POST-TRAINING<\/div><h3 class=\"ed card-title\">PTQ INT8<\/h3><p class=\"ed card-desc\">학습 완료 후 가중치와 활성값을 양자화합니다. 대표 데이터가 중요합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">QUANT-AWARE<\/div><h3 class=\"ed card-title\">QAT INT8<\/h3><p class=\"ed card-desc\">학습 중 양자화 오차를 모사합니다. 정확도 저하를 줄이는 데 도움이 될 수 있습니다.<\/p><\/div><\/div><div class=\"experiment-note ed\">비교할 지표: 정확도 · Macro F1 · 모델 크기(MB) · 평균 지연시간(ms) · p95(ms) · FPS · 피크 RAM<\/div><div class=\"takeaway blue\"><span class=\"take-label\">측정 원칙<\/span><span class=\"ed take-text\">INT8이 항상 빠른 것은 아닙니다. 변환 지원과 Raspberry Pi 5 실행 백엔드를 함께 검토해야 합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://www.tensorflow.org/lite\" target=\"_blank\" rel=\"noreferrer\">TensorFlow Lite 개요<\/a> · <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">RPS 블로그<\/a><\/div><div class=\"ed foot-note\">이 페이지에는 아직 실측 수치를 넣지 않았습니다. 양자화 성능은 실제 동일 장치 실험으로 채워야 합니다.<\/div><\/div><div class=\"foot-number\">24 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"09 · BLOG CASE"},{"name":"학부·대학원 확장 실습: DenseNet → YOLO → DINO","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">10 · PRACTICE<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">학부·대학원 확장 실습: DenseNet → YOLO → DINO<\/h1><p class=\"ed slide-lead\">한 학기 실습을 분류·탐지·자기지도 표현의 3개 질문으로 연결합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">동일 이미지 데이터<\/div><h3 class=\"ed card-title\">실험 A · 분류<\/h3><p class=\"ed card-desc\">RPS DenseNet-121 vs MobileNetV2 비교: Accuracy·FPS·RAM·INT8<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">라벨 비용 추가<\/div><h3 class=\"ed card-title\">실험 B · 탐지<\/h3><p class=\"ed card-desc\">반도체 결함 박스 라벨을 만들어 YOLO26n 탐지 평가: mAP·Recall·Latency<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">특징 재사용<\/div><h3 class=\"ed card-title\">실험 C · 특징<\/h3><p class=\"ed card-desc\">DINOv2/v3 특징을 고정하고 소량 라벨 Linear Probe 및 이상탐지 탐색<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">주의<\/span><span class=\"ed take-text\">A/B/C는 같은 종류의 성능을 측정하지 않습니다. 같은 지표의 숫자를 만들려면 각 태스크에 적절한 동일 데이터·동일 설정이 필요합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">RPS 강의<\/a> · <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">YOLO26<\/a> · <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3<\/a><\/div><div class=\"ed foot-note\">실험 설계 제안입니다. 모델을 실제 실행해 얻은 결과가 아니며 결함 데이터와 정답 라벨 확보가 필요합니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"10 · PRACTICE"},{"name":"비교 실험 설계: 4가지 모델을 같은 조건으로","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">10 · EXPERIMENT<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">비교 실험 설계: 4가지 모델을 같은 조건으로<\/h1><p class=\"ed slide-lead\">DenseNet의 구조적 가치와 MobileNet의 엣지 적합성을 함께 확인합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"wide-visual\"><svg class=\"art\" viewBox=\"0 0 920 300\" role=\"img\" aria-label=\"동일 데이터로 모델을 비교하고 라즈베리파이에서 평가하는 파이프라인\">\n     <defs><marker id=\"eaar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8\" fill=\"#6296c7\"/><\/marker><\/defs>\n     <g font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\">\n     <rect x=\"5\" y=\"90\" width=\"157\" height=\"120\" rx=\"16\" fill=\"#e0ebfa\"/><text x=\"83\" y=\"145\" fill=\"#2b548e\">RPS 데이터<\/text><text x=\"83\" y=\"179\" fill=\"#2b548e\">2,717장<\/text>\n     <rect x=\"190\" y=\"90\" width=\"168\" height=\"120\" rx=\"16\" fill=\"#d7f2e4\"/><text x=\"274\" y=\"145\" fill=\"#23684f\">동일 전처리<\/text><text x=\"274\" y=\"179\" fill=\"#23684f\">동일 분할<\/text>\n     <rect x=\"386\" y=\"45\" width=\"220\" height=\"208\" rx=\"16\" fill=\"#fff2da\"/>\n     <text x=\"496\" y=\"93\" fill=\"#8d5f26\">ResNet18<\/text><text x=\"496\" y=\"132\" fill=\"#8d5f26\">DenseNet121<\/text><text x=\"496\" y=\"171\" fill=\"#8d5f26\">MobileNetV2<\/text><text x=\"496\" y=\"210\" fill=\"#8d5f26\">EfficientNet-B0<\/text>\n     <rect x=\"635\" y=\"90\" width=\"130\" height=\"120\" rx=\"16\" fill=\"#e1e5fd\"/><text x=\"700\" y=\"144\" fill=\"#4e5495\">TFLite<\/text><text x=\"700\" y=\"177\" fill=\"#4e5495\">FP32/INT8<\/text>\n     <rect x=\"792\" y=\"90\" width=\"126\" height=\"120\" rx=\"16\" fill=\"#d5f2f0\"/><text x=\"855\" y=\"144\" fill=\"#2b726a\">RPi 5<\/text><text x=\"855\" y=\"177\" fill=\"#2b726a\">실측<\/text><\/g>\n     <g stroke=\"#6296c7\" stroke-width=\"4\" marker-end=\"url(#eaar)\"><path d=\"M163 150H188M359 150H383M607 150H633M765 150H790\"/><\/g>\n     <\/svg><\/div><table class=\"content-table\"><thead><tr><th>모델<\/th><th>선택 이유<\/th><th>반드시 확인할 항목<\/th><\/tr><\/thead><tbody><tr><td class=\"ed\">ResNet-18<\/td><td class=\"ed\">잔차 연결의 기본 비교군<\/td><td class=\"ed\">정확도·학습 안정성<\/td><\/tr><tr><td class=\"ed\">DenseNet-121<\/td><td class=\"ed\">특징 재사용 구조의 실습 모델<\/td><td class=\"ed\">정확도·피크 메모리<\/td><\/tr><tr><td class=\"ed\">MobileNetV2<\/td><td class=\"ed\">모바일 경량화 모델<\/td><td class=\"ed\">지연시간·파일 크기<\/td><\/tr><tr><td class=\"ed\">EfficientNet-B0<\/td><td class=\"ed\">정확도와 효율의 절충<\/td><td class=\"ed\">정확도·연산자 지원<\/td><\/tr><\/tbody><\/table><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision 모델표<\/a> · <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">RPS 블로그<\/a><\/div><div class=\"ed foot-note\">모델별 입력 크기를 통일할 때 사전학습 가중치의 원래 권장 해상도를 바꾸는 영향도 별도 기록해야 합니다.<\/div><\/div><div class=\"foot-number\">25 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"10 · EXPERIMENT"},{"name":"실험 결과 기록표: 비어 있어야 정확합니다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">10 · EXPERIMENT<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">실험 결과 기록표: 비어 있어야 정확합니다<\/h1><p class=\"ed slide-lead\">실제 측정 전에는 RPS 정확도·FPS를 임의로 채우지 않습니다.<\/p><\/div>\n      <div class=\"main\"><table class=\"content-table\"><thead><tr><th>모델<\/th><th>RPS Acc<\/th><th>Macro F1<\/th><th>FP32 ms<\/th><th>INT8 ms<\/th><th>파일 MB<\/th><th>피크 RAM<\/th><\/tr><\/thead><tbody><tr><td class=\"ed\">ResNet-18<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><\/tr><tr><td class=\"ed\">DenseNet-121<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><\/tr><tr><td class=\"ed\">MobileNetV2<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><\/tr><tr><td class=\"ed\">EfficientNet-B0<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><td class=\"ed\">측정 전<\/td><\/tr><\/tbody><\/table><div class=\"annotation ed\">실측 환경: Raspberry Pi 5 모델/메모리 · OS · Python/TFLite 버전 · XNNPACK/스레드 수 · 입력 크기 · 워밍업 · 반복 횟수 기록<\/div><div class=\"takeaway blue\"><span class=\"take-label\">분석 포인트<\/span><span class=\"ed take-text\">정확도 차이가 작으면 지연시간·메모리·발열이 모델 선택을 결정할 수 있습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">실험 동기: RPS 블로그<\/a> · <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision 평가 기준<\/a><\/div><div class=\"ed foot-note\">“측정 전” 셀은 HTML 편집 모드에서 실제 결과로 교체하세요. 이 표는 결과가 아닌 실험 기록 양식입니다.<\/div><\/div><div class=\"foot-number\">26 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"10 · EXPERIMENT"},{"name":"결정 프레임워크: 모델 선택은 우선순위의 문제","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">10 · EXPERIMENT<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">결정 프레임워크: 모델 선택은 우선순위의 문제<\/h1><p class=\"ed slide-lead\">연구·교육·배포에서 필요한 모델이 다를 수 있습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">LEARNING<\/div><h3 class=\"ed card-title\">연구 목적<\/h3><p class=\"ed card-desc\">설계 원리를 비교·분석하려면 ResNet/DenseNet처럼 차이가 분명한 모델을 사용합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">DEPLOYMENT<\/div><h3 class=\"ed card-title\">제품 PoC<\/h3><p class=\"ed card-desc\">빠른 작동과 변환 성공률이 중요하면 MobileNet 계열을 먼저 검증합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">ACCURACY<\/div><h3 class=\"ed card-title\">정확도 우선<\/h3><p class=\"ed card-desc\">충분한 자원이 있으면 EfficientNet·ConvNeXt·ViT도 비교합니다.<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">판단 기준<\/span><span class=\"ed take-text\">Raspberry Pi 5 데모는 MobileNetV2를 기본 비교군으로, DenseNet-121은 특징 재사용의 의미를 설명하는 비교군으로 권장합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1608.06993\" target=\"_blank\" rel=\"noreferrer\">DenseNet<\/a> · <a href=\"https://arxiv.org/abs/1801.04381\" target=\"_blank\" rel=\"noreferrer\">MobileNetV2<\/a> · <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision<\/a><\/div><div class=\"ed foot-note\">이는 실습의 초기 비교 우선순위 제안이지, RPS 과제에서 MobileNetV2가 반드시 최고 성능이라는 주장도 아닙니다.<\/div><\/div><div class=\"foot-number\">27 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"10 · EXPERIMENT"},{"name":"전체 복습: 모델 이름보다 “해결한 문제”","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">11 · REVIEW<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">전체 복습: 모델 이름보다 “해결한 문제”<\/h1><p class=\"ed slide-lead\">각 세대 모델의 설계 목적을 한 문장으로 말할 수 있다면 이해한 것입니다.<\/p><\/div>\n      <div class=\"main\"><table class=\"content-table\"><thead><tr><th>모델<\/th><th>핵심 문제<\/th><th>설계 아이디어<\/th><\/tr><\/thead><tbody><tr><td class=\"ed\">LeNet<\/td><td class=\"ed\">이미지 자동 인식<\/td><td class=\"ed\">지역 필터·가중치 공유<\/td><\/tr><tr><td class=\"ed\">AlexNet<\/td><td class=\"ed\">대규모 비전 분류 성능<\/td><td class=\"ed\">GPU·ReLU·Dropout<\/td><\/tr><tr><td class=\"ed\">VGG / Inception<\/td><td class=\"ed\">깊이와 연산 효율<\/td><td class=\"ed\">작은 필터 반복 / 병렬 경로<\/td><\/tr><tr><td class=\"ed\">ResNet<\/td><td class=\"ed\">깊은 모델 최적화<\/td><td class=\"ed\">Residual Add<\/td><\/tr><tr><td class=\"ed\">DenseNet<\/td><td class=\"ed\">특징 재사용·전달<\/td><td class=\"ed\">Dense Concat<\/td><\/tr><tr><td class=\"ed\">MobileNet<\/td><td class=\"ed\">엣지 연산량·지연시간<\/td><td class=\"ed\">Depthwise·하드웨어 최적화<\/td><\/tr><tr><td class=\"ed\">EfficientNet<\/td><td class=\"ed\">정확도 대비 비용<\/td><td class=\"ed\">Depth/Width/Resolution 균형<\/td><\/tr><tr><td class=\"ed\">ViT / ConvNeXt<\/td><td class=\"ed\">표현력과 현대적 설계<\/td><td class=\"ed\">Attention / 현대화된 CNN<\/td><\/tr><\/tbody><\/table><div class=\"takeaway blue\"><span class=\"take-label\">핵심 질문<\/span><span class=\"ed take-text\">비교 모델의 목적과 측정 지표를 동시에 말할 수 있어야 실험 결과를 올바르게 판단할 수 있습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1608.06993\" target=\"_blank\" rel=\"noreferrer\">관련 원 논문 모음<\/a> · <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision<\/a><\/div><div class=\"ed foot-note\">원 모델의 공헌을 이해하기 위한 요약표입니다. 실제 최신 정확도 순위나 모든 모델 계보를 뜻하지는 않습니다.<\/div><\/div><div class=\"foot-number\">28 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"11 · REVIEW"},{"name":"토론: 어느 모델을 Raspberry Pi 5에 배포할까?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">11 · REVIEW<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">토론: 어느 모델을 Raspberry Pi 5에 배포할까?<\/h1><p class=\"ed slide-lead\">다음 세 가지 상황에서 무엇을 먼저 확인해야 하는지 판단해 봅시다.<\/p><\/div>\n      <div class=\"main\"><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">정확도 vs FPS<\/div><h3 class=\"ed card-title\">상황 A<\/h3><p class=\"ed card-desc\">DenseNet-121이 RPS 정확도는 0.5%p 높지만 처리속도는 절반입니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">정수 연산자 지원<\/div><h3 class=\"ed card-title\">상황 B<\/h3><p class=\"ed card-desc\">MobileNetV2 INT8은 모델 크기가 작지만 실제 장치에서 FP32보다 느립니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">도메인 이동<\/div><h3 class=\"ed card-title\">상황 C<\/h3><p class=\"ed card-desc\">학습용 테스트셋 정확도는 99%지만 다른 카메라·조명에서 오류가 많습니다.<\/p><\/div><\/div><div class=\"discussion ed\">학생 질문: 정확도를 몇 %p 희생하면 FPS 2배 증가를 선택할 수 있을까요? 그 근거를 설계 요구사항으로 설명해 보세요.<\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">RPS 블로그<\/a> · <a href=\"https://arxiv.org/abs/2404.10518\" target=\"_blank\" rel=\"noreferrer\">MobileNetV4<\/a><\/div><div class=\"ed foot-note\">A/B/C는 토론용 가상 시나리오입니다. 실제 측정 결과가 아니므로 그래프·논문 수치로 인용하면 안 됩니다.<\/div><\/div><div class=\"foot-number\">29 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"11 · REVIEW"},{"name":"결론: 어떤 비전 AI가 좋은 모델인가?","html":"<div class=\"page-inner dark\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">11 · CONCLUSION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">결론: 어떤 비전 AI가 좋은 모델인가?<\/h1><p class=\"ed slide-lead\">분류 · 탐지 · 표현 학습 · 하드웨어의 네 가지 질문을 모두 판단해야 합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"closing\"><div class=\"closing-track\"><span>AlexNet<\/span><b>→<\/b><span>DenseNet<\/span><b>→<\/b><span>MobileNet<\/span><b>→<\/b><span>YOLO<\/span><b>→<\/b><span>ViT·DINO<\/span><\/div><div class=\"closing-quote ed\">“가장 뛰어난 모델은 벤치마크 1등이 아니라, 데이터를 이해하고 목표 하드웨어에서 원하는 문제를 해결하는 모델이다.”<\/div><div class=\"closing-next ed\">다음 실행: RPS 분류 실험을 유지하되, YOLO 결함 탐지와 DINO 특징 재사용 실험을 추가하여 Accuracy–mAP–Latency–Memory를 분리 평가합니다.<\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">YOLO26<\/a> · <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3<\/a> · <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">RPS 강의<\/a><\/div><div class=\"ed foot-note\">기술 선택에 관한 강의 요약입니다. 각 태스크의 평가 지표를 섞지 않고 목표 하드웨어에서 재검증하세요.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"11 · CONCLUSION"},{"name":"YOLO 원 논문과 공식 자료","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">APPENDIX · SOURCES<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">YOLO 원 논문과 공식 자료<\/h1><p class=\"ed slide-lead\">최초 YOLO의 목적, 이후 실전 개발, 2026년 성능표를 분리해 확인합니다.<\/p><\/div>\n      <div class=\"main\"><table class=\"content-table\"><thead><tr><th>연도<\/th><th>논문·기관<\/th><th>필요한 읽기<\/th><\/tr><\/thead><tbody><tr><td class=\"ed\">2016<\/td><td class=\"ed\">You Only Look Once · Redmon 외<\/td><td class=\"ed\">단일 네트워크 탐지, 속도·위치 오차<\/td><\/tr><tr><td class=\"ed\">2018<\/td><td class=\"ed\">YOLOv3 · Redmon·Farhadi<\/td><td class=\"ed\">다중 스케일 예측과 Detector 구조<\/td><\/tr><tr><td class=\"ed\">2020–24<\/td><td class=\"ed\">YOLOv5/v8/11 · Ultralytics<\/td><td class=\"ed\">학습·배포 툴체인 발전<\/td><\/tr><tr><td class=\"ed\">2026<\/td><td class=\"ed\">YOLO26 · Ultralytics<\/td><td class=\"ed\">선택적 NMS-free, DFL-free, 성능표<\/td><\/tr><\/tbody><\/table><div class=\"takeaway blue\"><span class=\"take-label\">자료 활용<\/span><span class=\"ed take-text\">강의 각주에서 공식 문서를 열어 버전별 주장과 벤치마크 측정 조건을 확인하세요.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://openaccess.thecvf.com/content_cvpr_2016/html/Redmon_You_Only_Look_CVPR_2016_paper.html\" target=\"_blank\" rel=\"noreferrer\">CVPR 2016<\/a> · <a href=\"https://arxiv.org/abs/1804.02767\" target=\"_blank\" rel=\"noreferrer\">YOLOv3<\/a> · <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">YOLO26 공식 자료<\/a><\/div><div class=\"ed foot-note\">mAP 그래프와 latency 그래프는 YOLO26 공식 성능표의 640px COCO·T4 TensorRT10 측정값만 사용했습니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"APPENDIX · SOURCES"},{"name":"ViT·DINO 원 논문과 구현","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">APPENDIX · SOURCES<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">ViT·DINO 원 논문과 구현<\/h1><p class=\"ed slide-lead\">아키텍처(ViT)와 학습 전략(DINO)의 출처를 분리해 참고합니다.<\/p><\/div>\n      <div class=\"main\"><table class=\"content-table\"><thead><tr><th>연도<\/th><th>원 논문<\/th><th>한 줄 의미<\/th><\/tr><\/thead><tbody><tr><td class=\"ed\">2020/2021<\/td><td class=\"ed\">ViT · Dosovitskiy 외<\/td><td class=\"ed\">패치 시퀀스로 이미지 분류<\/td><\/tr><tr><td class=\"ed\">2021<\/td><td class=\"ed\">DINO · Caron 외<\/td><td class=\"ed\">라벨 없는 Teacher–Student 학습<\/td><\/tr><tr><td class=\"ed\">2023<\/td><td class=\"ed\">DINOv2 · Oquab 외<\/td><td class=\"ed\">대규모 범용 이미지 특징<\/td><\/tr><tr><td class=\"ed\">2025<\/td><td class=\"ed\">DINOv3 · Siméoni 외<\/td><td class=\"ed\">고품질 Dense Feature·Gram Anchoring<\/td><\/tr><\/tbody><\/table><div class=\"takeaway blue\"><span class=\"take-label\">실습 우선순위<\/span><span class=\"ed take-text\">DINOv2/3는 라이선스·실행 자원을 확인한 뒤 먼저 GPU 환경에서 특징을 추출하는 방식으로 시도하세요.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://research.google/pubs/an-image-is-worth-16x16-words-transformers-for-image-recognition-at-scale/\" target=\"_blank\" rel=\"noreferrer\">ViT<\/a> · <a href=\"https://arxiv.org/abs/2104.14294\" target=\"_blank\" rel=\"noreferrer\">DINO 2021<\/a> · <a href=\"https://arxiv.org/abs/2304.07193\" target=\"_blank\" rel=\"noreferrer\">DINOv2<\/a> · <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3<\/a><\/div><div class=\"ed foot-note\">공개 논문 기준. 2026년의 새로운 DINO 모델이라고 단정할 자료는 추가하지 않았습니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"APPENDIX · SOURCES"},{"name":"참고 문헌과 데이터 출처","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">APPENDIX · SOURCES<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading small\">참고 문헌과 데이터 출처<\/h1><p class=\"ed slide-lead\">각 슬라이드 하단 출처를 클릭하면 원 논문 또는 공식 성능표로 이동합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"refs-grid\"><div class=\"ref-col\"><div class=\"ref-line\"><b>1998 · LeNet-5<\/b><a href=\"http://yann.lecun.com/exdb/publis/pdf/lecun-98.pdf\" target=\"_blank\">http://yann.lecun.com/exdb/publis/pdf/lecun-98.pdf<\/a><\/div><div class=\"ref-line\"><b>2012 · AlexNet<\/b><a href=\"https://proceedings.neurips.cc/paper_files/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html\" target=\"_blank\">https://proceedings.neurips.cc/paper_files/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html<\/a><\/div><div class=\"ref-line\"><b>2014 · VGG<\/b><a href=\"https://arxiv.org/abs/1409.1556\" t /philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html<\/a><\/div><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">공식 모델 성능표<\/a> · <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">RPS 블로그<\/a><\/div><div class=\"ed foot-note\">원 논문 발표연도와 학회 게재연도 구분. CNN 분류 그래프는 TorchVision 공개 가중치 기준, YOLO26 mAP·지연시간 그래프는 Ultralytics 공식 측정표 기준입니다.<\/div><\/div><div class=\"foot-number\">31 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"APPENDIX · SOURCES"}],"models":[{"name":"AlexNet","year":2012,"acc":56.522,"params":61.1,"gflops":0.71},{"name":"GoogLeNet","year":2014,"acc":69.778,"params":6.6,"gflops":1.5},{"name":"VGG16","year":2014,"acc":71.592,"params":138.4,"gflops":15.47},{"name":"ResNet50","year":2015,"acc":76.13,"params":25.6,"gflops":4.09},{"name":"DenseNet121","year":2017,"acc":74.434,"params":8.0,"gflops":2.83},{"name":"MobileNetV2","year":2018,"acc":71.878,"params":3.5,"gflops":0.3},{"name":"EfficientNet-B0","year":2019,"acc":77.692,"params":5.3,"gflops":0.39},{"name":"ViT-B/16","year":2020,"acc":81.072,"params":86.6,"gflops":17.56},{"name":"ConvNeXt-T","year":2022,"acc":82.52,"params":28.6,"gflops":4.46}],"yoloModels":[{"name":"YOLO26n","map":40.1,"map_std":40.9,"latency":1.7,"params":2.4},{"name":"YOLO26s","map":47.8,"map_std":48.6,"latency":2.5,"params":9.5},{"name":"YOLO26m","map":52.5,"map_std":53.1,"latency":4.7,"params":20.4},{"name":"YOLO26l","map":54.4,"map_std":55.0,"latency":6.2,"params":24.8},{"name":"YOLO26x","map":56.9,"map_std":57.5,"latency":11.8,"params":55.7}],"deckTitle":"CNN에서 비전 파운데이션 모델까지 | 김임환 교수 · 삼성전자 DS교수실"}</script>

<div class="overlay hidden" id="overlay"><div class="modal"><div class="modalhead"><h2 id="modalTitle">편집</h2><button class="modalbtn" id="modalClose">닫기</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot" id="modalFooter"><button class="modalbtn" id="modalCancel">취소</button><button class="modalbtn primary" id="modalApply">적용</button></div></div></div>
<div class="topnotice" id="toast"></div><div class="printdeck" id="printDeck"></div>
<script>
(()=>{'use strict';
const state=JSON.parse(document.getElementById('deckState').textContent);
let cur=0,editing=false,dirty=false,undos=[],modalAction=null,editNodes=[];
const $=id=>document.getElementById(id);
const toSafe=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function notify(msg){const t=$('toast');t.textContent=msg;t.classList.add('visible');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('visible'),2200)}
function snapshot(){undos.push(JSON.stringify(state));if(undos.length>25)undos.shift();$('undoBtn').disabled=false;dirty=true}
function syncCurrent(){const node=$('page').querySelector('.page-inner');if(!node)return;state.slides[cur].html=node.outerHTML;const h=node.querySelector('.slide-heading');if(h)state.slides[cur].name=h.textContent.trim()}
function fixNums(root){root.querySelectorAll('.total-n').forEach(x=>x.textContent=String(state.slides.length).padStart(2,'0'));root.querySelectorAll('.foot-number').forEach((x)=>{x.firstChild.textContent=String(cur+1).padStart(2,'0')+' '})}
function sizePage(){const shell=$('shell'),f=$('scaledFrame');if(!shell||!f)return;const availableW=Math.max(290,shell.clientWidth-42),availableH=Math.max(180,shell.clientHeight-36);const scale=Math.min(availableW/1440,availableH/810,1.15);f.style.width=(1440*scale)+'px';f.style.height=(810*scale)+'px';$('pageFrame').style.transform='scale('+scale+')';}
function drawThumbnails(){const thumbs=$('thumbs');thumbs.innerHTML=state.slides.map((s,i)=>`<div class="thumb ${i===cur?'active':''}" data-i="${i}"><div class="thumbnum">${String(i+1).padStart(2,'0')}</div><div><div class="thumbsection">${toSafe(s.section||'슬라이드')}</div><div class="thumbtext">${toSafe(s.name||'새 슬라이드')}</div></div></div>`).join('');thumbs.querySelectorAll('.thumb').forEach(t=>t.addEventListener('click',()=>gotoSlide(+t.dataset.i)))}
function render(){const slide=state.slides[cur];$('page').innerHTML=slide.html;const root=$('page');root.classList.toggle('editing',editing);root.querySelectorAll('.ed').forEach(el=>{el.contentEditable=editing?'true':'false';el.spellcheck=false});root.querySelectorAll('.ed').forEach(el=>el.addEventListener('input',()=>{dirty=true;state.slides[cur].name=root.querySelector('.slide-heading')?.textContent.trim()||slide.name}));fixNums(root);paintCharts(root);$('pagecount').textContent=String(cur+1).padStart(2,'0')+' / '+String(state.slides.length).padStart(2,'0');$('progressbar').style.width=((cur+1)/state.slides.length*100)+'%';$('prevBtn').disabled=cur===0;$('bottomPrev').disabled=cur===0;$('nextBtn').disabled=cur===state.slides.length-1;$('bottomNext').disabled=cur===state.slides.length-1;$('upBtn').disabled=cur===0;$('downBtn').disabled=cur===state.slides.length-1;$('removeBtn').disabled=state.slides.length<=1;drawThumbnails();sizePage();}
function gotoSlide(i){if(i<0||i>=state.slides.length||i===cur)return;syncCurrent();cur=i;render()}
function addSlide(){syncCurrent();snapshot();const i=cur+1;let s=JSON.parse(JSON.stringify(state.slides[cur]));s.name='새 슬라이드';s.section='NEW · CUSTOM';s.html=s.html.replace(/<h1 class="ed slide-heading[^>]*>.*?<\/h1>/s,'<h1 class="ed slide-heading">새 슬라이드</h1>').replace(/<p class="ed slide-lead">.*?<\/p>/s,'<p class="ed slide-lead">여기에 부제를 입력하세요.</p>');state.slides.splice(i,0,s);cur=i;render();notify('새 슬라이드를 추가했습니다. 편집 모드를 켜서 수정하세요.')}
function duplicate(){syncCurrent();snapshot();const s=JSON.parse(JSON.stringify(state.slides[cur]));s.name+=' (복제)';state.slides.splice(cur+1,0,s);cur++;render();notify('복제했습니다.')}
function remove(){if(state.slides.length<=1)return;if(!confirm('현재 슬라이드를 삭제할까요? HTML 저장 전까지 실행 취소할 수 있습니다.'))return;syncCurrent();snapshot();state.slides.splice(cur,1);cur=Math.max(0,Math.min(cur,state.slides.length-1));render();notify('슬라이드를 삭제했습니다.')}
function move(delta){const t=cur+delta;if(t<0||t>=state.slides.length)return;syncCurrent();snapshot();[state.slides[t],state.slides[cur]]=[state.slides[cur],state.slides[t]];cur=t;render()}
function undo(){if(!undos.length)return;const previous=JSON.parse(undos.pop());state.slides=previous.slides;state.models=previous.models;state.yoloModels=previous.yoloModels||state.yoloModels;cur=Math.max(0,Math.min(cur,state.slides.length-1));$('undoBtn').disabled=undos.length===0;render();notify('실행을 취소했습니다.')}
function setEditing(next){if(editing===next)return;syncCurrent();if(next)snapshot();editing=next;$('editModeBtn').textContent=editing?'직접 수정 켜짐':'직접 수정 켜기';$('editModeBtn').classList.toggle('active',editing);render();if(editing)notify('슬라이드의 제목·문장·각주를 눌러 수정하세요.')}
function openModal(title,html,callback){modalAction=callback;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('overlay').classList.remove('hidden')}
function closeModal(){$('overlay').classList.add('hidden');modalAction=null;editNodes=[]}
function openTextEditor(){syncCurrent();const els=[...$('page').querySelectorAll('.ed')];editNodes=els;const labels=els.map((el,i)=>{let context=el.closest('.foot-note')?'각주':el.matches('h1')?'슬라이드 제목':el.matches('.slide-lead')?'부제':el.matches('.take-text')?'핵심 메시지':el.matches('td')?'표의 셀':el.matches('.card-title')?'카드 제목':el.matches('p')?'설명문':el.matches('.foot-note')?'각주':'텍스트';return `<div class="editrow"><label>${String(i+1).padStart(2,'0')} · ${context}</label><textarea data-text-i="${i}" rows="${Math.max(2,Math.min(5,Math.ceil((el.textContent||'').length/53)))}">${toSafe(el.textContent)}</textarea></div>`}).join('');openModal('현재 슬라이드 텍스트 편집',`<div class="modalhint">직접 수정을 지원하지 않는 모바일 브라우저에서도 편집할 수 있습니다. 적용하면 표·각주의 문장도 변경됩니다. 수식/HTML 모양은 직접 수정 모드를 사용하세요.</div>${labels}`,()=>{snapshot();editNodes.forEach((el,i)=>{const field=$('modalBody').querySelector(`[data-text-i="${i}"]`);if(field)el.textContent=field.value});syncCurrent();render();notify('현재 페이지 텍스트를 적용했습니다.')});}
function openChartEditor(){if(state.slides[cur].html.includes('data-chart="yolo_'))return openYoloChartEditor();syncCurrent();const d=state.models;let rows=d.map((m,i)=>`<div class="chartrow"><input aria-label="모델" data-key="name" data-row="${i}" value="${toSafe(m.name)}"><input aria-label="Top-1 정확도" type="number" step=".001" data-key="acc" data-row="${i}" value="${m.acc}"><input aria-label="파라미터" type="number" step=".01" data-key="params" data-row="${i}" value="${m.params}"><input aria-label="GFLOPs" type="number" step=".01" data-key="gflops" data-row="${i}" value="${m.gflops}"><span style="color:#90a9bc;font-size:13px">${m.year}</span></div>`).join('');openModal('그래프 데이터 편집',`<div class="modalhint">이 수치는 정확도, 파라미터, 연산량 그래프 3개를 동시에 갱신합니다. 학습·측정 근거가 있을 때만 변경하세요.</div><div class="chartrow header"><span>모델명</span><span>Top-1 (%)</span><span>Params (M)</span><span>GFLOPs</span><span>연도</span></div>${rows}`,()=>{snapshot();const nd=state.models.map((m,i)=>{let out={...m};for(const k of ['name','acc','params','gflops']){const v=$('modalBody').querySelector(`[data-row="${i}"][data-key="${k}"]`)?.value;out[k]=k==='name'?v:Number(v)}return out});if(nd.some(x=>!x.name||![x.acc,x.params,x.gflops].every(Number.isFinite)||x.acc<0||x.acc>100||x.params<=0||x.gflops<=0)){alert('정확도 0~100%, Params/GFLOPs 양수만 입력하세요.');return false}state.models=nd;render();notify('그래프 데이터를 갱신했습니다.');return true})}

function yoloBar(key){const data=state.yoloModels,w=1200,h=335,left=230,right=155,top=12,bottom=24,usable=w-left-right,row=(h-top-bottom)/data.length;const isMap=key==='map',max=isMap?65:14,unit=isMap?'%':' ms';let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="YOLO26 5개 모델의 ${isMap?'COCO mAP (e2e)':'T4 지연시간'} 비교">`;s+=`<rect x="${left}" y="4" width="${usable}" height="${h-6}" rx="9" fill="#f6f9fc"/>`;for(let i=0;i<=5;i++){const x=left+i*usable/5;s+=`<line x1="${x}" y1="6" x2="${x}" y2="${h-15}" stroke="#dce8ef"/><text x="${x}" y="${h-4}" font-size="15" fill="#7b94a8" text-anchor="middle">${(i*max/5).toFixed(isMap?0:1)}</text>`}data.forEach((d,i)=>{let y=top+i*row,width=Math.max(5,d[key]/max*(usable-9)),color=i===0?'#178c7b':'#4287b9';s+=`<text x="${left-24}" y="${y+row*.68}" text-anchor="end" font-size="25" font-weight="800" fill="#285274">${escXml(d.name)}</text><rect x="${left}" y="${y+row*.2}" width="${width}" height="${row*.62}" rx="9" fill="${color}"/><text x="${left+width+12}" y="${y+row*.66}" font-size="23" font-weight="900" fill="#2a5372">${d[key].toFixed(1)}${unit}</text>`});return s+'</svg>'}
function openYoloChartEditor(){syncCurrent();const d=state.yoloModels;let rows=d.map((m,i)=>`<div class="chartrow"><input aria-label="모델" data-key="name" data-row="${i}" value="${toSafe(m.name)}"><input aria-label="mAP e2e" type="number" step=".1" data-key="map" data-row="${i}" value="${m.map}"><input aria-label="T4 ms" type="number" step=".1" data-key="latency" data-row="${i}" value="${m.latency}"><input aria-label="파라미터 M" type="number" step=".1" data-key="params" data-row="${i}" value="${m.params}"><span style="color:#6b8599">640px</span></div>`).join('');openModal('YOLO26 벤치마크 그래프 수정',`<div class="modalhint">COCO mAP(e2e) / NVIDIA T4 TensorRT10 지연시간 / 파라미터 수입니다. 수정 후 원 출처와 측정 조건을 반드시 확인하세요.</div><div class="chartrow header"><span>모델</span><span>mAP(e2e)</span><span>지연시간 (ms)</span><span>Params (M)</span><span>입력</span></div>${rows}`,()=>{snapshot();const newData=state.yoloModels.map((m,i)=>{const out={...m};for(const k of ['name','map','latency','params']){const raw=$('modalBody').querySelector(`[data-row="${i}"][data-key="${k}"]`)?.value;out[k]=k==='name'?raw:Number(raw)}return out});if(newData.some(m=>!m.name||![m.map,m.latency,m.params].every(Number.isFinite)||m.map<0||m.map>100||m.latency<=0||m.params<=0)){alert('mAP는 0~100, ms·Params는 양수여야 합니다.');return false}state.yoloModels=newData;render();notify('YOLO 그래프 수치를 저장했습니다.');return true})}

function saveHtml(){syncCurrent();const tag=$('deckState');const old=tag.textContent;tag.textContent=JSON.stringify(state).replace(/<\//g,'<\\/');const content='<!doctype html>\n'+document.documentElement.outerHTML;tag.textContent=old;dirty=false;const blob=new Blob([content],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Vision_AI_Evolution_YOLO_ViT_DINO_Editable.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);notify('현재 수정 내용이 포함된 HTML을 저장했습니다.')}
function printAll(){syncCurrent();const box=$('printDeck');box.innerHTML='';state.slides.forEach((s,i)=>{const wrap=document.createElement('section');wrap.className='printslide';wrap.innerHTML='<div class="slide-page">'+s.html+'</div>';wrap.querySelectorAll('.total-n').forEach(e=>e.textContent=String(state.slides.length).padStart(2,'0'));const n=wrap.querySelector('.foot-number');if(n)n.firstChild.textContent=String(i+1).padStart(2,'0')+' ';wrap.querySelectorAll('.ed').forEach(el=>el.removeAttribute('contenteditable'));paintCharts(wrap);box.appendChild(wrap)});void box.offsetHeight;window.print()}
function escXml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
const pal=['#3d83b6','#46a39c','#9f7db9','#e2a659','#357eaf','#138e77','#83a758','#6778a9','#4a89a5'];
function gridSvg(w,h){let s=`<line x1="75" y1="${h-43}" x2="${w-25}" y2="${h-43}" stroke="#9bb4c8" stroke-width="2"/>`;for(let i=0;i<=4;i++){let y=30+(h-76)*i/4;s+=`<line x1="75" y1="${y}" x2="${w-25}" y2="${y}" stroke="#e1eaf1" stroke-width="1"/>`}return s}
function barChart(key,unit){const data=state.models,w=1220,h=355,left=181,right=126,top=14,bottom=13,row=(h-top-bottom)/data.length;let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="모델별 ${key==='acc'?'정확도':'파라미터 수'} 비교">`;let max=key==='acc'?100:150,base=key==='acc'?0:0;
 const usable=w-left-right;s+=`<rect x="${left}" y="6" width="${usable}" height="${h-13}" fill="#f6faff" rx="6"/>`;
 for(let i=0;i<=5;i++){let x=left+i*usable/5;s+=`<line x1="${x}" x2="${x}" y1="10" y2="${h-8}" stroke="#d9e7f2" stroke-width="1"/><text x="${x}" y="${h-2}" text-anchor="middle" font-size="15" fill="#8095a8">${i*max/5}${unit}</text>`}
 data.forEach((d,i)=>{let y=top+i*row;let wid=Math.max(4,(d[key]-base)/(max-base)*(usable-12));let color=d.name.includes('DenseNet')?'#15947b':d.name.includes('MobileNet')?'#d39945':pal[i%pal.length];s+=`<text x="${left-15}" y="${y+row*.69}" text-anchor="end" font-size="19" fill="#315374" font-weight="700">${escXml(d.name)}</text><rect x="${left+1}" y="${y+row*.2}" width="${wid}" height="${row*.65}" rx="7" fill="${color}"/><text x="${left+wid+12}" y="${y+row*.68}" font-size="17" font-weight="800" fill="#284866">${Number(d[key].toFixed(key==='acc'?2:1))}${unit}</text>`});return s+'</svg>'}
function scatterChart(){const data=state.models,w=1170,h=347,l=111,r=70,t=22,b=57,min=.1,max=30,minY=50,maxY=90;const X=v=>l+(Math.log10(v)-Math.log10(min))/(Math.log10(max)-Math.log10(min))*(w-l-r);const Y=v=>t+(maxY-v)/(maxY-minY)*(h-t-b);let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="모델의 GFLOPs 대비 정확도 산점도">`;
 [50,60,70,80,90].forEach(a=>{const y=Y(a);s+=`<line x1="${l}" y1="${y}" x2="${w-r}" y2="${y}" stroke="#e0eaf2"/><text x="${l-18}" y="${y+6}" text-anchor="end" font-size="18" fill="#6f879b">${a}%</text>`});[.1,.3,1,3,10,30].forEach(v=>{let x=X(v);s+=`<line x1="${x}" y1="${t}" x2="${x}" y2="${h-b}" stroke="#e4edf3"/><text x="${x}" y="${h-b+25}" text-anchor="middle" font-size="16" fill="#7a8ea1">${v}</text>`});s+=`<text x="${w/2}" y="${h-6}" font-size="18" font-weight="800" text-anchor="middle" fill="#45677f">GFLOPs (로그축)</text>`;
 data.forEach((d,i)=>{const x=X(d.gflops),y=Y(d.acc),color=d.name.includes('DenseNet')?'#178d7c':d.name.includes('MobileNet')?'#d4984d':pal[i%pal.length];s+=`<circle cx="${x}" cy="${y}" r="9" fill="${color}" stroke="#fff" stroke-width="3"/><title>${escXml(d.name)}: ${d.acc}% / ${d.gflops}G</title>`;const dx=(d.name==='EfficientNet-B0'||d.name==='MobileNetV2')?16:12;const dy=d.name==='ResNet50'?26:-13;s+=`<text x="${x+dx}" y="${y+dy}" font-size="16" font-weight="700" fill="#345572">${escXml(d.name)}</text>`});return s+'</svg>'}
function paintCharts(root){root.querySelectorAll('.chart-mount').forEach(el=>{const type=el.dataset.chart;el.innerHTML=type==='accuracy'?barChart('acc','%'):type==='parameters'?barChart('params','M'):type==='yolo_map'?yoloBar('map'):type==='yolo_latency'?yoloBar('latency'):scatterChart()})}
function wire(){for(const [id,fn] of [['prevBtn',()=>gotoSlide(cur-1)],['nextBtn',()=>gotoSlide(cur+1)],['bottomPrev',()=>gotoSlide(cur-1)],['bottomNext',()=>gotoSlide(cur+1)],['editModeBtn',()=>setEditing(!editing)],['editTextBtn',openTextEditor],['editChartBtn',openChartEditor],['addBtn',addSlide],['duplicateBtn',duplicate],['removeBtn',remove],['upBtn',()=>move(-1)],['downBtn',()=>move(1)],['undoBtn',undo],['saveBtn',saveHtml],['printBtn',printAll],['toggleSide',()=>{$('side').classList.toggle('hidden');sizePage()}],['fullBtn',()=>{if(!document.fullscreenElement)$('app').requestFullscreen?.();else document.exitFullscreen?.()}]])$(id).addEventListener('click',fn);
 $('undoBtn').disabled=true;$('modalClose').onclick=closeModal;$('modalCancel').onclick=closeModal;$('modalApply').onclick=()=>{if(modalAction){const result=modalAction();if(result!==false)closeModal()}};
 $('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});
 document.addEventListener('keydown',e=>{const isTyping=e.target.closest?.('input,textarea,[contenteditable=true]');if(e.key==='Escape'){$('overlay').classList.add('hidden');return}if(isTyping||!$('overlay').classList.contains('hidden')||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();gotoSlide(cur+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();gotoSlide(cur-1)}if(e.key==='e'||e.key==='E'){setEditing(!editing)}});
 window.addEventListener('resize',sizePage);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
 window.addEventListener('afterprint',()=>{$('printDeck').innerHTML=''})
 }
wire();render();window.__CNN_DECK_TEST__={getSlideCount:()=>state.slides.length,getCurrent:()=>cur,save:saveHtml,print:printAll,go:gotoSlide};
})();
</script></body></html>
