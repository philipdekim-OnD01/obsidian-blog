<script type="application/json" id="deckState">{"slides":[{"name":"CNN에서 비전 파운데이션 모델까지","html":"<div class=\"page-inner dark\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">01 · INTRO<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">CNN에서 비전 파운데이션 모델까지<\/h1><p class=\"ed slide-lead\">AlexNet · DenseNet · YOLO · ViT · DINO의 진화<\/p><\/div>\n      <div class=\"main\"><div class=\"cover-grid\"><div class=\"cover-copy\"><div class=\"overline\">VISION AI EVOLUTION · 1998–2026<\/div><div class=\"cover-claim ed\">이미지를 분류하던 CNN에서<br>위치를 찾는 YOLO,<br>스스로 특징을 배우는 DINO까지<\/div><div class=\"cover-sub ed\">김임환 교수<br>삼성전자 DS교수실<\/div><div class=\"cover-chips\"><span class=\"pill light\">CNN 구조<\/span><span class=\"pill light\">실시간 객체 탐지<\/span><span class=\"pill light\">자기지도학습<\/span><\/div><\/div><div class=\"cover-art\"><svg class=\"art\" viewBox=\"0 0 520 410\" role=\"img\" aria-label=\"분류, 객체 탐지, 시각 특징 학습 세 흐름을 나타낸 표지 도식\">\n    <g font-family=\"Arial,sans-serif\" font-size=\"25\" font-weight=\"800\" fill=\"#eefaff\">\n      <rect x=\"14\" y=\"10\" width=\"492\" height=\"118\" rx=\"20\" fill=\"#32769a\" stroke=\"#75bada\" stroke-width=\"2\"/>\n      <rect x=\"32\" y=\"32\" width=\"100\" height=\"78\" rx=\"10\" fill=\"#a7d4eb\"/><path d=\"M48 91l38-43 30 43z\" fill=\"#4284ac\"/><circle cx=\"112\" cy=\"49\" r=\"11\" fill=\"#f5bc84\"/>\n      <text x=\"158\" y=\"61\">01 · 분류<\/text><text x=\"158\" y=\"101\" font-size=\"22\">DenseNet · 무엇인가?<\/text>\n      <rect x=\"14\" y=\"145\" width=\"492\" height=\"118\" rx=\"20\" fill=\"#246b6d\" stroke=\"#74c5b4\" stroke-width=\"2\"/>\n      <rect x=\"32\" y=\"167\" width=\"100\" height=\"78\" rx=\"10\" fill=\"#99cebf\"/><rect x=\"53\" y=\"183\" width=\"56\" height=\"43\" fill=\"none\" stroke=\"#fa9c75\" stroke-width=\"6\" rx=\"4\"/>\n      <text x=\"158\" y=\"196\">02 · 탐지<\/text><text x=\"158\" y=\"236\" font-size=\"22\">YOLO · 어디에 있는가?<\/text>\n      <rect x=\"14\" y=\"280\" width=\"492\" height=\"118\" rx=\"20\" fill=\"#575c98\" stroke=\"#b1b2ec\" stroke-width=\"2\"/>\n      <g transform=\"translate(43 304)\" fill=\"#b5b8f2\"><rect width=\"30\" height=\"30\" rx=\"4\"/><rect x=\"36\" width=\"30\" height=\"30\" rx=\"4\"/><rect x=\"72\" width=\"30\" height=\"30\" rx=\"4\"/><rect y=\"36\" width=\"30\" height=\"30\" rx=\"4\"/><rect x=\"36\" y=\"36\" width=\"30\" height=\"30\" rx=\"4\" fill=\"#e5d0fa\"/><rect x=\"72\" y=\"36\" width=\"30\" height=\"30\" rx=\"4\"/><\/g>\n      <text x=\"158\" y=\"329\">03 · 표현 학습<\/text><text x=\"158\" y=\"369\" font-size=\"22\">ViT·DINO · 어떻게 배울까?<\/text>\n    <\/g><\/svg><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://openaccess.thecvf.com/content_cvpr_2016/html/Redmon_You_Only_Look_CVPR_2016_paper.html\" target=\"_blank\" rel=\"noreferrer\">YOLO 원 논문<\/a> · <a href=\"https://research.google/pubs/an-image-is-worth-16x16-words-transformers-for-image-recognition-at-scale/\" target=\"_blank\" rel=\"noreferrer\">ViT<\/a> · <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3<\/a><\/div><div class=\"ed foot-note\">강의 구성: 분류(ImageNet Top-1) · 탐지(COCO mAP) · 자기지도 표현학습을 서로 다른 평가 목표로 구분합니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"01 · INTRO"},{"name":"오늘 강의에서 반드시 이해할 4가지","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">01 · INTRO<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">오늘 반드시 이해할 네 가지 설계 문제<\/h1><p class=\"ed slide-lead\">모델 이름보다 “이전 모델의 어떤 문제를 해결했는가?”를 기억하세요.<\/p><\/div>\n      <div class=\"main\"><div class=\"four-grid\"><div class=\"info-card \"><div class=\"card-top\">정확도<\/div><h3 class=\"ed card-title\">왜 깊어졌을까?<\/h3><p class=\"ed card-desc\">AlexNet과 VGG는 더 풍부한 이미지 특징을 얻고자 했습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">최적화<\/div><h3 class=\"ed card-title\">왜 연결했을까?<\/h3><p class=\"ed card-desc\">ResNet과 DenseNet은 깊은 네트워크의 학습과 특징 전달을 개선했습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">효율<\/div><h3 class=\"ed card-title\">왜 가벼워졌을까?<\/h3><p class=\"ed card-desc\">MobileNet과 EfficientNet은 제한된 연산·메모리를 고려했습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">엣지<\/div><h3 class=\"ed card-title\">왜 하드웨어가 중요한가?<\/h3><p class=\"ed card-desc\">INT8·모델 연산자·메모리·실측 지연시간이 배포 가능성을 좌우합니다.<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">수업의 질문<\/span><span class=\"ed take-text\">CNN은 분류, YOLO는 실시간 탐지, DINO는 라벨 없는 특징 학습을 통해 서로 다른 문제를 해결합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1608.06993\" target=\"_blank\" rel=\"noreferrer\">원 논문<\/a> · <a href=\"https://arxiv.org/abs/1704.04861\" target=\"_blank\" rel=\"noreferrer\">MobileNet<\/a> · <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision<\/a><\/div><div class=\"ed foot-note\">“높은 ImageNet 정확도”와 “라즈베리파이 실시간 추론 성능”은 같은 지표가 아닙니다.<\/div><\/div><div class=\"foot-number\">02 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"01 · INTRO"},{"name":"CNN은 이미지를 어떻게 이해하는가?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">01 · INTRO<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">CNN은 이미지를 어떻게 이해하는가?<\/h1><p class=\"ed slide-lead\">복잡한 사진을 작은 특징에서 큰 의미로 단계적으로 바꾸는 방식입니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"wide-visual\"><svg class=\"art\" viewBox=\"0 0 760 345\" role=\"img\" aria-label=\"이미지에서 합성곱, 특징맵, 분류를 거치는 CNN 구조\">\n    <defs><linearGradient id=\"imG\" x1=\"0\" x2=\"1\" y1=\"0\" y2=\"1\"><stop stop-color=\"#56a4ea\"/><stop offset=\"1\" stop-color=\"#b7d8ff\"/><\/linearGradient><\/defs>\n    <rect x=\"20\" y=\"50\" width=\"145\" height=\"215\" rx=\"18\" fill=\"url(#imG)\"/>\n    <path d=\"M57 199 L94 115 L133 198Z\" fill=\"#0b416f\" opacity=\".74\"/><circle cx=\"115\" cy=\"98\" r=\"18\" fill=\"#ffe1ad\"/>\n    <g fill=\"none\" stroke=\"#e8f4ff\" opacity=\".55\" stroke-width=\"1.5\"><path d=\"M55 50v215M92 50v215M129 50v215M20 93h145M20 136h145M20 179h145M20 222h145\"/><\/g>\n    <g stroke=\"#3b71a0\" stroke-width=\"2.8\" fill=\"none\"><path d=\"M181 155h64\"/><path d=\"M237 147l11 8-11 8\"/><\/g>\n    <g transform=\"translate(277 70)\"><rect width=\"135\" height=\"155\" rx=\"16\" fill=\"#e3f4ee\" stroke=\"#9bcdb9\"/>\n    <g stroke=\"#6eab8e\" opacity=\".8\"><path d=\"M34 0v155M68 0v155M102 0v155M0 38h135M0 77h135M0 116h135\"/><\/g><path d=\"M20 50l94 62M32 130l66-95\" stroke=\"#15765a\" stroke-width=\"8\"/><\/g>\n    <path d=\"M428 155h58m-10-8 11 8-11 8\" stroke=\"#3b71a0\" stroke-width=\"3\" fill=\"none\"/>\n    <g transform=\"translate(510 85)\"><rect x=\"0\" y=\"0\" width=\"54\" height=\"120\" rx=\"9\" fill=\"#cde7fa\"/><rect x=\"15\" y=\"-12\" width=\"54\" height=\"120\" rx=\"9\" fill=\"#a7d1f1\" stroke=\"white\"/><rect x=\"30\" y=\"-24\" width=\"54\" height=\"120\" rx=\"9\" fill=\"#81b8e8\" stroke=\"white\"/><\/g>\n    <path d=\"M612 155h48m-10-8 11 8-11 8\" stroke=\"#3b71a0\" stroke-width=\"3\" fill=\"none\"/>\n    <g transform=\"translate(682 72)\"><rect x=\"0\" y=\"0\" width=\"62\" height=\"154\" rx=\"14\" fill=\"#edf0ff\"/><rect x=\"12\" y=\"16\" width=\"38\" height=\"20\" rx=\"4\" fill=\"#b9bce9\"/><rect x=\"12\" y=\"54\" width=\"38\" height=\"20\" rx=\"4\" fill=\"#5d71d2\"/><rect x=\"12\" y=\"92\" width=\"38\" height=\"20\" rx=\"4\" fill=\"#c9caeb\"/><\/g>\n    <g font-size=\"20\" font-weight=\"700\" fill=\"#263c58\" text-anchor=\"middle\"><text x=\"93\" y=\"304\">입력 이미지<\/text><text x=\"343\" y=\"304\">합성곱 필터<\/text><text x=\"560\" y=\"304\">특징맵<\/text><text x=\"713\" y=\"304\">분류<\/text><\/g><\/svg><\/div><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">LOW LEVEL<\/div><h3 class=\"ed card-title\">낮은 층<\/h3><p class=\"ed card-desc\">선·모서리·방향과 같은 단순한 패턴을 추출합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">MID LEVEL<\/div><h3 class=\"ed card-title\">중간 층<\/h3><p class=\"ed card-desc\">질감·부분 형태·패턴 조합을 학습합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">HIGH LEVEL<\/div><h3 class=\"ed card-title\">높은 층<\/h3><p class=\"ed card-desc\">객체를 구별할 수 있는 의미 있는 표현을 만듭니다.<\/p><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"http://yann.lecun.com/exdb/publis/pdf/lecun-98.pdf\" target=\"_blank\" rel=\"noreferrer\">LeNet-5<\/a> · <a href=\"https://proceedings.neurips.cc/paper_files/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html\" target=\"_blank\" rel=\"noreferrer\">AlexNet<\/a><\/div><div class=\"ed foot-note\">단순화한 개념도입니다. 실제 CNN의 층 구성과 특징맵 의미는 모델·학습 데이터에 따라 달라집니다.<\/div><\/div><div class=\"foot-number\">03 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"01 · INTRO"},{"name":"모델 변천사: 핵심은 다섯 번의 전환","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">01 · INTRO<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">모델 변천사: 핵심은 다섯 번의 전환<\/h1><p class=\"ed slide-lead\">연도별로 정확도를 높인 전략이 어떻게 바뀌었는지 봅니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"timeline\">\n <div class=\"era\"><span class=\"yr\">1998<\/span><strong class=\"ed\">LeNet<\/strong><em class=\"ed\">CNN 기본 형태<\/em><\/div>\n <div class=\"era\"><span class=\"yr\">2012–14<\/span><strong class=\"ed\">AlexNet / VGG<\/strong><em class=\"ed\">GPU·깊이·특징<\/em><\/div>\n <div class=\"era\"><span class=\"yr\">2015–17<\/span><strong class=\"ed\">ResNet / DenseNet<\/strong><em class=\"ed\">학습 안정성과 특징 재사용<\/em><\/div>\n <div class=\"era\"><span class=\"yr\">2017–19<\/span><strong class=\"ed\">MobileNet / EfficientNet<\/strong><em class=\"ed\">저전력·적은 연산<\/em><\/div>\n <div class=\"era\"><span class=\"yr\">2020–24<\/span><strong class=\"ed\">ViT / ConvNeXt / MNv4<\/strong><em class=\"ed\">주의 메커니즘·하드웨어 최적화<\/em><\/div>\n <\/div><div class=\"takeaway blue\"><span class=\"take-label\">진화의 방향<\/span><span class=\"ed take-text\">더 깊은 모델을 만드는 단계에서, 필요한 특징만 효율적으로 계산하고 배포하는 단계로 발전했습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1512.03385\" target=\"_blank\" rel=\"noreferrer\">관련 원 논문<\/a> · <a href=\"https://arxiv.org/abs/1608.06993\" target=\"_blank\" rel=\"noreferrer\">DenseNet<\/a> · <a href=\"https://arxiv.org/abs/2404.10518\" target=\"_blank\" rel=\"noreferrer\">MobileNetV4<\/a><\/div><div class=\"ed foot-note\">모델의 공개연도와 학회 출판 연도가 다를 수 있습니다. DenseNet은 2016년 공개·CVPR 2017 발표입니다.<\/div><\/div><div class=\"foot-number\">04 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"01 · INTRO"},{"name":"비전 AI는 세 갈래로 발전했습니다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">01 · INTRO<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">비전 AI는 세 갈래로 발전했습니다<\/h1><p class=\"ed slide-lead\">모델을 비교하기 전에 “무엇을 출력하고, 어떻게 학습하는가?”부터 구별합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"wide-visual\"><svg class=\"art\" viewBox=\"0 0 1160 318\" role=\"img\" aria-label=\"분류와 객체 탐지, 자기지도 비전 표현 세 경로를 비교하는 도식\">\n    <defs><marker id=\"triArrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8\" fill=\"#6895b6\"/><\/marker><\/defs>\n    <g font-size=\"23\" font-weight=\"800\" text-anchor=\"middle\"><rect x=\"12\" y=\"32\" width=\"220\" height=\"250\" rx=\"20\" fill=\"#e0edf9\"/><text x=\"122\" y=\"65\" fill=\"#215a88\">입력 이미지<\/text>\n    <rect x=\"43\" y=\"93\" width=\"160\" height=\"154\" rx=\"10\" fill=\"#acd1eb\"/><rect x=\"75\" y=\"125\" width=\"77\" height=\"82\" rx=\"8\" fill=\"#6198bb\"/><path d=\"M99 130l38 57\" stroke=\"#fff1d8\" stroke-width=\"12\"/><circle cx=\"152\" cy=\"125\" r=\"13\" fill=\"#f9b88a\"/><\/g>\n    <g stroke=\"#6497be\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#triArrow)\"><path d=\"M240 154H290\"/><path d=\"M240 154H290\"/><\/g>\n    <g font-size=\"21\" font-weight=\"800\" text-anchor=\"middle\"><rect x=\"290\" y=\"20\" width=\"260\" height=\"268\" rx=\"20\" fill=\"#eff7fc\" stroke=\"#bbd8e8\"/><text x=\"420\" y=\"57\" fill=\"#2b628a\">분류 · DenseNet<\/text><rect x=\"342\" y=\"105\" width=\"154\" height=\"90\" rx=\"13\" fill=\"#c3e0f4\"/><text x=\"420\" y=\"151\" fill=\"#1c5a87\">Defect<\/text><text x=\"420\" y=\"180\" font-size=\"16\" fill=\"#5b88aa\">확률 0.93<\/text><text x=\"420\" y=\"249\" font-size=\"17\" fill=\"#47738c\">무엇인가?<\/text>\n    <rect x=\"570\" y=\"20\" width=\"260\" height=\"268\" rx=\"20\" fill=\"#e9f7f3\" stroke=\"#a7dfcf\"/><text x=\"700\" y=\"57\" fill=\"#267e6b\">탐지 · YOLO<\/text><rect x=\"623\" y=\"98\" width=\"154\" height=\"112\" rx=\"9\" fill=\"#b2ddd5\"/><rect x=\"657\" y=\"120\" width=\"70\" height=\"60\" rx=\"4\" fill=\"none\" stroke=\"#ed754f\" stroke-width=\"5\"/><text x=\"700\" y=\"249\" font-size=\"17\" fill=\"#47756d\">무엇이 어디에?<\/text>\n    <rect x=\"850\" y=\"20\" width=\"295\" height=\"268\" rx=\"20\" fill=\"#f1edf9\" stroke=\"#d2c7e7\"/><text x=\"997\" y=\"57\" fill=\"#755c9f\">표현 학습 · DINO<\/text><\/g>\n    <g transform=\"translate(916 92)\"><rect width=\"164\" height=\"120\" rx=\"10\" fill=\"#dfd5f4\"/><g stroke=\"#fff\" stroke-width=\"2\"><path d=\"M41 0v120M82 0v120M123 0v120M0 30h164M0 60h164M0 90h164\"/><\/g><g fill=\"#9f80ce\"><rect x=\"42\" y=\"31\" width=\"40\" height=\"29\"/><rect x=\"83\" y=\"61\" width=\"40\" height=\"29\"/><rect x=\"124\" y=\"31\" width=\"39\" height=\"29\"/><\/g><\/g>\n    <text x=\"997\" y=\"249\" font-size=\"17\" text-anchor=\"middle\" fill=\"#736594\">범용 특징을 배우는가?<\/text><\/svg><\/div><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">WHAT<\/div><h3 class=\"ed card-title\">분류 · DenseNet<\/h3><p class=\"ed card-desc\">이미지 전체가 무엇인지 확률로 예측합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">WHAT + WHERE<\/div><h3 class=\"ed card-title\">탐지 · YOLO<\/h3><p class=\"ed card-desc\">물체가 무엇이며 어디에 있는지 박스 좌표로 예측합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">HOW TO LEARN<\/div><h3 class=\"ed card-title\">표현 · DINO<\/h3><p class=\"ed card-desc\">사람이 정답을 붙이지 않은 이미지에서도 재사용 가능한 특징을 학습합니다.<\/p><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1608.06993\" target=\"_blank\" rel=\"noreferrer\">DenseNet<\/a> · <a href=\"https://openaccess.thecvf.com/content_cvpr_2016/html/Redmon_You_Only_Look_CVPR_2016_paper.html\" target=\"_blank\" rel=\"noreferrer\">YOLO<\/a> · <a href=\"https://arxiv.org/abs/2104.14294\" target=\"_blank\" rel=\"noreferrer\">DINO<\/a><\/div><div class=\"ed foot-note\">분류·탐지는 과제(Task), DINO는 학습 방법·사전학습 모델 계열입니다. ViT는 주로 백본 구조입니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"01 · INTRO"},{"name":"LeNet-5 (1998): CNN의 출발점","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">02 · ORIGINS<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">LeNet-5 (1998): CNN의 출발점<\/h1><p class=\"ed slide-lead\">누가: Yann LeCun 연구팀 / 왜: 손글씨 숫자 같은 이미지를 자동 인식하기 위해<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"big-number\">1998<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">국소 수용장, 가중치 공유, 서브샘플링이라는 CNN 설계 요소 정립<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">이미지 전체를 연결하는 대신 작은 영역의 패턴을 반복해서 학습<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">우편번호·문서 인식처럼 명확한 영상 문제를 풀기 위해 등장<\/div><\/div><\/div><div class=\"panel diagram-panel\"><div class=\"architecture\"><span>입력<\/span><b>→<\/b><span>C1<\/span><b>→<\/b><span>S2<\/span><b>→<\/b><span>C3<\/span><b>→<\/b><span>S4<\/span><b>→<\/b><span>출력<\/span><\/div><div class=\"stack-bars\"><i style=\"height:150px\"><\/i><i style=\"height:115px\"><\/i><i style=\"height:130px\"><\/i><i style=\"height:88px\"><\/i><i style=\"height:100px\"><\/i><i style=\"height:64px\"><\/i><\/div><div class=\"diagram-caption ed\">초기 CNN: 합성곱과 다운샘플링을 반복<\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">핵심<\/span><span class=\"ed take-text\">CNN의 기본 발상은 이미지를 처음부터 통째로 외우는 것이 아니라, 지역적인 패턴을 학습하는 것입니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"http://yann.lecun.com/exdb/publis/pdf/lecun-98.pdf\" target=\"_blank\" rel=\"noreferrer\">LeCun et al., 1998<\/a><\/div><div class=\"ed foot-note\">1998년 LeNet-5 논문 중심. 이 슬라이드의 구조 그림은 교육용 단순화 도식입니다.<\/div><\/div><div class=\"foot-number\">05 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"02 · ORIGINS"},{"name":"AlexNet (2012): 딥러닝의 전환점","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">02 · ORIGINS<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">AlexNet (2012): 딥러닝의 전환점<\/h1><p class=\"ed slide-lead\">누가: Alex Krizhevsky·Ilya Sutskever·Geoffrey Hinton / 왜: 대규모 이미지 분류 성능을 획기적으로 높이기 위해<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">2012 · ImageNet<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">대규모 학습 데이터와 GPU 연산을 결합<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">ReLU 활성함수·Dropout·데이터 증강 활용<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">깊은 CNN이 기존 영상 분류 접근보다 매우 강력함을 보여줌<\/div><\/div><\/div><div class=\"panel\"><div class=\"metric\"><strong class=\"ed\">56.52%<\/strong><span class=\"ed\">TorchVision AlexNet Top-1<\/span><small class=\"ed\">ImageNet-1K / 공개 가중치 V1<\/small><\/div><div class=\"tiny-visual\"><div class=\"flowline\"><div class=\"path-box \">GPU<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">합성곱<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">ReLU<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">분류<\/div><\/div><\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">혁신<\/span><span class=\"ed take-text\">모델 구조뿐 아니라 GPU·데이터·학습 기법이 함께 발전해야 성능이 도약합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://proceedings.neurips.cc/paper_files/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html\" target=\"_blank\" rel=\"noreferrer\">Krizhevsky et al., 2012<\/a> · <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision<\/a><\/div><div class=\"ed foot-note\">56.52%는 TorchVision 공개 가중치의 단일 크롭 Top-1 정확도이며, 2012년 대회 Top-5 오류율과 다른 지표입니다.<\/div><\/div><div class=\"foot-number\">06 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"02 · ORIGINS"},{"name":"VGG vs GoogLeNet (2014): 두 갈래의 발전","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">02 · ORIGINS<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">VGG vs GoogLeNet (2014): 두 갈래의 발전<\/h1><p class=\"ed slide-lead\">더 깊게 쌓을 것인가? 더 효율적인 여러 경로를 설계할 것인가?<\/p><\/div>\n      <div class=\"main\"><div class=\"versus\"><div class=\"versus-left\"><div class=\"versus-year\">2014 · VGG16<\/div><h3 class=\"ed \">작은 3×3 필터를 여러 층 반복<\/h3><p class=\"ed muted\">Karen Simonyan · Andrew Zisserman<\/p><div class=\"vgg-blocks\"><span style=\"height:60px\"><\/span><span style=\"height:72px\"><\/span><span style=\"height:84px\"><\/span><span style=\"height:98px\"><\/span><span style=\"height:112px\"><\/span><span style=\"height:125px\"><\/span><span style=\"height:137px\"><\/span><\/div><div class=\"metric\"><strong class=\"ed\">138.4M<\/strong><span class=\"ed\">파라미터<\/span><small class=\"ed\">정확도 71.59%<\/small><\/div><\/div><div class=\"vs-badge\">VS<\/div><div class=\"versus-right\"><div class=\"versus-year\">2014 · GoogLeNet<\/div><h3 class=\"ed \">서로 다른 크기의 필터를 병렬 사용<\/h3><p class=\"ed muted\">Christian Szegedy 외<\/p><div class=\"inception-branches\"><span>1×1<\/span><span>3×3<\/span><span>5×5<\/span><span>Pooling<\/span><\/div><div class=\"metric\"><strong class=\"ed\">6.6M<\/strong><span class=\"ed\">파라미터<\/span><small class=\"ed\">정확도 69.78%<\/small><\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">비교<\/span><span class=\"ed take-text\">VGG는 구조가 직관적이지만 매개변수가 많고, GoogLeNet은 다양한 경로를 활용해 효율을 추구했습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1409.1556\" target=\"_blank\" rel=\"noreferrer\">VGG 원 논문<\/a> · <a href=\"https://arxiv.org/abs/1409.4842\" target=\"_blank\" rel=\"noreferrer\">GoogLeNet 원 논문<\/a> · <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision<\/a><\/div><div class=\"ed foot-note\">수치는 각각 TorchVision V1 가중치 기준. 원 논문 대회 결과와 비교 지표·전처리가 다를 수 있습니다.<\/div><\/div><div class=\"foot-number\">07 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"02 · ORIGINS"},{"name":"깊어질수록 왜 학습이 어려워졌을까?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">03 · CONNECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">깊어질수록 왜 학습이 어려워졌을까?<\/h1><p class=\"ed slide-lead\">문제는 단순히 층의 수가 아니라 오차가 전달되는 방식이었습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div class=\"gradient-story\"><h3 class=\"ed \">깊은 신경망의 난제<\/h3><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">기울기 소실: 역전파 신호가 앞쪽 층까지 충분히 전달되지 않을 수 있음<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">Degradation: 더 깊은 모델이 오히려 학습 오류가 커지는 최적화 문제<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">해결 방향: 출력까지 가는 짧은 경로를 추가해 학습을 쉽게 만들기<\/div><\/div><\/div><div class=\"panel question-panel\"><div class=\"big-question\">?<\/div><div class=\"ed\">층만 더 쌓으면 항상 정확도가 높아질까?<\/div><div class=\"answer-tag ed\">아니오. 연결 방식도 중요합니다.<\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">다음 혁신<\/span><span class=\"ed take-text\">이 문제에 대한 대표적인 구조적 해답이 ResNet(잔차 연결)과 DenseNet(밀집 연결)입니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1512.03385\" target=\"_blank\" rel=\"noreferrer\">He et al., ResNet<\/a> · <a href=\"https://arxiv.org/abs/1608.06993\" target=\"_blank\" rel=\"noreferrer\">Huang et al., DenseNet<\/a><\/div><div class=\"ed foot-note\">기울기 소실과 degradation은 관련 있지만 동일한 현상이 아닙니다. ResNet 원 논문은 degradation 최적화 문제도 강조합니다.<\/div><\/div><div class=\"foot-number\">08 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"03 · CONNECTION"},{"name":"ResNet (2015): 우회 연결로 길을 만들다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">03 · CONNECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">ResNet (2015): 우회 연결로 길을 만들다<\/h1><p class=\"ed slide-lead\">누가: Kaiming He·Xiangyu Zhang·Shaoqing Ren·Jian Sun / 왜: 매우 깊은 CNN을 안정적으로 학습하기 위해<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">2015 · Residual Learning<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">이전 입력을 몇 개 층을 건너 뛰어 직접 전달<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">모델은 전체 출력보다 변환해야 할 차이 F(x)를 학습<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">더 깊은 네트워크의 최적화를 가능하게 한 핵심 구조<\/div><\/div><div class=\"equation\">y = F(x) + x<\/div><\/div><div class=\"panel diagram-panel\"><svg class=\"art\" viewBox=\"0 0 670 380\" role=\"img\" aria-label=\"ResNet 잔차 연결도\">\n    <defs><marker id=\"rarr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0L8,4L0,8\" fill=\"#2666b2\"/><\/marker><\/defs>\n    <g stroke=\"#2666b2\" stroke-width=\"5\" fill=\"none\" marker-end=\"url(#rarr)\"><path d=\"M112 190H192\"/><path d=\"M320 190H391\"/><path d=\"M477 190H555\"/><path d=\"M132 190V58H430V149\"/><\/g>\n    <rect x=\"30\" y=\"145\" width=\"120\" height=\"86\" rx=\"16\" fill=\"#d9ecfc\" stroke=\"#75a9d8\"/><text x=\"90\" y=\"198\" text-anchor=\"middle\" font-size=\"32\" font-weight=\"700\" fill=\"#134477\">x<\/text>\n    <rect x=\"190\" y=\"136\" width=\"145\" height=\"102\" rx=\"16\" fill=\"#d8f1e5\" stroke=\"#70b59a\"/><text x=\"262\" y=\"183\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"700\" fill=\"#14654f\">가중치 층<\/text><text x=\"262\" y=\"215\" text-anchor=\"middle\" font-size=\"21\" fill=\"#14654f\">F(x)<\/text>\n    <circle cx=\"432\" cy=\"190\" r=\"46\" fill=\"#fce2be\" stroke=\"#dea35c\" stroke-width=\"3\"/><text x=\"432\" y=\"205\" text-anchor=\"middle\" font-size=\"49\" fill=\"#895718\">+<\/text>\n    <rect x=\"553\" y=\"145\" width=\"94\" height=\"86\" rx=\"16\" fill=\"#e8e7ff\" stroke=\"#8f93d1\"/><text x=\"600\" y=\"199\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"700\" fill=\"#4645a5\">y<\/text>\n    <text x=\"281\" y=\"43\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\" fill=\"#2666b2\">우회 연결: 입력 x 보존<\/text>\n    <text x=\"333\" y=\"320\" text-anchor=\"middle\" font-size=\"29\" font-weight=\"700\" fill=\"#263c58\">y = F(x) + x<\/text>\n    <\/svg><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">쉽게 이해하기<\/span><span class=\"ed take-text\">매 단계에서 처음부터 새로 만들지 않고, 원래 정보에 바뀐 부분만 더합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1512.03385\" target=\"_blank\" rel=\"noreferrer\">Deep Residual Learning, 2015<\/a><\/div><div class=\"ed foot-note\">수식은 입력과 출력 차원이 같은 기본 잔차 블록입니다. 차원이 다를 때는 투영 연결 등 변형을 사용합니다.<\/div><\/div><div class=\"foot-number\">09 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"03 · CONNECTION"},{"name":"DenseNet (2016–17): 이전 지식을 모두 재사용","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">03 · CONNECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">DenseNet (2016–17): 이전 지식을 모두 재사용<\/h1><p class=\"ed slide-lead\">누가: Gao Huang·Zhuang Liu·Laurens van der Maaten·Kilian Q. Weinberger<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">2016 공개 · CVPR 2017<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">모든 층이 앞선 모든 층의 특징맵을 받도록 연결<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">이미 발견한 특징을 뒤쪽에서 다시 활용할 수 있게 설계<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">기울기 전달 개선·특징 재사용·매개변수 효율을 목표<\/div><\/div><\/div><div class=\"panel diagram-panel\"><svg class=\"art\" viewBox=\"0 0 850 360\" role=\"img\" aria-label=\"DenseNet 이전의 모든 층으로부터 특징맵을 받는 연결\"><path d=\"M141 160 Q 162 70 181 160\" stroke=\"#69a9d6\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><path d=\"M141 160 Q 239 101 336 160\" stroke=\"#69a9d6\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><path d=\"M288 160 Q 312 70 336 160\" stroke=\"#4d9c8f\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><path d=\"M141 160 Q 316 132 491 160\" stroke=\"#69a9d6\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><path d=\"M288 160 Q 390 101 491 160\" stroke=\"#4d9c8f\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><path d=\"M443 160 Q 468 70 491 160\" stroke=\"#7d88ca\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><path d=\"M141 160 Q 394 163 646 160\" stroke=\"#69a9d6\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><path d=\"M288 160 Q 468 132 646 160\" stroke=\"#4d9c8f\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><path d=\"M443 160 Q 545 101 646 160\" stroke=\"#7d88ca\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><path d=\"M598 160 Q 622 70 646 160\" stroke=\"#dbab6a\" stroke-width=\"3\" fill=\"none\" opacity=\".77\"/><rect x=\"35\" y=\"128\" width=\"106\" height=\"94\" rx=\"14\" fill=\"#dceefd\" stroke=\"#7aa4ba\" stroke-width=\"2\"/><text x=\"88\" y=\"183\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#284662\">입력<\/text><rect x=\"182\" y=\"128\" width=\"106\" height=\"94\" rx=\"14\" fill=\"#dff2e7\" stroke=\"#7aa4ba\" stroke-width=\"2\"/><text x=\"235\" y=\"183\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#284662\">층 1<\/text><rect x=\"337\" y=\"128\" width=\"106\" height=\"94\" rx=\"14\" fill=\"#dff2e7\" stroke=\"#7aa4ba\" stroke-width=\"2\"/><text x=\"390\" y=\"183\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#284662\">층 2<\/text><rect x=\"492\" y=\"128\" width=\"106\" height=\"94\" rx=\"14\" fill=\"#dff2e7\" stroke=\"#7aa4ba\" stroke-width=\"2\"/><text x=\"545\" y=\"183\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#284662\">층 3<\/text><rect x=\"647\" y=\"128\" width=\"106\" height=\"94\" rx=\"14\" fill=\"#dff2e7\" stroke=\"#7aa4ba\" stroke-width=\"2\"/><text x=\"700\" y=\"183\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#284662\">층 4<\/text><text x=\"425\" y=\"277\" text-anchor=\"middle\" font-size=\"24\" fill=\"#273d58\">각 층은 이전 모든 층의 특징을 받아서 사용<\/text><text x=\"425\" y=\"319\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"700\" fill=\"#167b65\">추가(add)가 아니라 연결(concatenate)<\/text><\/svg><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">DenseNet의 핵심<\/span><span class=\"ed take-text\">ResNet은 이전 정보를 더하고, DenseNet은 이전 특징들을 연결해 보존합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1608.06993\" target=\"_blank\" rel=\"noreferrer\">Huang et al., DenseNet<\/a><\/div><div class=\"ed foot-note\">DenseNet은 각 층이 앞선 모든 층과 feed-forward로 연결되며 특징맵을 채널 방향으로 concatenate합니다.<\/div><\/div><div class=\"foot-number\">10 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"03 · CONNECTION"},{"name":"DenseNet의 연결을 1장으로 이해하기","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">03 · CONNECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">DenseNet의 연결을 1장으로 이해하기<\/h1><p class=\"ed slide-lead\">ResNet과 DenseNet은 둘 다 지름길을 만들었지만, 정보를 합치는 방식이 다릅니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"two-panels\"><div class=\"panel comparison-box\"><div class=\"comparison-head\">ResNet<\/div><div class=\"equation large\">y = F(x) + x<\/div><div class=\"glyph\">+<\/div><p class=\"ed \">Add: 같은 위치의 특징 값을 더함<\/p><p class=\"ed small-muted\">목표: 깊은 학습을 쉽게<\/p><\/div><div class=\"panel comparison-box\"><div class=\"comparison-head green\">DenseNet<\/div><div class=\"equation large\">xₗ = Hₗ([x₀, …, xₗ₋₁])<\/div><div class=\"glyph green\">[ · ]<\/div><p class=\"ed \">Concat: 채널 방향으로 특징을 이어 붙임<\/p><p class=\"ed small-muted\">목표: 특징 전달 및 재사용<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">중요<\/span><span class=\"ed take-text\">DenseNet의 큰 장점은 “정확도가 무조건 최고”가 아니라 “이전 특징을 효율적으로 활용하는 설계”입니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1512.03385\" target=\"_blank\" rel=\"noreferrer\">ResNet<\/a> · <a href=\"https://arxiv.org/abs/1608.06993\" target=\"_blank\" rel=\"noreferrer\">DenseNet<\/a><\/div><div class=\"ed foot-note\">수식의 Hₗ은 합성곱 등을 포함한 변환입니다. 그림은 두 연결 연산의 차이만 강조합니다.<\/div><\/div><div class=\"foot-number\">11 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"03 · CONNECTION"},{"name":"DenseNet-121의 내부 구조","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">03 · CONNECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">DenseNet-121의 내부 구조<\/h1><p class=\"ed slide-lead\">DenseNet-121은 여러 Dense Block을 쌓고 중간에 Transition Layer를 둡니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"densenet-blocks\"><div class=\"stage first\"><span>Stem<\/span><b>Conv + Pool<\/b><\/div><div class=\"stage\"><small>Dense Block 1<\/small><strong>6<\/strong><span>layers<\/span><\/div><div class=\"transition\">전이층<\/div><div class=\"stage\"><small>Dense Block 2<\/small><strong>12<\/strong><span>layers<\/span><\/div><div class=\"transition\">전이층<\/div><div class=\"stage highlight\"><small>Dense Block 3<\/small><strong>24<\/strong><span>layers<\/span><\/div><div class=\"transition\">전이층<\/div><div class=\"stage\"><small>Dense Block 4<\/small><strong>16<\/strong><span>layers<\/span><\/div><\/div><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">채널 증가<\/div><h3 class=\"ed card-title\">Growth Rate<\/h3><p class=\"ed card-desc\">각 층이 새롭게 추가하는 특징맵의 채널 수를 제어합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">압축<\/div><h3 class=\"ed card-title\">Transition Layer<\/h3><p class=\"ed card-desc\">블록 사이에서 특징맵의 크기·채널 수를 줄입니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">교육 모델<\/div><h3 class=\"ed card-title\">DenseNet-121<\/h3><p class=\"ed card-desc\">대략 800만 개 파라미터로 특징 재사용 구조를 보여 줍니다.<\/p><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1608.06993\" target=\"_blank\" rel=\"noreferrer\">DenseNet 원 논문<\/a> · <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision<\/a><\/div><div class=\"ed foot-note\">6·12·24·16은 4개 Dense Block의 반복 구성입니다. 모델 이름 121을 이 합계로 단순 해석하면 안 됩니다.<\/div><\/div><div class=\"foot-number\">12 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"03 · CONNECTION"},{"name":"정확도는 얼마나 발전했을까?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">04 · EVIDENCE<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">정확도는 얼마나 발전했을까?<\/h1><p class=\"ed slide-lead\">ImageNet-1K에서 공개 가중치별 Top-1 정확도를 비교합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"viz-block\"><div class=\"viz-title\">대표 CNN / ViT 계열 성능 (%)<\/div><div class=\"chart-mount\" data-chart=\"accuracy\"><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">읽는 법<\/span><span class=\"ed take-text\">DenseNet-121(74.43%)은 ResNet-50 V1(76.13%)보다 정확도가 낮지만 파라미터 수도 훨씬 적습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision 분류 모델표<\/a><\/div><div class=\"ed foot-note\">모두 TorchVision IMAGENET1K_V1 단일 크롭 결과. 학습 레시피가 다르므로 순수 아키텍처 성능 순위로 단정하면 안 됩니다.<\/div><\/div><div class=\"foot-number\">13 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"04 · EVIDENCE"},{"name":"모델 크기는 어떻게 바뀌었을까?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">04 · EVIDENCE<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">모델 크기는 어떻게 바뀌었을까?<\/h1><p class=\"ed slide-lead\">파라미터 개수는 모델 가중치 저장 공간에 영향을 줍니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"viz-block\"><div class=\"viz-title\">대표 모델 파라미터 수 (백만 개, M)<\/div><div class=\"chart-mount\" data-chart=\"parameters\"><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">핵심 비교<\/span><span class=\"ed take-text\">ResNet-50 V1(25.6M) → DenseNet-121(8.0M): 매개변수는 약 69% 적지만, 추론 속도까지 빠르다고 단정할 수 없습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision 모델표<\/a><\/div><div class=\"ed foot-note\">파라미터 수 ≠ 실제 런타임 메모리 ≠ FPS. 중간 특징맵·메모리 복사·지원 연산자·하드웨어에 따라 달라집니다.<\/div><\/div><div class=\"foot-number\">14 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"04 · EVIDENCE"},{"name":"정확도와 연산량의 교환관계","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">04 · EVIDENCE<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">정확도와 연산량의 교환관계<\/h1><p class=\"ed slide-lead\">낮은 GFLOPs이면서 높은 정확도를 얻는 모델이 효율적으로 보일 수 있습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"viz-block\"><div class=\"viz-title\">가로: GFLOPs (로그 눈금) · 세로: Top-1 정확도 (%)<\/div><div class=\"chart-mount\" data-chart=\"scatter\"><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">주의<\/span><span class=\"ed take-text\">GFLOPs는 연산량의 근사 지표입니다. Raspberry Pi 5의 실제 지연시간이나 전력소비를 직접 뜻하지 않습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision 모델표<\/a><\/div><div class=\"ed foot-note\">모델별 입력 이미지 크기·전처리·연산자 최적화가 다릅니다. 이 그림은 실측 FPS가 아닌 공개 명세값 시각화입니다.<\/div><\/div><div class=\"foot-number\">15 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"04 · EVIDENCE"},{"name":"수치를 해석할 때 생기는 3가지 함정","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">04 · EVIDENCE<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">수치를 해석할 때 생기는 3가지 함정<\/h1><p class=\"ed slide-lead\">같은 이름의 모델이라도 가중치 버전과 측정 조건이 달라지면 결과가 달라집니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">학습 레시피<\/div><h3 class=\"ed card-title\">V1 vs V2<\/h3><p class=\"ed card-desc\">예: ResNet-50은 TorchVision V1 76.13%, V2 80.86%로 가중치 학습법이 다릅니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">데이터 차이<\/div><h3 class=\"ed card-title\">ImageNet vs RPS<\/h3><p class=\"ed card-desc\">ImageNet에서 높은 정확도가 3분류 RPS에서도 가장 좋은 결과를 보장하지 않습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">하드웨어 차이<\/div><h3 class=\"ed card-title\">GFLOPs vs FPS<\/h3><p class=\"ed card-desc\">연산량이 적어도 메모리 이동이나 연산자 최적화가 좋지 않으면 느릴 수 있습니다.<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">실험 원칙<\/span><span class=\"ed take-text\">같은 데이터·같은 전처리·같은 테스트셋·같은 장치에서 비교해야 해석할 수 있습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.pytorch.org/vision/main/models.html\" target=\"_blank\" rel=\"noreferrer\">TorchVision 가중치 설명<\/a> · <a href=\"https://philipdekim-ond01.github.io/obsidian-blog/ondevice-ai-01-rps-tflite.html\" target=\"_blank\" rel=\"noreferrer\">RPS 블로그<\/a><\/div><div class=\"ed foot-note\">TorchVision 문서는 모델마다 weights.transforms() 사용을 권장합니다. 원 논문 수치와 표 수치를 섞지 마세요.<\/div><\/div><div class=\"foot-number\">16 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"04 · EVIDENCE"},{"name":"MobileNet V1 (2017): 연산량을 줄이다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">05 · EDGE MODELS<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">MobileNet V1 (2017): 연산량을 줄이다<\/h1><p class=\"ed slide-lead\">누가: Andrew G. Howard 연구팀 / 왜: 스마트폰과 임베디드 기기의 제한된 자원에서 CNN을 실행하기 위해<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">2017 · Mobile Vision<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">표준 합성곱을 Depthwise + Pointwise(1×1)로 분해<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">공간 특징 추출과 채널 혼합을 나눠 연산량을 줄임<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">모바일 CPU와 제한된 메모리를 고려한 설계<\/div><\/div><\/div><div class=\"panel diagram-panel\"><svg class=\"art\" viewBox=\"0 0 730 330\" role=\"img\" aria-label=\"일반 컨볼루션과 깊이별 분리 합성곱 비교\">\n      <g font-family=\"inherit\" fill=\"#233d58\"><text x=\"150\" y=\"45\" text-anchor=\"middle\" font-weight=\"800\" font-size=\"25\">일반 합성곱<\/text><text x=\"525\" y=\"45\" text-anchor=\"middle\" font-weight=\"800\" font-size=\"25\">Depthwise Separable<\/text><\/g>\n      <g transform=\"translate(24 94)\"><rect x=\"0\" y=\"8\" width=\"116\" height=\"144\" rx=\"14\" fill=\"#cce5f6\"/><rect x=\"22\" y=\"-5\" width=\"116\" height=\"144\" rx=\"14\" fill=\"#aacde6\"/><rect x=\"44\" y=\"-18\" width=\"116\" height=\"144\" rx=\"14\" fill=\"#86b8df\"/><rect x=\"69\" y=\"32\" width=\"66\" height=\"66\" fill=\"#517cb5\" opacity=\".8\"/><\/g>\n      <path d=\"M192 162h87m-10-9 11 9-11 9\" stroke=\"#416f9f\" stroke-width=\"4\" fill=\"none\"/><rect x=\"294\" y=\"105\" width=\"72\" height=\"116\" rx=\"13\" fill=\"#dbeee4\"/><text x=\"330\" y=\"169\" fill=\"#226649\" font-size=\"21\" text-anchor=\"middle\">출력<\/text>\n      <g transform=\"translate(403 115)\"><rect width=\"84\" height=\"112\" rx=\"12\" fill=\"#cfebf7\"/><rect x=\"14\" y=\"-15\" width=\"84\" height=\"112\" rx=\"12\" fill=\"#9ac9e9\"/><rect x=\"28\" y=\"-30\" width=\"84\" height=\"112\" rx=\"12\" fill=\"#79b7df\"/><\/g>\n      <path d=\"M512 164h37m-9-8 10 8-10 8\" stroke=\"#416f9f\" stroke-width=\"4\" fill=\"none\"/>\n      <rect x=\"558\" y=\"113\" width=\"62\" height=\"101\" rx=\"13\" fill=\"#d9f2e9\"/><path d=\"M563 135h52M563 157h52M563 179h52\" stroke=\"#84baaa\" stroke-width=\"4\"/>\n      <path d=\"M632 164h27m-9-8 10 8-10 8\" stroke=\"#416f9f\" stroke-width=\"4\" fill=\"none\"/>\n      <rect x=\"670\" y=\"113\" width=\"52\" height=\"101\" rx=\"13\" fill=\"#f6e5c7\"/>\n      <g fill=\"#2c4564\" font-size=\"20\" text-anchor=\"middle\"><text x=\"124\" y=\"278\">채널을 한 번에 혼합<\/text><text x=\"463\" y=\"278\">채널별 공간 필터<\/text><text x=\"654\" y=\"303\">1×1 혼합<\/text><\/g>\n      <\/svg><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">쉽게 설명하기<\/span><span class=\"ed take-text\">한 번에 모든 채널을 계산하지 말고, 채널별로 처리한 다음 결과를 섞습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1704.04861\" target=\"_blank\" rel=\"noreferrer\">Howard et al., MobileNets<\/a><\/div><div class=\"ed foot-note\">연산량 감소율은 커널 크기·채널 수·구현에 따라 달라집니다. 항상 동일한 비율로 빨라지는 것은 아닙니다.<\/div><\/div><div class=\"foot-number\">17 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"05 · EDGE MODELS"},{"name":"MobileNet V2 → V3 → V4: 무엇이 달라졌나?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">05 · EDGE MODELS<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">MobileNet V2 → V3 → V4: 무엇이 달라졌나?<\/h1><p class=\"ed slide-lead\">모바일 네트워크의 관심은 단순 소형화에서 실제 디바이스 지연시간까지 확장됐습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">Sandler 외<\/div><h3 class=\"ed card-title\">MobileNet V2 · 2018<\/h3><p class=\"ed card-desc\">Inverted Residual과 Linear Bottleneck으로 정보 손실과 계산 비용을 조절했습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">Howard 외<\/div><h3 class=\"ed card-title\">MobileNet V3 · 2019<\/h3><p class=\"ed card-desc\">NAS와 하드웨어 측정 및 경량 Attention으로 모바일 지연시간을 개선했습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">Qin 외<\/div><h3 class=\"ed card-title\">MobileNet V4 · 2024<\/h3><p class=\"ed card-desc\">Universal Inverted Bottleneck·Mobile MQA로 다양한 모바일 가속기 환경을 겨냥했습니다.<\/p><\/div><\/div><div class=\"progression\"><span>연산량<\/span><i>→<\/i><span>장치 지연시간<\/span><i>→<\/i><span>CPU·GPU·NPU 전체 생태계<\/span><\/div><div class=\"takeaway blue\"><span class=\"take-label\">반도체 설계 관점<\/span><span class=\"ed take-text\">모델 구조가 실제 NPU에서 빠르게 지원되는 연산자인지가 이제 핵심 경쟁력입니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1801.04381\" target=\"_blank\" rel=\"noreferrer\">MobileNetV2<\/a> · <a href=\"https://arxiv.org/abs/1905.02244\" target=\"_blank\" rel=\"noreferrer\">MobileNetV3<\/a> · <a href=\"https://arxiv.org/abs/2404.10518\" target=\"_blank\" rel=\"noreferrer\">MobileNetV4<\/a><\/div><div class=\"ed foot-note\">MobileNetV4 논문의 87% 결과는 대형 하이브리드 변형의 특정 학습·평가 조건이며, 작은 MobileNetV2와 직접 비교하면 안 됩니다.<\/div><\/div><div class=\"foot-number\">18 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"05 · EDGE MODELS"},{"name":"EfficientNet (2019): 균형 있게 확장하기","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">05 · EDGE MODELS<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">EfficientNet (2019): 균형 있게 확장하기<\/h1><p class=\"ed slide-lead\">누가: Mingxing Tan·Quoc V. Le / 왜: 정확도 개선 대비 모델 크기·연산량의 효율을 높이기 위해<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">2019 · Compound Scaling<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">Depth: 층을 더 깊게<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">Width: 채널을 더 넓게<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">Resolution: 입력 이미지를 더 선명하게<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">세 차원을 임의로 늘리지 않고 균형 있게 조정<\/div><\/div><\/div><div class=\"panel diagram-panel\"><svg class=\"art\" viewBox=\"0 0 720 315\" role=\"img\" aria-label=\"EfficientNet의 네트워크 깊이 너비 해상도 복합 확장\">\n      <g transform=\"translate(26 47)\"><rect width=\"202\" height=\"202\" rx=\"20\" fill=\"#deedff\" stroke=\"#91b8e8\"/><g fill=\"#638fd0\"><rect x=\"40\" y=\"52\" width=\"120\" height=\"17\" rx=\"6\"/><rect x=\"40\" y=\"82\" width=\"120\" height=\"17\" rx=\"6\"/><rect x=\"40\" y=\"112\" width=\"120\" height=\"17\" rx=\"6\"/><\/g><text x=\"101\" y=\"175\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"700\" fill=\"#2f5f9a\">Depth<\/text><\/g>\n      <g transform=\"translate(259 47)\"><rect width=\"202\" height=\"202\" rx=\"20\" fill=\"#e0f5eb\" stroke=\"#a3d5b8\"/><g fill=\"#4caa84\"><rect x=\"26\" y=\"55\" width=\"26\" height=\"88\" rx=\"5\"/><rect x=\"65\" y=\"55\" width=\"26\" height=\"88\" rx=\"5\"/><rect x=\"104\" y=\"55\" width=\"26\" height=\"88\" rx=\"5\"/><rect x=\"143\" y=\"55\" width=\"26\" height=\"88\" rx=\"5\"/><\/g><text x=\"101\" y=\"175\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"700\" fill=\"#236c50\">Width<\/text><\/g>\n      <g transform=\"translate(492 47)\"><rect width=\"202\" height=\"202\" rx=\"20\" fill=\"#f7e8dc\" stroke=\"#e9c19e\"/><rect x=\"39\" y=\"45\" width=\"122\" height=\"100\" rx=\"8\" fill=\"#ffca9b\"/><g stroke=\"#d88c54\"><path d=\"M70 45v100M100 45v100M130 45v100M39 70h122M39 95h122M39 120h122\"/><\/g><text x=\"101\" y=\"175\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"700\" fill=\"#986332\">Resolution<\/text><\/g>\n      <text x=\"360\" y=\"296\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#354e64\">세 차원을 함께 조절하여 효율 최적화<\/text><\/svg><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">핵심<\/span><span class=\"ed take-text\">세 가지 자원을 함께 조절하는 것이 한 차원만 크게 늘리는 것보다 효율적일 수 있습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1905.11946\" target=\"_blank\" rel=\"noreferrer\">Tan &amp; Le, EfficientNet<\/a><\/div><div class=\"ed foot-note\">EfficientNet은 복합 스케일링을 제안한 모델 계열입니다. 각 변형(B0~B7)의 입력 해상도와 연산량은 서로 다릅니다.<\/div><\/div><div class=\"foot-number\">19 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"05 · EDGE MODELS"},{"name":"이미지 분류에서 객체 탐지로","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">이미지 분류에서 객체 탐지로<\/h1><p class=\"ed slide-lead\">CNN이 “무엇인가?”를 잘 맞힌 다음 문제는 “정확히 어디에 있는가?”였습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"wide-visual\"><svg class=\"art\" viewBox=\"0 0 1090 340\" role=\"img\" aria-label=\"분류 결과와 박스 탐지 및 분할 결과 비교\">\n    <defs><pattern id=\"gridD\" width=\"25\" height=\"25\" patternUnits=\"userSpaceOnUse\"><path d=\"M25 0H0V25\" fill=\"none\" stroke=\"#ffffff88\" stroke-width=\"2\"/><\/pattern><\/defs>\n    <g font-family=\"Arial,sans-serif\" text-anchor=\"middle\" font-weight=\"800\" font-size=\"22\" fill=\"#2f5875\"><text x=\"185\" y=\"36\">Classification<\/text><text x=\"550\" y=\"36\">Detection<\/text><text x=\"915\" y=\"36\">Segmentation<\/text><\/g>\n    <g><rect x=\"34\" y=\"58\" width=\"302\" height=\"222\" rx=\"18\" fill=\"#cee6f7\"/><rect x=\"394\" y=\"58\" width=\"302\" height=\"222\" rx=\"18\" fill=\"#cee6f7\"/><rect x=\"758\" y=\"58\" width=\"302\" height=\"222\" rx=\"18\" fill=\"#cee6f7\"/><\/g>\n    <g fill=\"#83a5bc\"><path d=\"M108 109h136v126H108zM469 109h136v126H469zM831 109h136v126H831z\"/><\/g><g stroke=\"#fdf0ca\" stroke-width=\"15\"><path d=\"M133 135l81 82M494 135l81 82M856 135l81 82\"/><\/g>\n    <rect x=\"113\" y=\"115\" width=\"124\" height=\"113\" fill=\"url(#gridD)\"/><rect x=\"477\" y=\"124\" width=\"94\" height=\"105\" rx=\"3\" fill=\"none\" stroke=\"#eb653f\" stroke-width=\"6\"/><path d=\"M845 125l35-4 18 36 25 19 18 45-27 9-31-31-36-10z\" fill=\"#e06f5380\" stroke=\"#c24c34\" stroke-width=\"3\"/>\n    <g font-size=\"18\" fill=\"#365c76\" text-anchor=\"middle\"><text x=\"185\" y=\"313\">결함 사진 → 결함 여부<\/text><text x=\"545\" y=\"313\">결함 사진 → 위치·유형<\/text><text x=\"915\" y=\"313\">결함 사진 → 픽셀 영역<\/text><\/g><\/svg><\/div><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">정확도 Top-1<\/div><h3 class=\"ed card-title\">Classification<\/h3><p class=\"ed card-desc\">전체 이미지 1개에 범주를 부여합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">COCO mAP<\/div><h3 class=\"ed card-title\">Detection<\/h3><p class=\"ed card-desc\">여러 객체에 박스와 라벨을 예측합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">Mask IoU / mIoU<\/div><h3 class=\"ed card-title\">Segmentation<\/h3><p class=\"ed card-desc\">객체 또는 영역을 픽셀 단위로 구분합니다.<\/p><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://openaccess.thecvf.com/content_cvpr_2016/html/Redmon_You_Only_Look_CVPR_2016_paper.html\" target=\"_blank\" rel=\"noreferrer\">YOLO 원 논문<\/a> · <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">YOLO26 멀티태스크<\/a><\/div><div class=\"ed foot-note\">산업 이미지에 결함이 하나만 있지 않을 수 있습니다. 분류 정확도와 탐지 mAP는 지표가 달라 직접 비교할 수 없습니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"왜 R-CNN에서 YOLO로 바뀌었을까?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">왜 R-CNN에서 YOLO로 바뀌었을까?<\/h1><p class=\"ed slide-lead\">객체 후보를 각각 검사하는 방식에서 이미지 전체를 한 번에 예측하는 방식으로 전환했습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"two-panels\"><div class=\"panel comparison-box\"><div class=\"comparison-head\">R-CNN 계열 · Two-stage<\/div><div class=\"flowline\"><div class=\"path-box \">후보 영역<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">영역별 특징<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">박스·클래스<\/div><\/div><p class=\"ed \">후보 영역을 만들어 검사하므로 처리 과정이 복잡해질 수 있습니다.<\/p><\/div><div class=\"panel comparison-box\"><div class=\"comparison-head green\">YOLO 계열 · One-stage<\/div><div class=\"flowline\"><div class=\"path-box \">전체 이미지<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">특징맵<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">박스·클래스<\/div><\/div><p class=\"ed \">하나의 네트워크에서 탐지 결과를 직접 예측합니다.<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">개발 목적<\/span><span class=\"ed take-text\">실시간 카메라 영상에서 객체 탐지를 수행하려면 높은 정확도뿐 아니라 짧은 지연시간이 필요했습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://openaccess.thecvf.com/content_cvpr_2016/html/Redmon_You_Only_Look_CVPR_2016_paper.html\" target=\"_blank\" rel=\"noreferrer\">Redmon et al., CVPR 2016<\/a><\/div><div class=\"ed foot-note\">현대 YOLO 계열도 Neck·Head·후처리 등 여러 단계를 포함합니다. “한 번에”는 한 번의 네트워크 전달로 후보와 분류를 함께 예측한다는 뜻입니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"YOLOv1 (2016): 누가, 왜, 무엇을 만들었나?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">YOLOv1 (2016): 누가, 왜, 무엇을 만들었나?<\/h1><p class=\"ed slide-lead\">Joseph Redmon · Santosh Divvala · Ross Girshick · Ali Farhadi / 실시간 객체 탐지를 목표로 개발<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">CVPR 2016 · You Only Look Once<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">하나의 네트워크가 이미지 전체에서 박스 좌표와 클래스 확률을 함께 예측<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">원 논문은 기본 YOLO 45 FPS, Fast YOLO 155 FPS를 보고<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">객체 탐지의 속도를 높였지만, 위치 예측 오차는 개선 과제로 남음<\/div><\/div><\/div><div class=\"panel\"><div class=\"big-number\">45<\/div><h3 class=\"ed \">FPS · 최초 YOLO 기본 모델<\/h3><p class=\"ed small-muted\">원 논문 보고값 / 당시 연구 환경<\/p><div class=\"flowline\"><div class=\"path-box \">이미지<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">한 번의 추론<\/div><div class=\"path-arrow\">→<\/div><div class=\"path-box \">박스·클래스<\/div><\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">핵심<\/span><span class=\"ed take-text\">YOLO의 혁신은 “분류 정확도 1위”가 아니라 “실시간 객체 탐지를 하나의 예측 문제로 통합”한 것입니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://openaccess.thecvf.com/content_cvpr_2016/html/Redmon_You_Only_Look_CVPR_2016_paper.html\" target=\"_blank\" rel=\"noreferrer\">YOLO, CVPR 2016<\/a><\/div><div class=\"ed foot-note\">45 FPS와 155 FPS는 원 논문 보고값입니다. 최신 Raspberry Pi 5 또는 현재 GPU에서의 실측값이 아닙니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"YOLO의 주요 변천사: 2016년에서 2026년까지","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">YOLO의 주요 변천사: 2016년에서 2026년까지<\/h1><p class=\"ed slide-lead\">단순한 버전 숫자 경쟁이 아니라 제작 팀·훈련 방식·후처리 전략도 함께 달라졌습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"timeline\"><div class=\"era\"><span class=\"yr\">2016<\/span><strong class=\"ed\">YOLOv1<\/strong><em class=\"ed\">Redmon 외 / 통합 탐지<\/em><\/div><div class=\"era\"><span class=\"yr\">2018<\/span><strong class=\"ed\">YOLOv3<\/strong><em class=\"ed\">Redmon·Farhadi / 다중 스케일<\/em><\/div><div class=\"era\"><span class=\"yr\">2020<\/span><strong class=\"ed\">YOLOv5<\/strong><em class=\"ed\">Ultralytics / 실용적 PyTorch<\/em><\/div><div class=\"era\"><span class=\"yr\">2023<\/span><strong class=\"ed\">YOLOv8<\/strong><em class=\"ed\">Ultralytics / Anchor-free<\/em><\/div><div class=\"era\"><span class=\"yr\">2024–26<\/span><strong class=\"ed\">YOLO11 → YOLO26<\/strong><em class=\"ed\">경량화·NMS-free 선택<\/em><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">반드시 기억<\/span><span class=\"ed take-text\">YOLO의 모든 버전이 한 연구팀의 연속 작품은 아닙니다. YOLO11은 “v” 없이 표기하며 YOLO26은 2026년 출시입니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/1804.02767\" target=\"_blank\" rel=\"noreferrer\">YOLOv3<\/a> · <a href=\"https://docs.ultralytics.com/models/yolov5/\" target=\"_blank\" rel=\"noreferrer\">Ultralytics 모델 연혁<\/a> · <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">YOLO26<\/a><\/div><div class=\"ed foot-note\">대표적인 분기만 표시했습니다. YOLOv4, v6, v7, v9, v10 등 독립 연구 계열도 존재하며 숫자만으로 우열을 판단할 수 없습니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"YOLO의 공통 구조: Backbone–Neck–Head","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">YOLO의 공통 구조: Backbone–Neck–Head<\/h1><p class=\"ed slide-lead\">특징을 추출하고, 여러 크기의 정보를 합친 뒤, 클래스·박스를 예측합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"wide-visual\"><svg class=\"art\" viewBox=\"0 0 1140 350\" role=\"img\" aria-label=\"YOLO Backbone Neck Head 구조\">\n    <defs><marker id=\"arrY\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8\" fill=\"#4477a3\"/><\/marker><\/defs>\n    <g font-size=\"24\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#244961\">\n    <rect x=\"18\" y=\"82\" width=\"174\" height=\"180\" rx=\"17\" fill=\"#deedfa\" stroke=\"#bed9ed\"/><text x=\"105\" y=\"148\">입력 이미지<\/text><text x=\"105\" y=\"182\" font-size=\"17\">640×640 예시<\/text>\n    <rect x=\"239\" y=\"82\" width=\"220\" height=\"180\" rx=\"17\" fill=\"#d7eef1\" stroke=\"#a9d6d6\"/><text x=\"349\" y=\"140\">Backbone<\/text><text x=\"349\" y=\"174\" font-size=\"19\">특징 추출<\/text><text x=\"349\" y=\"206\" font-size=\"16\" fill=\"#658c90\">다양한 크기의 특징맵<\/text>\n    <rect x=\"504\" y=\"82\" width=\"220\" height=\"180\" rx=\"17\" fill=\"#e2f4e4\" stroke=\"#bbdfc0\"/><text x=\"614\" y=\"140\">Neck<\/text><text x=\"614\" y=\"174\" font-size=\"19\">다중 스케일 융합<\/text><text x=\"614\" y=\"206\" font-size=\"16\" fill=\"#6b9774\">작은·큰 물체 정보 통합<\/text>\n    <rect x=\"769\" y=\"82\" width=\"220\" height=\"180\" rx=\"17\" fill=\"#f8ead9\" stroke=\"#eacaa3\"/><text x=\"879\" y=\"140\">Head<\/text><text x=\"879\" y=\"174\" font-size=\"19\">클래스·박스 예측<\/text><text x=\"879\" y=\"206\" font-size=\"16\" fill=\"#ab895d\">후처리 여부는 버전별 상이<\/text>\n    <rect x=\"1019\" y=\"82\" width=\"108\" height=\"180\" rx=\"16\" fill=\"#e8e7fa\" stroke=\"#d0cdf1\"/><text x=\"1073\" y=\"150\" font-size=\"20\">탐지<\/text><text x=\"1073\" y=\"179\" font-size=\"18\">결과<\/text><\/g>\n    <g stroke=\"#4477a3\" stroke-width=\"4\" marker-end=\"url(#arrY)\"><path d=\"M193 173h41M459 173h40M724 173h40M989 173h25\"/><\/g>\n    <text x=\"568\" y=\"319\" fill=\"#53758c\" font-size=\"21\" text-anchor=\"middle\">큰 물체만큼 작은 결함도 놓치지 않기 위해 다중 크기 특징을 결합<\/text><\/svg><\/div><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">특징 추출<\/div><h3 class=\"ed card-title\">Backbone<\/h3><p class=\"ed card-desc\">밝기, 모서리, 질감 등 시각 특징을 계층적으로 추출<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">특징 융합<\/div><h3 class=\"ed card-title\">Neck<\/h3><p class=\"ed card-desc\">고해상도와 저해상도 특징을 합쳐 작은 물체도 찾도록 도움<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">최종 예측<\/div><h3 class=\"ed card-title\">Head<\/h3><p class=\"ed card-desc\">객체 클래스와 좌표를 예측하고 배포 모드에 따라 후처리<\/p><\/div><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.ultralytics.com/guides/yolo-architecture/\" target=\"_blank\" rel=\"noreferrer\">Ultralytics 구조 가이드<\/a><\/div><div class=\"ed foot-note\">교육용 표준화 도식입니다. 실제 YOLO 버전마다 Neck 구성과 Head의 NMS·DFL 사용 여부가 다릅니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"탐지 성능은 Top-1이 아니라 mAP로 읽는다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">탐지 성능은 Top-1이 아니라 mAP로 읽는다<\/h1><p class=\"ed slide-lead\">객체를 맞혔는지뿐 아니라 박스가 실제 위치와 얼마나 겹치는지 평가합니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">IoU: 예측 박스와 정답 박스의 겹침<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">IoU = 교집합 면적 ÷ 합집합 면적<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">Precision·Recall: 검출 결과의 정확성과 놓친 객체를 함께 평가<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">COCO mAP₅₀:₉₅: IoU 기준 0.50~0.95에서 평균 AP를 계산<\/div><\/div><\/div><div class=\"panel\"><svg viewBox=\"0 0 490 280\" class=\"art\" aria-label=\"예측 박스와 실제 박스 중첩\"><rect x=\"55\" y=\"35\" width=\"290\" height=\"190\" fill=\"#dbeef8\" rx=\"10\"/><rect x=\"104\" y=\"68\" width=\"185\" height=\"128\" fill=\"#e5a29f55\" stroke=\"#cc635b\" stroke-width=\"6\"/><rect x=\"158\" y=\"94\" width=\"180\" height=\"118\" fill=\"#76baa655\" stroke=\"#278b73\" stroke-width=\"6\"/><text x=\"112\" y=\"61\" font-size=\"18\" fill=\"#c15955\">GT<\/text><text x=\"329\" y=\"240\" font-size=\"18\" fill=\"#217b64\">Prediction<\/text><\/svg><div class=\"equation\">IoU = |GT ∩ Pred| / |GT ∪ Pred|<\/div><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">주의<\/span><span class=\"ed take-text\">ImageNet 정확도 80%와 COCO mAP 50%는 지표가 완전히 달라 한 그래프에 섞을 수 없습니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://cocodataset.org/#detection-eval\" target=\"_blank\" rel=\"noreferrer\">COCO 평가 기준<\/a> · <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">YOLO26 벤치마크<\/a><\/div><div class=\"ed foot-note\">COCO mAP₅₀:₉₅는 다양한 IoU 임계값의 AP를 평균합니다. AP는 정밀도–재현율 곡선을 기반으로 계산합니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"YOLO26 (2026): 엣지 배포를 다시 설계하다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">YOLO26 (2026): 엣지 배포를 다시 설계하다<\/h1><p class=\"ed slide-lead\">Ultralytics가 2026년 1월 공개한 계열: 경량 Head와 선택적 NMS-free 추론에 초점<\/p><\/div>\n      <div class=\"main\"><div class=\"four-grid\"><div class=\"info-card \"><div class=\"card-top\">END-TO-END<\/div><h3 class=\"ed card-title\">NMS-free 선택 가능<\/h3><p class=\"ed card-desc\">One-to-one 예측 Head로 별도 NMS 단계 없이 실행할 수 있습니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">LIGHTER HEAD<\/div><h3 class=\"ed card-title\">DFL 제거<\/h3><p class=\"ed card-desc\">박스 회귀 Head를 단순화해 내보내기와 실행 부담을 낮춥니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">SMALL TARGET<\/div><h3 class=\"ed card-title\">Small-object 대응<\/h3><p class=\"ed card-desc\">STAL 등 학습 기법으로 작은 물체의 양성 샘플 할당을 개선합니다.<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">DEPLOYMENT<\/div><h3 class=\"ed card-title\">다양한 배포<\/h3><p class=\"ed card-desc\">ONNX·TensorRT·CoreML·OpenVINO 등 목표 플랫폼을 고려합니다.<\/p><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">정확한 구분<\/span><span class=\"ed take-text\">YOLO26에서 NMS-free는 선택할 수 있는 추론 경로입니다. 모든 설정이 자동으로 NMS-free가 되는 것은 아닙니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">Ultralytics 공식 YOLO26<\/a> · <a href=\"https://docs.ultralytics.com/guides/yolo-architecture/\" target=\"_blank\" rel=\"noreferrer\">아키텍처 가이드<\/a><\/div><div class=\"ed foot-note\">Ultralytics 문서 기준(2026-11 확인). 기본 one-to-many 경로는 NMS를 사용하며 one-to-one 경로는 nms=False로 선택할 수 있습니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"YOLO26: 정확도는 높아지지만 모델도 커진다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">YOLO26: 정확도는 높아지지만 모델도 커진다<\/h1><p class=\"ed slide-lead\">COCO val mAP₅₀:₉₅ · NMS-free(e2e) 경로 기준 / 숫자는 공식 공개 표에서 확인<\/p><\/div>\n      <div class=\"main\"><div class=\"viz-block\"><div class=\"viz-title\">COCO mAP₅₀:₉₅ (e2e) · YOLO26 5개 크기<\/div><div class=\"chart-mount\" data-chart=\"yolo_map\"><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">해석<\/span><span class=\"ed take-text\">Nano는 엣지 배포 후보로 검토하기 쉽지만, 더 큰 모델일수록 일반적으로 탐지 정확도가 증가하고 계산 비용도 늘어납니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">Ultralytics YOLO26 공식 성능표<\/a><\/div><div class=\"ed foot-note\">n/s/m/l/x는 서로 다른 모델 크기입니다. COCO 이미지 640px, mAP(e2e)와 T4 TensorRT10 공식 측정값을 사용합니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"YOLO26: 추론속도와 정확도를 함께 봐야 한다","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">YOLO26: 추론속도와 정확도를 함께 봐야 한다<\/h1><p class=\"ed slide-lead\">같은 COCO 검증 데이터라도 초당 처리속도는 하드웨어와 변환 형식에 따라 달라집니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"viz-block\"><div class=\"viz-title\">T4 TensorRT10 추론 지연시간 (ms) · NMS-free Head<\/div><div class=\"chart-mount\" data-chart=\"yolo_latency\"><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">해석<\/span><span class=\"ed take-text\">T4에서 1.7ms인 YOLO26n이 Raspberry Pi 5에서도 같은 속도라는 뜻은 아닙니다. 목표 장치에서 다시 측정해야 합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://docs.ultralytics.com/models/yolo26/\" target=\"_blank\" rel=\"noreferrer\">Ultralytics YOLO26 공식 성능표<\/a><\/div><div class=\"ed foot-note\">지연시간 수치는 NVIDIA T4 + TensorRT10에서의 공식 보고값입니다. CPU ONNX·RPi 5·실시간 카메라 전체 파이프라인의 FPS로 해석하지 마세요.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"반도체 검사: 분류로 끝낼까, 위치를 찾을까?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">06 · OBJECT DETECTION<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">반도체 검사: 분류로 끝낼까, 위치를 찾을까?<\/h1><p class=\"ed slide-lead\">같은 결함 이미지라도 현장 의사결정은 출력 형태에 따라 달라집니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"three-cards\"><div class=\"info-card \"><div class=\"card-top\">Pass/Fail·유형<\/div><h3 class=\"ed card-title\">DenseNet 분류<\/h3><p class=\"ed card-desc\">“이 웨이퍼에 스크래치가 있는가?” 전체 이미지의 불량 여부·유형을 예측<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">Bounding Box<\/div><h3 class=\"ed card-title\">YOLO 탐지<\/h3><p class=\"ed card-desc\">“스크래치가 어디에 몇 개 있는가?” 복수 결함 위치를 박스로 표시<\/p><\/div><div class=\"info-card \"><div class=\"card-top\">Feature Embedding<\/div><h3 class=\"ed card-title\">DINO 특징<\/h3><p class=\"ed card-desc\">정답 라벨이 부족할 때 유사 패턴과 잠재적 이상 영역을 분석할 표현 제공<\/p><\/div><\/div><div class=\"wide-visual\" style=\"max-height:248px\"><svg class=\"art\" viewBox=\"0 0 1090 340\" role=\"img\" aria-label=\"분류 결과와 박스 탐지 및 분할 결과 비교\">\n    <defs><pattern id=\"gridD\" width=\"25\" height=\"25\" patternUnits=\"userSpaceOnUse\"><path d=\"M25 0H0V25\" fill=\"none\" stroke=\"#ffffff88\" stroke-width=\"2\"/><\/pattern><\/defs>\n    <g font-family=\"Arial,sans-serif\" text-anchor=\"middle\" font-weight=\"800\" font-size=\"22\" fill=\"#2f5875\"><text x=\"185\" y=\"36\">Classification<\/text><text x=\"550\" y=\"36\">Detection<\/text><text x=\"915\" y=\"36\">Segmentation<\/text><\/g>\n    <g><rect x=\"34\" y=\"58\" width=\"302\" height=\"222\" rx=\"18\" fill=\"#cee6f7\"/><rect x=\"394\" y=\"58\" width=\"302\" height=\"222\" rx=\"18\" fill=\"#cee6f7\"/><rect x=\"758\" y=\"58\" width=\"302\" height=\"222\" rx=\"18\" fill=\"#cee6f7\"/><\/g>\n    <g fill=\"#83a5bc\"><path d=\"M108 109h136v126H108zM469 109h136v126H469zM831 109h136v126H831z\"/><\/g><g stroke=\"#fdf0ca\" stroke-width=\"15\"><path d=\"M133 135l81 82M494 135l81 82M856 135l81 82\"/><\/g>\n    <rect x=\"113\" y=\"115\" width=\"124\" height=\"113\" fill=\"url(#gridD)\"/><rect x=\"477\" y=\"124\" width=\"94\" height=\"105\" rx=\"3\" fill=\"none\" stroke=\"#eb653f\" stroke-width=\"6\"/><path d=\"M845 125l35-4 18 36 25 19 18 45-27 9-31-31-36-10z\" fill=\"#e06f5380\" stroke=\"#c24c34\" stroke-width=\"3\"/>\n    <g font-size=\"18\" fill=\"#365c76\" text-anchor=\"middle\"><text x=\"185\" y=\"313\">결함 사진 → 결함 여부<\/text><text x=\"545\" y=\"313\">결함 사진 → 위치·유형<\/text><text x=\"915\" y=\"313\">결함 사진 → 픽셀 영역<\/text><\/g><\/svg><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://openaccess.thecvf.com/content_cvpr_2016/html/Redmon_You_Only_Look_CVPR_2016_paper.html\" target=\"_blank\" rel=\"noreferrer\">YOLO 원 논문<\/a> · <a href=\"https://ai.meta.com/research/publications/dinov3/\" target=\"_blank\" rel=\"noreferrer\">DINOv3<\/a><\/div><div class=\"ed foot-note\">DINO 특징맵이 곧바로 결함 검출 완성 시스템을 의미하지 않습니다. 실제 탐지·이상탐지 Head, 임계값 설계 및 검증이 필요합니다.<\/div><\/div><div class=\"foot-number\">32 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"06 · OBJECT DETECTION"},{"name":"ViT (2020)와 ConvNeXt (2022): CNN 다음은?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">07 · BEYOND CNN<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">ViT (2020)와 ConvNeXt (2022): CNN 다음은?<\/h1><p class=\"ed slide-lead\">Vision Transformer는 이미지를 패치로 보고, ConvNeXt는 CNN을 현대적으로 재설계했습니다.<\/p><\/div>\n      <div class=\"main\"><div class=\"split\"><div><div class=\"year-tag\">비전 AI의 구조 다양화<\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">ViT: 이미지를 패치 토큰으로 나누고 Self-Attention으로 관계를 학습<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">ConvNeXt: Transformer 시대의 설계 요소를 CNN에 적용해 경쟁력을 재평가<\/div><\/div><div class=\"talk-point\"><span class=\"dot\"><\/span><div class=\"ed\">결론: CNN은 사라지지 않았고, 용도에 따라 ViT와 공존<\/div><\/div><\/div><div class=\"panel diagram-panel\"><svg class=\"art\" viewBox=\"0 0 730 330\" role=\"img\" aria-label=\"Vision Transformer 이미지 패치와 어텐션 구조\">\n    <rect x=\"30\" y=\"59\" width=\"192\" height=\"192\" rx=\"12\" fill=\"#a8d3fa\"/><path d=\"M52 204l56-106 64 106\" fill=\"#407bb1\" opacity=\".76\"/>\n    <g stroke=\"#f5fbff\" stroke-width=\"3\" opacity=\".9\"><path d=\"M78 59v192M126 59v192M174 59v192M30 107h192M30 155h192M30 203h192\"/><\/g>\n    <path d=\"M246 155h67m-11-8 12 8-12 8\" stroke=\"#4777b0\" stroke-width=\"4\" fill=\"none\"/>\n    <g transform=\"translate(330 65)\"><rect x=\"0\" y=\"0\" width=\"85\" height=\"185\" rx=\"13\" fill=\"#dfedf9\"/><g fill=\"#789acb\"><rect x=\"17\" y=\"17\" width=\"50\" height=\"22\" rx=\"5\"/><rect x=\"17\" y=\"51\" width=\"50\" height=\"22\" rx=\"5\"/><rect x=\"17\" y=\"85\" width=\"50\" height=\"22\" rx=\"5\"/><rect x=\"17\" y=\"119\" width=\"50\" height=\"22\" rx=\"5\"/><\/g><\/g>\n    <path d=\"M431 155h66m-10-8 11 8-11 8\" stroke=\"#4777b0\" stroke-width=\"4\" fill=\"none\"/>\n    <g transform=\"translate(510 65)\"><rect x=\"0\" y=\"0\" width=\"175\" height=\"185\" rx=\"15\" fill=\"#d9f1e8\"/><g stroke=\"#57a98a\" stroke-width=\"2\" opacity=\".75\"><path d=\"M35 40L90 95L150 40M35 95L90 40L150 95M35 150L90 95L150 150M35 40L150 150M150 40L35 150\"/><\/g><g fill=\"#1f9075\"><circle cx=\"35\" cy=\"40\" r=\"11\"/><circle cx=\"150\" cy=\"40\" r=\"11\"/><circle cx=\"90\" cy=\"95\" r=\"11\"/><circle cx=\"35\" cy=\"150\" r=\"11\"/><circle cx=\"150\" cy=\"150\" r=\"11\"/><\/g><\/g>\n    <g font-size=\"20\" fill=\"#284867\" text-anchor=\"middle\" font-weight=\"700\"><text x=\"126\" y=\"287\">이미지 패치 분할<\/text><text x=\"375\" y=\"287\">토큰 시퀀스<\/text><text x=\"595\" y=\"287\">Self-Attention<\/text><\/g><\/svg><\/div><\/div><div class=\"takeaway blue\"><span class=\"take-label\">선택 기준<\/span><span class=\"ed take-text\">작은 엣지 장치에서는 정확도뿐 아니라 연산자 지원, 메모리, 변환 가능성도 확인해야 합니다.<\/span><\/div><\/div>\n      <footer class=\"slide-footer\"><div class=\"foot-area\"><div class=\"foot-source\"><span>출처<\/span> <a href=\"https://arxiv.org/abs/2010.11929\" target=\"_blank\" rel=\"noreferrer\">ViT 원 논문<\/a> · <a href=\"https://arxiv.org/abs/2201.03545\" target=\"_blank\" rel=\"noreferrer\">ConvNeXt 원 논문<\/a><\/div><div class=\"ed foot-note\">ViT와 ConvNeXt를 같은 전처리·규모에서 비교하지 않는다면 단순한 우열을 결론 내릴 수 없습니다.<\/div><\/div><div class=\"foot-number\">20 <span>/<\/span> <span class=\"total-n\">00<\/span><\/div><\/footer>\n    <\/div>","section":"07 · BEYOND CNN"},{"name":"ViT (2020/2021): CNN 필터 없이 이미지를 볼 수 있을까?","html":"<div class=\"page-inner white\">\n      <div class=\"top-rule\"><\/div>\n      <div class=\"topline\"><span class=\"section-tag\">07 · VISION TRANSFORMER<\/span><span class=\"deckbrand\">김임환 교수 · 삼성전자 DS교수실<\/span><\/div>\n      <div class=\"head-block\"><h1 class=\"ed slide-heading \">ViT (2020/2021): CNN 필터 없이 이미지를 볼 수 있을까?<\/h1><p class=\"ed slide-lead\">Alexey Dosovitskiy 연구팀 · 2020년 사전 공개, ICLR 2021 / Transformer를 이미지에 적용<\/p><\/div>\n      <div class=\"main\"><div class=\"wide-visual\"><svg class=\"art\" viewBox=\"0 0 1100 345\" role=\"img\" aria-label=\"이미지를 16x16 패치로 분할하고 토큰 간 self attention을 계산하는 ViT\">\n    <defs><marker id=\"aViT\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8\" fill=\"#4a83b2\"/><\/marker><\/defs>\n    <rect x=\"30\" y=\"55\" width=\"237\" height=\"237\" rx=\"14\" fill=\"#acdaec\"/><path d=\"M75 242l93-136 64 136\" fill=\"#4e88b5\"/><g stroke=\"#fff\" stroke-width=\"3\"><path d=\"M89 55v237M149 55v237M208 55v237M30 114h237M30 173h237M30 232h237\"/><\/g>\n    <g fill=\"none\" stroke=\"#4a83b2\" stroke-width=\"4\" marker-end=\"url(#aViT)\"><path d=\"M286 174h78M556 174h77M832 174h59\"/><\/g>\n    <g fill=\"#e3eef8\" stroke=\"#7ea8c8\"><rect x=\"380\" y=\"79\" width=\"160\" height=\"188\" rx=\"14\"/><rect x=\"409\" y=\"100\" width=\"44\" height=\"35\" rx=\"7\"/><rect x=\"467\" y=\"100\" width=\"44\" height=\"35\" rx=\"7\"/><rect x=\"409\" y=\"148\" width=\"44\" height=\"35\" rx=\"7\"/><rect x=\"467\" y=\"148\" width=\"44\" height=\"35\" rx=\"7\"/><rect x=\"409\" y=\"196\" width=\"44\" height=\"35\" rx=\"7\"/><rect x=\"467\" y=\"196\" width=\"44\" height=\"35\" rx=\"7\"/><\/g>\n    <g stroke=\"#54a696\" stroke-width=\"2\" fill=\"#e1f3ee\"><rect x=\"644\" y=\"70\" width=\"181\" height=\"204\" rx=\"15\"/><path d=\"M674 106L791 230M791 106L674 230M674 170L791 106M674 230L791 170M791 230L674 170\"/><\/g>\n    <g fill=\"#dfebfb\" stroke=\"#83add4\"><rect x=\"905\" y=\"90\" width=\"171\" height=\"164\" rx=\"15\"/><\/g><g fill=\"#2c78a8\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"800\"><text x=\"992\" y=\"155\">클래스<\/text><text x=\"992\" y=\"189\">확률<\/text><\/g>\n    <g fill=\"#325879\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\"><text x=\"148\" y=\"324\">이미지 → 패치<\/text><text x=\"459\" y=\"324\">패치 → 토큰<\/text><text x=\"734\" y=\"324\">Self-Attention<\/text
